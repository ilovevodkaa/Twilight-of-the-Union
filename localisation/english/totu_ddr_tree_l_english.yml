l_english:
 # GDR focus tree: tooltips, events and opinion modifiers of the hand-written parts.
 # Written by the branch designs (merged by scratchpad merge.py); focus and spirit texts: totu_focus_DDR.
 # political
 DDR_pol_election_rules_tt:0 "§Y18 March§!: the Volkskammer election. If §Ycommunism§! is more popular than §Ydemocracy§!, the PDS keeps power. Otherwise the Alliance for Germany wins if the GDR has accepted the §Ycurrency union§!, and the SPD if it has not."
 DDR_election_law_tt:0 "The first focus of the government elected on 18 March gives §Y50§! more political power."
 DDR_party_of_democratic_socialism_tt:0 "The party is now called the §YPDS§!."
 DDR_pol_moscow_visit_tt:0 "Moscow is ready to discuss German unification."
 DDR_pol_bonn_visit_tt:0 "Bonn offers a §Ycurrency union§!."
 DDR_pol_currency_union_tt:0 "If §Ydemocracy§! is more popular than §Ycommunism§! at the 18 March election, the Alliance for Germany wins."
 DDR_unity_without_haste_tt:0 "If §Ydemocracy§! is more popular than §Ycommunism§! at the 18 March election, the SPD wins."
 DDR_pol_for_our_country_tt:0 "If §Ycommunism§! is more popular than §Ydemocracy§! at the 18 March election, the PDS keeps power."
 DDR_pol_austrian_offer_tt:0 "The GDR offers Moscow the §YAustrian option§!, and the USSR decides. If it agrees, the GDR leaves the §YWarsaw Pact§!."
 DDR_pol_before_election_tt:0 "Before the Volkskammer election of 18 March"
 DDR_pol_modrow_in_office_tt:0 "Modrow heads the government (before the 18 March election, or under a PDS government)"
 DDR_pol_question_open_tt:0 "The German question is still open: no unification, no referendum called"
 DDR_pol_talks_running_tt:0 "Unification talks are running: the German question is open and not frozen"
 DDR_pol_kremlin_hardliners_tt:0 "Hard-liners hold the Kremlin: Gorbachev has been removed at Foros or a state of emergency is in force"
 DDR_pol_kremlin_reformers_tt:0 "Hard-liners do not hold the Kremlin"
 DDR_pol_in_warsaw_pact_tt:0 "The GDR is still in the Warsaw Pact"
 DDR_pol_left_warsaw_pact_tt:0 "The GDR has left the Warsaw Pact"
 DDR_pol_soviet_consent_tt:0 "Moscow has agreed to Two Plus Four (the USSR's decision when the unification scale first reached §Y75%§!), or the GDR no longer depends on the USSR"
 DDR_pol_no_soviet_veto_tt:0 "Moscow has not vetoed unification"
 DDR_pol_autonomy_principles:0 "Constitutional principles"
 DDR_pol_autonomy_moscow:0 "A call from the Kremlin"
 TOTU_ddr_hva_dissolved:0 "Intelligence wound up quietly"
 TOTU_ddr_neutrality:0 "A neutral Germany"
 TOTU_ddr_neutrality_fears:0 "Germany outside NATO"
 TOTU_ddr_genscher:0 "The Genscher formula"
 TOTU_ddr_treaty_community:0 "Treaty community"
 TOTU_ddr_moratorium:0 "Moratorium on talks"
 TOTU_ddr_two_plus_four:0 "The Two Plus Four Treaty"
 TOTU_ddr_hardline_ally:0 "A loyal ally"
 TOTU_ddr_files_koblenz:0 "Stasi archives in Koblenz"
 TOTU_ddr_charter_of_paris:0 "The Charter of Paris"
 totu_ddr_pol.1.t:0 "The 'Maximilian' Affair"
 totu_ddr_pol.1.d:0 "Ibrahim Böhme has barely taken the oath when Der Spiegel reports that the prime minister spent years as a Stasi informer codenamed 'Maximilian'. Böhme calls it slander, a Volkskammer committee asks for his file, and his coalition partners wonder whose name will come up next."
 totu_ddr_pol.1.a:0 "It is all slander"
 totu_ddr_pol.1.b:0 "Böhme gives up the party chair"
 totu_ddr_pol.2.t:0 "Hunger Strike at Normannenstrasse"
 totu_ddr_pol.2.d:0 "On 4 September civil rights activists occupy the Stasi building on Normannenstrasse again and go on hunger strike: the archives must not go to Koblenz. Among them is Bärbel Bohley, whom the Stasi once pushed out of the country. Bonn suggests waiting; the hunger strikers reply that they have waited forty years."
 totu_ddr_pol.2.a:0 "The files stay in the East"
 totu_ddr_pol.2.b:0 "Clear the building"
 DDR_pol_pact_exit_agreed_tt:0 "The GDR leaves the Warsaw Pact and is no longer a socialist commonwealth state."
 DDR_pol_pact_exit_refused_tt:0 "The GDR stays in the Warsaw Pact."
 totu_ddr_pol.3.t:0 "A Protocol from East Berlin"
 totu_ddr_pol.3.d:0 "The GDR's defence minister asks for the National People's Army to be released from its obligations to the Unified Command, and the GDR from membership of the Warsaw Pact. General Lushev awaits instructions: sign the protocol, or remind the Germans whose troops stand in their garrisons."
 totu_ddr_pol.3.a:0 "Sign the protocol"
 totu_ddr_pol.3.b:0 "Refuse"
 totu_ddr_pol.4.t:0 "Moscow's Answer"
 totu_ddr_pol.4.d_yes:0 "General Lushev signs the protocol in ten minutes, without speeches or a band. The National People's Army leaves the Unified Armed Forces and the GDR leaves the Warsaw Pact. The Soviet troops go home on schedule."
 totu_ddr_pol.4.d_no:0 "Moscow's answer is brief: the question is premature. The protocol goes back into the ministry safe, and in Wünsdorf all leave is cancelled."
 totu_ddr_pol.4.a:0 "Without a band"
 totu_ddr_pol.4.b:0 "Back into the safe"
 # economy
 DDR_eco_currency_union_tt:0 "The Deutsche Mark comes to the GDR: wages and pensions one to one, savings above a limit two to one."
 DDR_eco_convertible_mark_tt:0 "The GDR mark becomes a convertible currency: leaving for the West no longer pays for everyone."
 DDR_eco_property_restitution_tt:0 "§YJoint declaration of 15 June§!: restitution comes before compensation, and the 1945–49 land reform is not reversed."
 DDR_eco_property_tenants_tt:0 "§YThe Modrow law§!: houses and the land under them stay with the people who live in them."
 DDR_eco_lpg_private_tt:0 "Farmers take their land and livestock out of the co-operatives."
 DDR_eco_lpg_coop_tt:0 "The co-operatives stay, but work for the market."
 DDR_eco_comecon_hermes_tt:0 "Bonn insures exports to the East with §YHermes§! guarantees."
 DDR_eco_comecon_clearing_tt:0 "The GDR and the USSR agree on §Yclearing§!: trade goes on without dollars."
 DDR_eco_after_election_tt:0 "The Volkskammer election of 18 March has been held"
