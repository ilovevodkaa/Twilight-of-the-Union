l_english:
 # Twilight of the Union: replaces the vanilla file, so only these quotes show on loading screens.
 # Keep keys consecutive from 0. Keep EN and RU in the same order.
 LOADING_TIP_0:0 "\"God bless America. And Russia.\"\n- Boris Yeltsin"
 LOADING_TIP_1:0 "\"Mr. Gorbachev, tear down this wall!\"\n- Ronald Reagan, Berlin, 1987"
 LOADING_TIP_2:0 "\"I like Mr. Gorbachev. We can do business together.\"\n- Margaret Thatcher, 1984"
 LOADING_TIP_3:0 "\"Life punishes those who come too late.\"\n- Mikhail Gorbachev, Berlin, 1989"
 LOADING_TIP_4:0 "\"The process has started.\"\n- Mikhail Gorbachev"
 LOADING_TIP_5:0 "\"Boris, you are wrong!\"\n- Yegor Ligachev, 19th Party Conference, 1988"
 LOADING_TIP_6:0 "\"I cannot forsake my principles.\"\n- Nina Andreyeva, Sovetskaya Rossiya, 1988"
 LOADING_TIP_7:0 "\"Trust, but verify.\"\n- Ronald Reagan, 1987"
 LOADING_TIP_8:0 "\"There is not a single Soviet soldier left behind me.\"\n- Boris Gromov, leaving Afghanistan, 1989"
 LOADING_TIP_9:0 "\"We now have the Frank Sinatra doctrine. He has a song, 'I Did It My Way'.\"\n- Gennadi Gerasimov, Soviet Foreign Ministry, 1989"
 LOADING_TIP_10:0 "\"As far as I know... immediately, without delay.\"\n- Gunter Schabowski on the GDR border, 9 November 1989"
 LOADING_TIP_11:0 "\"What we may be witnessing is not just the end of the Cold War, but the end of history as such.\"\n- Francis Fukuyama, 1989"
 LOADING_TIP_12:0 "\"Our country is not flourishing.\"\n- Vaclav Havel, New Year's address, 1 January 1990"
 LOADING_TIP_13:0 "\"Take as much sovereignty as you can swallow.\"\n- Boris Yeltsin, Kazan, 1990"
 LOADING_TIP_14:0 "\"Out of these troubled times, a new world order can emerge.\"\n- George Bush, 1990"
 LOADING_TIP_15:0 "\"Read my lips: no new taxes.\"\n- George Bush, 1988"
 LOADING_TIP_16:0 "\"Blooming landscapes.\"\n- Helmut Kohl on the future of eastern Germany, 1990"
 LOADING_TIP_17:0 "\"No. No. No.\"\n- Margaret Thatcher on the plans from Brussels, 1990"
 LOADING_TIP_18:0 "\"Dictatorship is coming.\"\n- Eduard Shevardnadze, resigning, December 1990"
 LOADING_TIP_19:0 "\"Freedom is not the same as independence.\"\n- George Bush, Kiev, 1991"
 LOADING_TIP_20:0 "\"This is a right-wing, reactionary, anti-constitutional coup.\"\n- Boris Yeltsin, speaking from a tank, 19 August 1991"
 LOADING_TIP_21:0 "\"Mikhail Sergeyevich is on vacation and undergoing treatment in the Crimea.\"\n- Gennady Yanayev, GKChP press conference, 1991"
 LOADING_TIP_22:0 "\"I hereby discontinue my activities at the post of President of the USSR.\"\n- Mikhail Gorbachev, 25 December 1991"
 LOADING_TIP_23:0 "\"We wanted the best, but it turned out as always.\"\n- Viktor Chernomyrdin, 1993"
 LOADING_TIP_24:0 "\"The evil empire.\"\n- Ronald Reagan on the Soviet Union, 1983"
