 TOTU_un_scale_tt:0 "Unification scale: §Y[?TOTU_un_scale|0]%§!.\n\nGrows with the decisions and focuses of both sides and on its own: the street wants unity (§Y+1%§! a month, §Y+2%§! under a democratic GDR government). At §Y75%§! Moscow has its say (the Two Plus Four talks), at §Y100%§! a referendum is called. While the talks are frozen, the scale does not grow and no decisions can be taken."
 TOTU_un_side_ddr:0 "GDR: contribution §Y[?TOTU_un_ddr|0]§! ([?TOTU_un_share_ddr|0]%)"
 TOTU_un_side_ger:0 "FRG: contribution §Y[?TOTU_un_ger|0]§! ([?TOTU_un_share_ger|0]%)"
 TOTU_un_tug_tt:0 "GDR contribution: §Y[?TOTU_un_ddr|0]§! ([?TOTU_un_share_ddr|0]%), FRG contribution: §Y[?TOTU_un_ger|0]§! ([?TOTU_un_share_ger|0]%).\n\nWhoever has contributed more unites the country. The GDR's demands for equal footing and its own terms count for the GDR; Bonn's decisions and concessions to Bonn count for the FRG. Neutral steps move the scale but change nobody's contribution."
 TOTU_un_hint:0 "At 100% a referendum is held. Whoever contributed more unites Germany."
 TOTU_unity_category:0 "The German Question"
 TOTU_unity_category_desc:0 "The Wall is open, and Kohl's Ten Points have been heard. Hardly anyone doubts that unification will come. The question is who unites whom, and on whose terms."
