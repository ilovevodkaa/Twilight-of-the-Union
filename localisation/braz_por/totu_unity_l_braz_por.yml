 TOTU_un_status_tt:0 "§YThe German Question§!\n\nBoth countries invest in unification through decisions and focuses. Every step moves the common scale and counts towards the contribution of the side on whose terms the two states come closer. At §Y100%§! a referendum is held: if the FRG has contributed more, the GDR accedes to it; if the GDR has, it unites the country on its own terms. A tie goes to the FRG."
