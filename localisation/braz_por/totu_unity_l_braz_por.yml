 TOTU_unity_req_democratic_tt:0 "The GDR has a democratic government (the Alliance for Germany or the SPD)"
 TOTU_unity_req_dmark_tt:0 "The GDR has accepted the currency union or has a democratic government"
 TOTU_unity_req_dmark_done_tt:0 "The D-Mark has been promised (decision 'The D-Mark Promise')"
 TOTU_unity_req_monetary_tt:0 "The monetary union is in force"
 TOTU_unity_req_modrow_plan_tt:0 "Modrow's plan has been adopted"
 TOTU_unity_ger_kohl_plan:0 "Speed Up the Kohl Plan"
 TOTU_unity_ger_kohl_plan_desc:0 "On 28 November 1989 Kohl laid out his Ten Points in the Bundestag: a treaty community first, then a confederation, unity some day. In February 1990 'some day' is to become 'this year'."
 TOTU_unity_ger_west_tv:0 "West German Television"
 TOTU_unity_ger_west_tv_desc:0 "ARD and ZDF reach almost all of the GDR except the 'valley of the clueless' around Dresden. Every edition of the Tagesschau works as a campaign trip that needs no permit."
 TOTU_unity_ger_campaign_east:0 "Campaigning in the East"
 TOTU_unity_ger_campaign_east_desc:0 "Kohl, Genscher and Vogel tour the GDR as if it were their own constituency. Kohl's six rallies in February and March 1990 drew over a million people."
 TOTU_unity_ger_dmark:0 "The D-Mark Promise"
 TOTU_unity_ger_dmark_desc:0 "On 6 February 1990 Kohl offered the GDR a currency union at once, before any unification, and the Bundesbank learned of it from the news. Now East Berlin has said yes, and Bonn confirms the promise: the D-Mark will arrive before unity does."
 TOTU_unity_ger_solidarity_credit:0 "Solidarity Credit"
 TOTU_unity_ger_solidarity_credit_desc:0 "Modrow asked Bonn for a 'solidarity contribution' of fifteen billion marks and went home empty-handed. Bonn is ready to pay, on its own terms and under its own control."
 TOTU_unity_ger_currency_treaty:0 "Monetary Union Treaty"
 TOTU_unity_ger_currency_treaty_desc:0 "The treaty on monetary, economic and social union was signed on 18 May 1990; from 1 July the D-Mark is the GDR's only currency. Wages are converted one to one, and on the same day the GDR's factories find themselves on the world market."
 TOTU_unity_ger_two_plus_four:0 "The Two Plus Four Talks"
 TOTU_unity_ger_two_plus_four_desc:0 "The two German states and the four victorious powers sit down at one table: the first round met in Bonn on 5 May 1990. Without Moscow, Washington, London and Paris, unity is a purely German affair only on paper."
 TOTU_unity_ger_unification_treaty:0 "Unification Treaty"
 TOTU_unity_ger_unification_treaty_desc:0 "A thousand pages on how one state becomes part of another: laws, pensions, the Stasi archives, even the national holiday. Signed in East Berlin on 31 August 1990."
 TOTU_unity_ddr_treaty_community:0 "Treaty Community"
 TOTU_unity_ddr_treaty_community_desc:0 "On 1 February 1990 Modrow presents his plan 'Germany, united fatherland': a treaty community, then a confederation and a neutral Germany. Both sides set the pace and the terms, not one."
 TOTU_unity_ddr_equal_rights:0 "Demand Equal Footing"
 TOTU_unity_ddr_equal_rights_desc:0 "No Anschluss: two countries unite, one does not swallow the other. East Berlin demands that every decision be taken at a common table."
 TOTU_unity_ddr_social_charter:0 "Social Charter"
 TOTU_unity_ddr_social_charter_desc:0 "On 5 March 1990 the Round Table adopts a Social Charter: the right to work, housing and nurseries must survive any unification. Bonn is counting what it will cost."
 TOTU_unity_ddr_protect_property:0 "Protect Property"
 TOTU_unity_ddr_protect_property_desc:0 "Thousands of claims arrive from the FRG for houses and dachas left behind by those who fled west. The GDR government insists that whoever lives there owns it, and the land of the 1945–1949 reform stays where it is."
 TOTU_unity_ddr_west_voters:0 "Appeal to West German Voters"
 TOTU_unity_ddr_west_voters_desc:0 "West German taxpayers will pay for unity, and Oskar Lafontaine reminds them of it at every rally. East Berlin plays along: no rush, count the money, negotiate."
 TOTU_unity_ddr_bonn_officials:0 "Officials from Bonn"
 TOTU_unity_ddr_bonn_officials_desc:0 "GDR ministries take on advisers from Bonn: western civil servants draft the laws the East will live by in six months. The work goes fast; questions of sovereignty come later."
 TOTU_unity_ddr_article_23:0 "Accession Under Article 23"
 TOTU_unity_ddr_article_23_desc:0 "Article 23 of the Basic Law lets new Laender simply join the FRG, as the Saarland did in 1957. On 23 August 1990 the Volkskammer votes to accede on 3 October: 294 for, 62 against."
 TOTU_unity_ddr_article_146:0 "A Constitution Under Article 146"
 TOTU_unity_ddr_article_146_desc:0 "Article 146 promises a common constitution adopted by the whole people. In April 1990 the Round Table's working group puts forward its draft: unite as equals and vote on a new basic law."
 TOTU_unity_ddr_freeze:0 "Freeze the Talks"
 TOTU_unity_ddr_freeze_desc:0 "The PDS government recalls its delegation from Bonn 'for consultations'. The street is unhappy and so is Bonn, but East Berlin gains time."
 TOTU_unity_transfers_east:0 "Transfers to the East"
 TOTU_unity_transfers_east_desc:0 "Bonn's money goes east before unity does."
 TOTU_unity_conversion_cost:0 "One-to-One Exchange"
 TOTU_unity_conversion_cost_desc:0 "The Bundesbank proposed two to one, the government chose one to one. The budget will pay the difference."
 TOTU_unity_social_guarantees:0 "Social Guarantees"
 TOTU_unity_social_guarantees_desc:0 "The charter promises to keep jobs, housing and nurseries. For now the GDR pays for it itself."
 TOTU_unity_withdrawal_payments:0 "Paying for the Withdrawal"
 TOTU_unity_withdrawal_payments_desc:0 "Twelve billion marks for the withdrawal, almost eight of them for housing for the officers, and a three-billion interest-free credit on top. That is the price of Moscow's consent."
 TOTU_unity_german_credits:0 "German Credits"
 TOTU_unity_german_credits_desc:0 "Bonn pays for the withdrawal of the Western Group of Forces and adds a credit. The money arrives on time, unlike everything else."
 TOTU_unity_growing_together:0 "Growing Together"
 TOTU_unity_growing_together_desc:0 "Willy Brandt said that what belongs together is now growing together. It will take a long time and a lot of money."
 TOTU_unity_talks:0 "Two Plus Four talks"
 TOTU_unity_moscow_consent:0 "Moscow agreed to unification"
 TOTU_unity_moscow_veto:0 "Moscow vetoed unification"
 totu_unity.1.t:0 "A Referendum Is Called"
 totu_unity.1.d_ger:0 "The unification scale is full. Bonn and East Berlin call a joint referendum in two weeks. The FRG has contributed more, so the ballot asks about the GDR's accession to the Federal Republic under Article 23 of the Basic Law."
 totu_unity.1.d_ddr:0 "The unification scale is full. Bonn and East Berlin call a joint referendum in two weeks. The GDR has contributed more, so the ballot asks about unification on East Berlin's terms: the Federal Republic joins a single state together with the GDR, not the other way round."
 totu_unity.1.a:0 "Await the result"
 totu_unity.1.tt:0 "The referendum is held in §Y14 days§!. The German question decisions are no longer available."
 totu_unity.3.t:0 "The Referendum Results"
 totu_unity.3.d_ger:0 "Turnout is over ninety per cent on both sides of the former border. The majority votes for the GDR's accession to the Federal Republic. Tomorrow the flag of a united Germany goes up over the Reichstag, and the GDR becomes five new Laender."
 totu_unity.3.d_ddr_com:0 "Turnout is over ninety per cent. The majority votes for a single state on East Berlin's terms. The Federal Republic leaves NATO and ceases to exist, and the Bundeswehr hands its weapons to the National People's Army. Berlin becomes the capital of a united Germany."
 totu_unity.3.d_ddr_dem:0 "Turnout is over ninety per cent. The majority votes for unification on East Berlin's terms: a new constitution and a neutral Germany outside both blocs. The Federal Republic leaves NATO, and Berlin becomes the capital."
 totu_unity.3.a:0 "Germany is one"
 totu_unity.3.b:0 "Accept the result"
 totu_unity.3.tt_win:0 "Tomorrow we §Gunite Germany§!."
 totu_unity.3.tt_lose:0 "Tomorrow our state §Rbecomes part of its neighbour§!."
 totu_unity.21.t:0 "Germany Is One"
 totu_unity.21.d:0 "At midnight the black-red-gold flag went up over the Reichstag. The German Democratic Republic has joined the Federal Republic of Germany and ceased to exist. Forty-one years of division ended with a referendum and fireworks."
 totu_unity.21.a:0 "The map of Europe has changed"
 totu_unity.21.b:0 "Unity and justice and freedom"
 totu_unity.22.t:0 "Germany United on Eastern Terms"
 totu_unity.22.d_com:0 "The flag with the hammer and compass flies over the Reichstag. The Federal Republic has joined a single German state on East Berlin's terms and left NATO. Brussels and Washington meet until morning: the line between the blocs has moved to the Rhine."
 totu_unity.22.d_neu:0 "The flag with the hammer and compass flies over the Reichstag. The Federal Republic has joined a single German state on East Berlin's terms and left NATO, while the GDR had already left the Warsaw Pact. A socialist Germany outside both blocs puzzles Washington and Moscow alike."
 totu_unity.22.d_dem:0 "A black-red-gold flag without an emblem flies over the Reichstag. Germany has united on East Berlin's terms: a new constitution, the FRG out of NATO and neutrality outside both blocs. Moscow is pleased; Washington is counting the cost."
 totu_unity.22.a:0 "The map of Europe has changed"
 totu_unity.22.b:0 "Germany, united fatherland"
 totu_unity.30.t:0 "Two Plus Four"
 totu_unity.30.d:0 "German unification has come three quarters of the way and will go no further without Moscow: the Western Group of Forces stands in the GDR, and the USSR holds the rights of a victorious power. Bonn offers money for the withdrawal and the recognition of the borders; the generals recall twenty million dead."
 totu_unity.30.a:0 "Give our consent"
 totu_unity.30.b:0 "Veto it"
 totu_unity.31.t:0 "Moscow Agrees"
 totu_unity.31.d:0 "Gorbachev agrees: a united Germany will choose its own alliance, the Western Group of Forces will leave by the end of 1994, and Bonn will pay for housing for the officers. The last outside obstacle is gone."
 totu_unity.31.a:0 "On to the referendum"
 totu_unity.32.t:0 "Moscow's Veto"
 totu_unity.32.d:0 "Moscow refuses to discuss unification while its troops stand in the GDR. The talks are frozen for half a year, and the Western Group of Forces stays where it is."
 totu_unity.32.a:0 "Wait"
