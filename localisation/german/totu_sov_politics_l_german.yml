 SOV_gennady_yanayev:0 "Gennady Yanayev"
 TOTU_president_of_the_ussr:0 "President of the USSR"
 TOTU_president_of_the_ussr_desc:0 "Head of state elected by the Congress of People's Deputies. His decrees bind everyone, though the republics increasingly ignore them."
 TOTU_vilnius_crackdown:0 "Storming of the Vilnius TV Tower"

 # Focus tooltips
 SOV_gorbachev_in_power_tt:0 "Mikhail Gorbachev leads the country"
 SOV_union_referendum_tt:0 "Referendum result: §Y76%§! vote yes. The Baltic republics, Georgia, Armenia and Moldova boycott the vote."
 SOV_union_of_sovereign_states_yeltsin_tt:0 "Yeltsin backs a treaty signed with his participation:"
 SOV_500_days_program_tt:0 "Yeltsin backs the program. The Ryzhkov government opposes it, and we will have to decide its fate."
 SOV_deal_with_yeltsin_tt:0 "The RSFSR becomes sovereign within the Union. Yeltsin will back the new union treaty: the “§YUnion of Sovereign States§!” will give another §G+5%§! stability."
 SOV_deal_with_yeltsin_500_days_tt:0 "Yeltsin has already backed the 500 Days program:"
 SOV_rsfsr_sovereignty_in_union_tt:0 "The RSFSR stops withholding its taxes from the Union budget."
 SOV_yeltsin_prime_minister_tt:0 "The vice presidency is already taken, so Yeltsin becomes §YPrime Minister of the USSR§!."
 SOV_yeltsin_vice_president_tt:0 "Yeltsin becomes §YVice President of the USSR§!."
 SOV_stop_yeltsin_tt:0 "Union bodies refuse to recognize the RSFSR Declaration of Sovereignty. Yeltsin goes into opposition."
 SOV_bet_on_autonomies_tt:0 "Tatarstan, Bashkiria and Yakutia now quarrel with Yeltsin rather than with Moscow."
 SOV_remove_yeltsin_tt:0 "A hundred thousand people rally on Mayakovsky Square for Yeltsin, but the deputies do not back down."
 SOV_28th_party_congress_tt:0 "Yeltsin and the Democratic Platform leave the CPSU."
 SOV_remove_gorbachev_tt:0 "Gorbachev stays at his dacha in Foros “for health reasons”. §YGennady Yanayev§!, the face of the Emergency Committee, takes over the country."
 SOV_communist_party_of_rsfsr_tt:0 "The conservatives gain a party of their own in the largest republic, a counterweight to Yeltsin."

 # Event: vice president
 totu_sov_politics.1.t:0 "Who Will Be Vice President?"
 totu_sov_politics.1.d:0 "The President needs a deputy, and the Congress of People's Deputies must confirm him. Gorbachev wavers between two men. Gennady Yanayev, the former trade union chief, is as dependable and unremarkable as the apparatus itself. Eduard Shevardnadze, the Foreign Minister, is one of the reformers and a stranger to the generals.\n\nWhoever the President picks, the deputies vote reluctantly, and it will take more than one ballot."
 totu_sov_politics.1.a:0 "Gennady Yanayev. The apparatus must feel safe."
 totu_sov_politics.1.b:0 "Eduard Shevardnadze. The reforms need an ally."

 # Event: Vilnius TV tower
 totu_sov_politics.2.t:0 "The Vilnius TV Tower"
 totu_sov_politics.2.d:0 "The night of 13 January. Armored carriers and the Alpha group stand at the television tower, ringed by thousands of unarmed people with Lithuanian flags. In Moscow everyone waits for an order no one wants to sign first.\n\nWe can take the tower, and the republics will fall quiet for a while. Or we can pull the troops back before dawn, before blood is spilled."
 totu_sov_politics.2.a:0 "Take the tower."
 totu_sov_politics.2.a_tt:0 "The democratic great powers will condemn Moscow."
 totu_sov_politics.2.b:0 "Pull the troops back."

 # National spirits
 TOTU_SOV_glasnost_free_press:0 "Glasnost Without Censorship"
 TOTU_SOV_glasnost_free_press_desc:0 "The Press Law has abolished censorship. The papers print what they like, circulations soar, and trust in the authorities falls with every issue."
 TOTU_SOV_awakening_republics_council:0 "The Republics at the Table"
 TOTU_SOV_awakening_republics_council_desc:0 "The republican leaders sit beside the President in the Federation Council. Their demands have not gone away, but they are more often discussed than shouted at rallies."
 TOTU_SOV_social_payments:0 "Social Payments"
 TOTU_SOV_social_payments_desc:0 "Indexed pensions and wages, the first unemployment benefits. The money has to be found in a budget that is already short."
 TOTU_SOV_cooperatives:0 "Cooperatives Become Owners"
 TOTU_SOV_cooperatives_desc:0 "The Law on Property lets citizens own the means of production. The cooperators teach factory directors to count money."
 TOTU_SOV_rsfsr_budget:0 "Russian Taxes in the Union Budget"
 TOTU_SOV_rsfsr_budget_desc:0 "The RSFSR pays its taxes into the Union budget again. For the first time in a year, Moscow knows how much money it has."
 TOTU_SOV_baltic_crackdown:0 "Order in the Baltics"
 TOTU_SOV_baltic_crackdown_desc:0 "After Vilnius the republics have gone quiet. How long that will last nobody knows, least of all those who gave the order."

 # Event: the 28th Congress
 totu_sov_politics.3.t:0 "Yeltsin Leaves the Congress"
 totu_sov_politics.3.d:0 "12 July, the day before the 28th Congress closes. Boris Yeltsin takes the rostrum, announces that he is leaving the CPSU and walks down the aisle to the doors without looking back. The next day the leaders of the Democratic Platform, Vyacheslav Shostakovsky and Vladimir Lysenko, announce that they are leaving too, followed by Gavriil Popov and Anatoly Sobchak.\n\nMany in the hall are relieved. But hundreds of thousands of rank-and-file communists may follow their leaders out, above all in Moscow and Leningrad."
 totu_sov_politics.3.a:0 "Let them go. The party needs clarity, not factions."
 totu_sov_politics.3.b:0 "Yeltsin is gone, but keep the platform: give it seats on the Central Committee."

 # Event: the 500 Days
 totu_sov_politics.4.t:0 "The 500 Days and Ryzhkov's Resignation"
 totu_sov_politics.4.d:0 "The programme of Stanislav Shatalin and Grigory Yavlinsky is ready: privatisation, free prices and a cut Union budget, all within 500 days. The RSFSR Supreme Soviet endorsed it back on 11 September. Nikolai Ryzhkov, Chairman of the Council of Ministers, calls it a gamble and makes clear he will not carry it out.\n\nAdopting the programme whole means letting the Ryzhkov government go. At the President's request, academician Abel Aganbegyan is merging it with Leonid Abalkin's government draft into the “Basic Guidelines”: a slower road to the market, and Ryzhkov stays. But Yeltsin will not accept that compromise."
 totu_sov_politics.4.a:0 "The Shatalin-Yavlinsky programme. The government goes."
 totu_sov_politics.4.b:0 "The “Basic Guidelines”. Ryzhkov stays."
 totu_sov_politics.4.b_tt:0 "Yeltsin calls the compromise an abandonment of the 500 Days and §Rno longer backs§! the program."

 # Event: referendum results
 totu_sov_politics.5.t:0 "Results of the Referendum"
 totu_sov_politics.5.d:0 "On 17 March 1991, 148 million people, 80% of the electorate, went to the polls. 76.4% voted to preserve the Union as a renewed federation. Lithuania, Latvia, Estonia, Georgia, Armenia and Moldova boycotted the vote, though polling stations still opened in Abkhazia and Transnistria.\n\nEach republic reads the result its own way. In Moscow the argument is whether it is an order for the republics to obey or a mandate to negotiate a new union treaty."
 totu_sov_politics.5.a:0 "The people have spoken. The boycott breaks the law."
 totu_sov_politics.5.b:0 "This is a mandate for a new union treaty."

 # Event: 28 March
 totu_sov_politics.6.t:0 "28 March"
 totu_sov_politics.6.d:0 "An extraordinary Congress of People's Deputies of the RSFSR opens in the Kremlin, called to remove Yeltsin. On 25 March the Cabinet of Ministers banned rallies in Moscow until 15 April, and troops and militia moved into the city: trucks and armoured carriers stand on Tverskaya Street and around Manege Square. Despite the ban, a hundred thousand people march to Mayakovsky Square and Arbat Square.\n\nThe deputies vote against Yeltsin, but many of them are angry: the Congress, they say, is sitting under the protection of bayonets. The troops can stay in the streets until the Congress closes, or they can be withdrawn in the morning."
 totu_sov_politics.6.a:0 "The troops stay until the Congress closes."
 totu_sov_politics.6.b:0 "Withdraw the troops in the morning."

 # Event: Foros
 totu_sov_politics.7.t:0 "Foros"
 totu_sov_politics.7.d:0 "The lines to the dacha at Foros are cut, and Gorbachev is guarded by General Plekhanov's men. Gennady Yanayev signs papers in the Kremlin, but the decree on the state of emergency is still unsigned: the committee hesitates.\n\nBoris Yeltsin is already in the White House on the Krasnopresnenskaya Embankment. He declares the committee's actions illegal, and barricades of trolleybuses and steel rods go up around the building. Nazarbayev and Kravchuk wait and say nothing definite."
 totu_sov_politics.7.d_removed:0 "The lines to the dacha at Foros are cut, and Gorbachev is guarded by General Plekhanov's men. Gennady Yanayev signs papers in the Kremlin, but the decree on the state of emergency is still unsigned: the committee hesitates.\n\nYeltsin was removed as chairman in March, but now that means nothing. He drives to the White House on the Krasnopresnenskaya Embankment, and the democratic deputies let him in. Barricades of trolleybuses and steel rods go up around the building. Nazarbayev and Kravchuk wait and say nothing definite."
 totu_sov_politics.7.a:0 "Send the Alpha group into the White House."
 totu_sov_politics.7.b:0 "Call Nazarbayev and Kravchuk. Their neutrality comes at a price."
 totu_sov_politics.7.c:0 "Cordon off the White House and wait."

 # Event: the war of laws
 totu_sov_politics.8.t:0 "The War of Laws"
 totu_sov_politics.8.d:0 "On 24 October 1990 the RSFSR Supreme Soviet ruled that Union laws apply in Russia only if the Russian parliament has approved them. The same day the USSR Supreme Soviet passed a law saying the exact opposite. Enterprises no longer know whom to pay their taxes to, and more and more of them pick whoever asks for less.\n\nThe Russian acts can be struck down by presidential decree, with a demand for obedience. Or the dispute can go to Sergei Alekseyev's Committee of Constitutional Supervision, which works slowly and has no means to enforce its rulings."
 totu_sov_politics.8.a:0 "Strike down the Russian laws by presidential decree."
 totu_sov_politics.8.b:0 "Let the Committee of Constitutional Supervision decide."
