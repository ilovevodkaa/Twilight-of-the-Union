 # GENERATED by tools/build_focus_tree.py from tools/src/focus/SOV.json.
 TOTU_SOV_focus:0 "Soviet National Focus"
 SOV_central_committee_plenum:0 "Convene the CC Plenum"
 SOV_central_committee_plenum_desc:0 "February 1990: for the first time, a Central Committee plenum openly argues about the future of the Party. Where the country goes next will have to be decided this year."
 SOV_abolish_article_six:0 "Abolish Article Six"
 SOV_abolish_article_six_desc:0 "Article Six of the Constitution, on the Party's “leading and guiding role”, no longer holds. Abolishing it means admitting that the CPSU is one party among many."
 SOV_renew_the_party:0 "“Renew” the Party"
 SOV_renew_the_party_desc:0 "The Party remains the sole pillar of the state, but it promises to cleanse itself, grow younger and draw closer to the people. Everyone understands the word “renew” in their own way."
 SOV_third_congress_of_deputies:0 "Third Congress of Deputies"
 SOV_third_congress_of_deputies_desc:0 "March 1990: the Congress of People's Deputies rewrites the Constitution live on television. From here it is a short step to a presidency and to new parties."
 SOV_28th_party_congress:0 "28th Party Congress"
 SOV_28th_party_congress_desc:0 "The Party's last congress. Yeltsin pointedly lays his Party card on the table and walks out of the hall. Those who stay want order."
 SOV_yeltsin_heads_russia:0 "Yeltsin Leads Russia"
 SOV_yeltsin_heads_russia_desc:0 "May 1990: on the third ballot, Yeltsin is elected Chairman of the Supreme Soviet of the RSFSR. Gorbachev now has a rival with a republic of his own."
 SOV_constitutional_supervision:0 "Constitutional Oversight"
 SOV_constitutional_supervision_desc:0 "For the first time, the USSR has a body that can declare a law unconstitutional. Its first rulings strike at the President's own decrees."
 SOV_multiparty_system:0 "Multiparty System"
 SOV_multiparty_system_desc:0 "The Law on Public Associations permits new parties. The apparatus loses its monopoly on power, and with it its familiar sluggishness."
 SOV_press_law:0 "The Press Law"
 SOV_press_law_desc:0 "June 1990: censorship is abolished by law. Newspapers no longer need Glavlit's stamp on every issue."
 SOV_party_discipline:0 "Party Discipline"
 SOV_party_discipline_desc:0 "The waverers are expelled, and regional committees receive clear instructions. The Party speaks with one voice again, if more quietly than before."
 SOV_deal_with_yeltsin:0 "Deal with Yeltsin"
 SOV_deal_with_yeltsin_desc:0 "Russia has declared sovereignty, and Yeltsin heads its parliament. We can acknowledge his strength and make him an ally before he becomes an enemy."
 SOV_stop_yeltsin:0 "Stop Yeltsin"
 SOV_stop_yeltsin_desc:0 "The RSFSR's Declaration of Sovereignty strikes at the very heart of the center. Union bodies refuse to recognize it and begin a “war of laws”."
 SOV_left_democratic_socialism:0 "Left Course: Social Democracy"
 SOV_left_democratic_socialism_desc:0 "Perestroika is not a rejection of socialism but its purification. Yakovlev and Shevardnadze propose the path of the European social democrats: a market under state control and strong social guarantees."
 SOV_right_market_democracy:0 "Right Course: Market Democracy"
 SOV_right_market_democracy_desc:0 "The economists say it plainly: the plan cannot be saved. The country needs private property, free prices and an open economy, and political freedom will not last without economic freedom."
 SOV_gorbachev_presidency:0 "Gorbachev's Presidency"
 SOV_gorbachev_presidency_desc:0 "The General Secretary becomes President of the USSR. Power passes from the Party apparatus to state institutions."
 SOV_freedom_of_conscience:0 "Freedom of Conscience"
 SOV_freedom_of_conscience_desc:0 "October 1990: the law on freedom of conscience. Churches are returned to believers, and the Easter service is broadcast on central television."
 SOV_state_emergency_committee:0 "State Emergency Committee"
 SOV_state_emergency_committee_desc:0 "Kryuchkov, Yazov, Pavlov and Baklanov quietly prepare a plan in case the country starts to fall apart. For now it is just papers in a safe."
 SOV_left_leninist_norms:0 "Left Course: Leninist Norms"
 SOV_left_leninist_norms_desc:0 "The crisis exists because the Party has strayed from Lenin. Restore discipline, the planned economy and the class approach."
 SOV_right_great_power:0 "Right Course: Great Power"
 SOV_right_great_power_desc:0 "The Union is not an ideology but a thousand-year-old state. The army, tradition and the state matter more than Party dogma."
 SOV_rsfsr_sovereignty_in_union:0 "RSFSR Sovereignty in the Union"
 SOV_rsfsr_sovereignty_in_union_desc:0 "Moscow recognizes Russia's Declaration of Sovereignty, but within the Union: Russian laws override Union laws only where this has been agreed."
 SOV_war_of_laws:0 "The War of Laws"
 SOV_war_of_laws_desc:0 "Union and Russian laws contradict each other, and each parliament declares its own supreme. Enterprises do not know whom to pay their taxes to."
 SOV_democratic_reform_movement:0 "Democratic Reform Movement"
 SOV_democratic_reform_movement_desc:0 "July 1991: Yakovlev, Shevardnadze, Popov, Sobchak and Volsky announce a movement meant to become a new party of reformers."
 SOV_social_guarantees:0 "Social Guarantees"
 SOV_social_guarantees_desc:0 "Indexed pensions and wages, unemployment benefits. Reform must not hit those who already have it hard."
 SOV_law_on_property:0 "The Law on Property"
 SOV_law_on_property_desc:0 "March 1990: for the first time, the law recognizes citizens' right to own the means of production. The cooperators, legal since 1988, can now own their workshops."
 SOV_500_days_program:0 "The 500 Days Program"
 SOV_500_days_program_desc:0 "Shatalin and Yavlinsky propose to carry out privatization and free prices within 500 days. Even Yeltsin is ready to back the program; the Ryzhkov government is against it."
 SOV_vice_president:0 "Vice President"
 SOV_vice_president_desc:0 "The President needs a deputy. The Congress will not approve Gorbachev's candidate on the first try."
 SOV_presidential_council:0 "Presidential Council"
 SOV_presidential_council_desc:0 "Yakovlev, Shevardnadze, Bakatin, Primakov: a council of reformers and technocrats gathers around the President."
 SOV_federation_council:0 "Federation Council"
 SOV_federation_council_desc:0 "The leaders of the republics get a seat at the table in the center. It is the first step from orders to negotiations."
 SOV_union_referendum:0 "The Union Referendum"
 SOV_union_referendum_desc:0 "March 17, 1991: “Do you consider necessary the preservation of the Union of Soviet Socialist Republics as a renewed federation of equal sovereign republics…?” Six republics declare a boycott."
 SOV_consolidate_security_services:0 "Unite the Security Organs"
 SOV_consolidate_security_services_desc:0 "The army, the KGB and the MVD agree to act together. The Minister of Defense, the KGB Chairman and the Minister of Internal Affairs are now one team."
 SOV_communist_party_of_rsfsr:0 "Communist Party of the RSFSR"
 SOV_communist_party_of_rsfsr_desc:0 "June 1990: the Communist Party of the RSFSR is founded under Polozkov. The conservatives gain their own Party base in the largest republic."
 SOV_andreeva_unity:0 "Andreyeva's “Unity”"
 SOV_andreeva_unity_desc:0 "The author of the letter “I Cannot Forsake My Principles” founds the society “Unity - for Leninism and Communist Ideals”. The orthodox are no longer shy."
 SOV_soyuz_deputy_group:0 "The Soyuz Deputy Group"
 SOV_soyuz_deputy_group_desc:0 "Colonels Alksnis and Petrushenko assemble a parliamentary faction of those ready to defend the Union at any cost. The “black colonels” become the voice of the army."
 SOV_army_and_church:0 "Army and Church"
 SOV_army_and_church_desc:0 "Generals and hierarchs of the Russian Orthodox Church share a platform for the first time. The statists are looking for a unifying idea to replace communism."
 SOV_gorbachev_yeltsin_tandem:0 "Gorbachev-Yeltsin Tandem"
 SOV_gorbachev_yeltsin_tandem_desc:0 "The President of the USSR and the chairman of the Russian parliament appear together. For the first time in a long while, reform has one face rather than two."
 SOV_bet_on_autonomies:0 "Bet on the Autonomies"
 SOV_bet_on_autonomies_desc:0 "April 1990: a new law puts the autonomous republics on a par with the Union republics. Tatarstan, Bashkiria and Yakutia now have a reason to quarrel with Yeltsin rather than with Gorbachev."
 SOV_social_democratic_party:0 "Social Democratic Party"
 SOV_social_democratic_party_desc:0 "The CPSU splits: the reformist wing leaves, taking part of the property and the voters with it. The country gains a strong center-left party."
 SOV_free_prices:0 "Free the Prices"
 SOV_free_prices_desc:0 "Prices are freed. The shelves fill up, but the ruble loses value faster than wages rise."
 SOV_new_union_treaty_draft:0 "Draft a New Union Treaty"
 SOV_new_union_treaty_draft_desc:0 "Lawyers from the center and the republics write a single document for the first time. The question is how much power will be left to Moscow."
 SOV_remove_gorbachev:0 "Remove Gorbachev"
 SOV_remove_gorbachev_desc:0 "The President concedes too much to the republics. He can be left at his dacha in Foros “for health reasons”."
 SOV_kgb_budget:0 "Increase the KGB Budget"
 SOV_kgb_budget_desc:0 "The Committee gets money, people and equipment. In return, it is expected to learn of plots by the republican elites before they happen."
 SOV_restore_party_control:0 "Restore Party Control"
 SOV_restore_party_control_desc:0 "The Party committee once again decides who runs the factory, and the regional committee decides who heads the regional executive. The reforms roll back."
 SOV_word_to_the_people:0 "“A Word to the People”"
 SOV_word_to_the_people_desc:0 "July 1991: Prokhanov, Rasputin and Generals Varennikov and Gromov publish the manifesto “An enormous, unprecedented misfortune has befallen us…”. It is the program of a future dictatorship."
 SOV_yeltsin_in_union_leadership:0 "Yeltsin in Union Leadership"
 SOV_yeltsin_in_union_leadership_desc:0 "The impossible becomes real: Yeltsin takes a post in the Union leadership. The Union survives, but the question of who actually runs it remains open."
 SOV_remove_yeltsin:0 "Oust Yeltsin"
 SOV_remove_yeltsin_desc:0 "March 1991: at an extraordinary Congress of People's Deputies of the RSFSR, the communists try to remove Yeltsin. This time they succeed."
 SOV_andropov_methods:0 "Andropov's Methods"
 SOV_andropov_methods_desc:0 "Raids on truants, show trials against the trade mafia, discipline in the factories. Just like under Andropov, only harsher."
 SOV_order_in_the_baltics:0 "Order in the Baltics"
 SOV_order_in_the_baltics_desc:0 "January 1991: troops and OMON enter Vilnius and Riga. The TV tower, barricades, the dead. Moscow shows it will not let the republics go without a fight."
 SOV_novo_ogaryovo_process:0 "The Novo-Ogaryovo Process"
 SOV_novo_ogaryovo_process_desc:0 "April 1991: Gorbachev and the leaders of nine republics sit down at the table at Novo-Ogaryovo outside Moscow. “9+1” is supposed to save the Union."
 SOV_union_of_sovereign_states:0 "Union of Sovereign States"
 SOV_union_of_sovereign_states_desc:0 "The new treaty is signed. The USSR becomes the Union of Sovereign States: the republics run their own affairs, while Moscow is responsible for the army, the money and foreign policy."
 SOV_state_of_emergency:0 "State of Emergency Decree"
 SOV_state_of_emergency_desc:0 "“Swan Lake” on television, then the GKChP press conference. A state of emergency is declared across the country, and parties and newspapers are shut down."
 SOV_close_the_plenum:0 "Close the Plenum"
 SOV_close_the_plenum_desc:0 "The decision has been made. Whatever it was, the country that walks out of this hall will never be the same."
 # national spirits
 TOTU_SOV_sovereign_union:0 "Union of Sovereign States"
 TOTU_SOV_sovereign_union_desc:0 "The republics run their own affairs, while the center is responsible for the army, the money and foreign policy. The Union rests not on orders but on a treaty."
 TOTU_SOV_emergency_rule:0 "Emergency Rule"
 TOTU_SOV_emergency_rule_desc:0 "Curfews, closed newspapers and tanks outside the White House. Order rests on fear and will last exactly as long as the army is willing to shoot."
 TOTU_SOV_andropov_discipline:0 "Andropov Discipline"
 TOTU_SOV_andropov_discipline_desc:0 "Raids on truants and show trials against the trade mafia. The factories have grown quieter; the shops have not grown any better."
 TOTU_SOV_democratic_socialism:0 "Democratic Socialism"
 TOTU_SOV_democratic_socialism_desc:0 "A market under state control, strong trade unions and generous social guarantees. Stable, but expensive."
 TOTU_SOV_market_reforms:0 "Market Reforms"
 TOTU_SOV_market_reforms_desc:0 "Prices are freed, cooperatives are growing, and factory directors are learning to count profits. The shelves are filling up, but wages cannot keep up with them."
 TOTU_SOV_yeltsin_tandem:0 "Tandem with Russia"
 TOTU_SOV_yeltsin_tandem_desc:0 "The Union center and the Russian leadership act together. Decisions come more slowly, but nobody sabotages them."
 TOTU_SOV_war_of_laws:0 "War of Laws"
 TOTU_SOV_war_of_laws_desc:0 "Union and Russian laws contradict each other. Taxes get stuck in the republics, and directors choose whose decree to obey."
 TOTU_SOV_party_control:0 "Party Control"
 TOTU_SOV_party_control_desc:0 "The regional committees decide everything again, from appointing a factory director to the print run of the district newspaper. Order has returned; initiative has vanished."
 TOTU_SOV_great_power_patriotism:0 "Great Power Patriotism"
 TOTU_SOV_great_power_patriotism_desc:0 "The red banner beside the imperial eagle: the country is no longer united by Marx and Lenin, but by the army, the faith and the memory of a great power."
