 # events
 totu_ddr.1.t:0 "Storming Normannenstrasse"
 totu_ddr.1.d:0 "On 15 January thousands of people break into the State Security headquarters on Normannenstrasse in East Berlin. Behind the gates are the archive blocks and Mielke's offices. The citizens' committees demand to be let in to seal the files before the crowd wrecks everything and the officers destroy the rest."
 totu_ddr.1.a:0 "Let the citizens' committees in"
 totu_ddr.1.b:0 "Cordon off the building"
 totu_ddr.3.t:0 "The Volkskammer Election"
 totu_ddr.3.d_alliance:0 "On 18 March the GDR votes freely for the first time; turnout is 93 percent. The Alliance for Germany, led by the CDU, takes 48 percent: the East has voted for the Deutsche Mark and for Kohl, who was on no ballot. The new prime minister will be Lothar de Maizière, a lawyer and former viola player."
 totu_ddr.3.d_spd:0 "On 18 March the GDR votes freely for the first time; turnout is 93 percent. The Social Democrats, the favourites of every poll all winter, win. Ibrahim Böhme promises unity without haste and without a sell-off."
 totu_ddr.3.d_pds:0 "On 18 March the GDR votes freely for the first time; turnout is 93 percent. Against every forecast Gregor Gysi's PDS remains the strongest party: the country that was invited to disappear has decided to live a while longer. Modrow stays prime minister."
 totu_ddr.3.a:0 "De Maizière's government"
 totu_ddr.3.b:0 "Böhme's government"
 totu_ddr.3.c:0 "Modrow stays"
