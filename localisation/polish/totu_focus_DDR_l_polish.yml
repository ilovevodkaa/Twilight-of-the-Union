 # GENERATED by tools/build_focus_tree.py: English copy of localisation/english/totu_focus_DDR_l_english.yml.
 # GENERATED by tools/build_focus_tree.py from tools/src/focus/DDR.json.
 TOTU_DDR_focus:0 "East German National Focus"
 DDR_modrow_government:0 "Modrow's Government"
 DDR_modrow_government_desc:0 "On 13 November 1989 the Volkskammer made Hans Modrow prime minister, a Dresden party secretary with a reformer's reputation. He inherited a country people are leaving and a party people are quitting."
 DDR_truth_about_debts:0 "The Truth about the Debt"
 DDR_truth_about_debts_desc:0 "The Schürer report, locked in a Politburo safe since October, lands on the Volkskammer's table. The country lives on Western credit, and to stop borrowing it would have to cut living standards by a quarter."
 DDR_mil_admiral_hoffmann:0 "An Admiral at the Ministry"
 DDR_mil_admiral_hoffmann_desc:0 "On 18 November 1989 Admiral Theodor Hoffmann, commander of the Volksmarine, became Minister of National Defence. His predecessors sat in the Politburo; he is spared that, since the Politburo resigned on 3 December."
 DDR_round_table_course:0 "The Round Table Course"
 DDR_round_table_course_desc:0 "Since December the government and the opposition have met every week at one table: New Forum, the churches, the new parties. The Round Table's decisions have no force of law, yet nothing is decided without it."
 DDR_honecker_warrant:0 "A Warrant for Honecker"
 DDR_honecker_warrant_desc:0 "On 29 January prosecutors arrest Erich Honecker as he leaves the Charité hospital and release him the next day on doctors' orders. The country's former master finds shelter in Lobetal with Pastor Uwe Holmer, whose children were kept out of university under Honecker."
 DDR_party_of_democratic_socialism:0 "Party of Democratic Socialism"
 DDR_party_of_democratic_socialism_desc:0 "On 4 February the SED-PDS cuts the first three letters off its name. Gysi explains that the party has broken with its past; former members, that the past has broken with the party: of two million, fewer than a million are left."
 DDR_moscow_visit:0 "Visit to Moscow"
 DDR_moscow_visit_desc:0 "On 30 January Modrow flies to Gorbachev and hears what he did not expect: in principle, nobody in Moscow objects to German unity. The Kremlin no longer holds on to the GDR; now it bargains over it."
 DDR_eco_koko_legacy:0 "The KoKo Legacy"
 DDR_eco_koko_legacy_desc:0 "On 3 December 1989 Alexander Schalck-Golodkowski, head of Commercial Coordination, flees to West Berlin. His domain turns out to hold an arms and antiques trade, secret accounts and warehouses of Western machine tools bought around the embargo for the microelectronics programme."
 DDR_eco_cheap_bread:0 "The Five-Pfennig Roll"
 DDR_eco_cheap_bread_desc:0 "A bread roll has cost five pfennigs since the fifties, rents are frozen at 1936 levels, and subsidies eat a fifth of the budget. The government decides to leave prices alone: something in the country ought to stay the same."
 DDR_eco_price_reform:0 "Prices without Subsidies"
 DDR_eco_price_reform_desc:0 "Since the Wall opened, West Berliners have been buying up cheap bread, meat and children's clothes, and taking them out had to be banned. Subsidies go and people get a cash supplement instead: prices rise, but wallets hold for now."
 DDR_joint_ventures:0 "Joint Ventures"
 DDR_joint_ventures_desc:0 "A decree of 25 January lets Western capital into the people's enterprises. The first to arrive in East Berlin are not investors but consultants with calculators."
 DDR_eco_kombinate:0 "Kombinate without a Plan"
 DDR_eco_kombinate_desc:0 "The State Planning Commission no longer hands down targets, and the directors-general of the Kombinate decide for the first time what to make and whom to sell it to. Many promptly find there is no one to sell to."
 DDR_mil_army_without_party:0 "An Army Without the Party"
 DDR_mil_army_without_party_desc:0 "The SED's party cells leave the barracks and the Main Political Administration is wound up. The political officers are left without a party and with a great deal of free time."
 DDR_mil_kampfgruppen:0 "Disarm the Combat Groups"
 DDR_mil_kampfgruppen_desc:0 "The Combat Groups of the Working Class, some hundred and ninety thousand men with rifles attached to factories and combines, are being disbanded under the government's decision of 14 December. The weapons go to the depots, the men go back to the machines, which are short of hands anyway."
 DDR_mil_border_troops:0 "New Crossings"
 DDR_mil_border_troops_desc:0 "The Border Troops, almost fifty thousand men, are learning to let people through rather than stop them. Each week another crossing opens on the old strip, and sappers cut gaps in the fence for roads severed decades ago."
 DDR_mil_pact_loyalty:0 "True to the Alliance"
 DDR_mil_pact_loyalty_desc:0 "The government assures the allies that the GDR stays in the Warsaw Pact. The NVA is the only army of the bloc entirely assigned to the Unified Command, which for now still sounds like a guarantee rather than a sentence."
 DDR_mil_volksmarine:0 "The Volksmarine"
 DDR_mil_volksmarine_desc:0 "The Volksmarine: three flotillas, fourteen thousand sailors and headquarters in Rostock. The Wolgast yard builds small anti-submarine ships both for it and for the Soviet Baltic Fleet, for as long as the orders last."
 DDR_mil_mig29:0 "Twenty-Four MiGs"
 DDR_mil_mig29_desc:0 "Since 1988 the 3rd Fighter Wing at Preschen has flown twenty-four MiG-29s, the newest aircraft the GDR ever had. NATO staffs would very much like a closer look at them."
 DDR_dissolve_stasi:0 "Dissolve the Stasi"
 DDR_dissolve_stasi_desc:0 "The Office for National Security, the Stasi under its last name, is shut down. Citizens' committees seal the archives before the officers can burn everything, and argue over what to do with files on six million people."
 DDR_media_law:0 "The Media Resolution"
 DDR_media_law_desc:0 "On 5 February the Volkskammer guarantees freedom of opinion, information and the media, and puts television under a Media Control Council instead of the Party. Newspapers that printed Honecker's speeches yesterday learn to print readers' letters."
 DDR_national_responsibility:0 "Government of National Responsibility"
 DDR_national_responsibility_desc:0 "On 5 February eight ministers without portfolio from the opposition join Modrow's cabinet. The government is no longer the Party's alone, and now everyone will answer for it."
 DDR_modrow_heads_the_list:0 "Modrow Heads the List"
 DDR_modrow_heads_the_list_desc:0 "The most popular politician in the country agrees to head the PDS list. The prime minister of a government of national responsibility is now campaigning for one party, and the opposition ministers without portfolio ask whose government it is."
 DDR_modrow_plan:0 "Germany, United Fatherland"
 DDR_modrow_plan_desc:0 "On 1 February Modrow puts forward his plan: a treaty community, then a confederation, then one state, a neutral one. 'Germany, united fatherland', a line from the GDR anthem that had gone unsung for years, is heard aloud again."
 DDR_eco_intershops:0 "Intershops and Forum Cheques"
 DDR_eco_intershops_desc:0 "Intershops sell Western coffee, jeans and tape recorders for hard currency, and East Germans pay with Forum cheques bought for West German marks. The chain is taken away from KoKo, and its takings now go to the budget rather than to accounts even the Planning Commission never knew about."
 DDR_eco_currency_union:0 "Currency Union"
 DDR_eco_currency_union_desc:0 "The State Treaty is signed on 18 May, and on 1 July the Deutsche Mark arrives: wages and pensions convert one to one, savings above a limit two to one. Overnight the East gets a hard currency, and its factories get Western prices for everything they make."
 DDR_eco_social_charter:0 "The Social Charter"
 DDR_eco_social_charter_desc:0 "In March the Round Table adopted a Social Charter: the rights to work, housing and a pension that the GDR wants to take with it into any Germany. The SPD government makes it a condition of the treaty with Bonn: wages, pensions and savings up to a limit at one to one."
 DDR_treuhand:0 "The Trust Agency"
 DDR_treuhand_desc:0 "On 1 March the government sets up an agency to keep the people's property from being sold off. Within half a year it will be the biggest seller in the country."
 DDR_eco_trabant:0 "The Trabant 1.1"
 DDR_eco_trabant_desc:0 "From May Zwickau builds the Trabant with a Volkswagen four-stroke engine, the kind the Wartburg got back in 1988. The cars finally run without blue smoke, but cost almost as much as a used Golf."
 DDR_eco_volkswagen_mosel:0 "Volkswagen in Mosel"
 DDR_eco_volkswagen_mosel_desc:0 "Volkswagen and IFA set up a joint company, the Mosel works near Zwickau assemble the Polo, and in Eisenach Opel starts building the Vectra. The Trabant and the Wartburg have until spring."
 DDR_eco_dresden_megabit:0 "The Dresden Megabit"
 DDR_eco_dresden_megabit_desc:0 "In September 1988 Honecker was handed the GDR's first megabit chip, at over five hundred marks each against a world price of a few dollars. Expensive, but the Dresden Microelectronics Centre can do what nobody else in the Eastern bloc can."
 DDR_mil_beelitz_demands:0 "The Beelitz Demands"
 DDR_mil_beelitz_demands_desc:0 "In January soldiers at Beelitz refuse to go on duty: they want to wear civilian clothes on leave, spend weekends at home and serve less time. The ministry sends people to negotiate, not to punish."
 DDR_mil_barracks_order:0 "Order in the Barracks"
 DDR_mil_barracks_order_desc:0 "The ringleaders go to the guardhouse and all leave is cancelled until further notice; that evening West German television reports it. The ranks hold, but they look at their officers differently now."
 DDR_mil_guard_regiment:0 "The Guard Regiment"
 DDR_mil_guard_regiment_desc:0 "The State Security guard regiment 'Feliks Dzierzynski', eleven thousand men with armoured carriers, loses both its patron and its master. Its conscripts finish their service on building sites and in hospitals, and the barracks in Adlershof wait for new tenants."
 DDR_mil_tear_down_wall:0 "Demolishing the Wall"
 DDR_mil_tear_down_wall_desc:0 "On 13 June 1990 GDR border troops officially begin demolishing the Wall they used to guard, starting on Bernauer Strasse. The painted segments go under the hammer in Monte Carlo; the rest is crushed into gravel for roads."
 DDR_mil_vienna_talks:0 "The Vienna Talks"
 DDR_mil_vienna_talks_desc:0 "In Vienna twenty-three states haggle over tanks, guns and aircraft from the Atlantic to the Urals. For the first time the GDR delegation speaks there from more than a script sent by Moscow."
 DDR_mil_wgf_bill:0 "A Bill for the Western Group"
 DDR_mil_wgf_bill_desc:0 "For forty years the GDR has kept the Soviet troops: land, barracks, coal, rail wagons, and training grounds unrecognisable after every exercise. For the first time the Ministry of Finance is told to put a figure on it."
 DDR_mil_volksmarine_baltic:0 "The Volksmarine in the Baltic"
 DDR_mil_volksmarine_baltic_desc:0 "A fleet that spent thirty years preparing for landings on the Danish islands turns to guarding fishing zones, sweeping old mines and rescue at sea. The ships are the same; only now the exercises end in home waters."
 DDR_mil_migs_for_luftwaffe:0 "MiGs for the Luftwaffe"
 DDR_mil_migs_for_luftwaffe_desc:0 "Of all the NVA's Soviet equipment, the Bundeswehr agrees to keep only the twenty-four MiG-29s. The Preschen pilots learn NATO flying rules, and NATO staffs at last get their close look at the MiG."
 DDR_hva_self_dissolution:0 "The Spies Disband Themselves"
 DDR_hva_self_dissolution_desc:0 "In February the Round Table lets the Main Intelligence Directorate, the Stasi's foreign arm, wind itself up. The officers promise to go quietly and spend the next few months methodically burning the files on their agents in the West."
 DDR_citizens_committees:0 "Archives in Citizens' Hands"
 DDR_citizens_committees_desc:0 "The citizens' committees demand that not a single folder leave the archives, the spies' folders included. The keys to the stores are now held by pastors, students and engineers who keep watch in shifts."
 DDR_election_law:0 "The Election Law"
 DDR_election_law_desc:0 "On 20 February the Volkskammer passes the law on free elections: no threshold, no single list, Western observers welcome. The Round Table asks Western politicians not to campaign in the GDR, and of course they come."
 DDR_unity_without_haste:0 "Unity Without Haste"
 DDR_unity_without_haste_desc:0 "At their Leipzig congress of 22–25 February the Social Democrats elect Ibrahim Böhme chairman and Willy Brandt honorary chairman. Their answer to Kohl: yes to unity, but through a new constitution, with a social charter and without a sell-off."
 DDR_bonn_visit:0 "Visit to Bonn"
 DDR_bonn_visit_desc:0 "On 13 February Modrow asks Kohl for a fifteen-billion-mark 'solidarity contribution' and leaves empty-handed. Instead of money, Bonn offers something else: the Deutsche Mark for everyone, on Western terms."
 DDR_eco_convertible_mark:0 "A Convertible Mark"
 DDR_eco_convertible_mark_desc:0 "Christa Luft expected to reach a convertible mark over several years; the PDS government covers the distance in one. KoKo's reserves and the Intershop takings go into a stabilisation fund, and the GDR mark is made freely exchangeable, as Poland did with the zloty in January."
 DDR_eco_unity_fund:0 "The German Unity Fund"
 DDR_eco_unity_fund_desc:0 "On 16 May Bonn and the Länder set up a fund of 115 billion marks to plug the GDR budget for four and a half years. With Western money the East repairs roads, lays telephone lines and builds sewage works."
 DDR_eco_privatisation_law:0 "The Privatisation Law"
 DDR_eco_privatisation_law_desc:0 "On 17 June the Volkskammer passes the Treuhand law: eight thousand people's enterprises are to find private owners. 'Privatise quickly, restructure decisively, close carefully,' as its future head Detlev Rohwedder will put it."
 DDR_eco_share_certificates:0 "Shares in the People's Property"
 DDR_eco_share_certificates_desc:0 "Back in February Wolfgang Ullmann of Democracy Now proposed to the Round Table that the people's enterprises be handed to the citizens in shares. Now the certificates are printed: the Kombinate have sixteen million co-owners and not a single outside buyer."
 DDR_eco_pollution_data:0 "The Pollution Data"
 DDR_eco_pollution_data_desc:0 "Since 1982 data on the state of the environment had been a state secret. In spring 1990 they are published: Bitterfeld and Leuna are the dirtiest places in Europe, and people take dosimeters to the uranium heaps around Ronneburg and Aue."
 DDR_eco_carl_zeiss_jena:0 "Carl Zeiss Jena"
 DDR_eco_carl_zeiss_jena_desc:0 "The Jena opticians built the steppers for the megabit chip, projectors for planetariums around the world and sights for the army. For forty years a Western Zeiss with the same name has worked in Oberkochen, and in 1990 the two firms sit down together for something other than a dispute over the name."
 DDR_mil_civil_service:0 "Civilian Service"
 DDR_mil_civil_service_desc:0 "The ordinance of 20 February 1990: anyone who will not bear arms may serve in a hospital or an old people's home. The construction soldiers, who since 1964 had dug trenches without rifles, have their law at last."
 DDR_mil_military_reform:0 "The Military Reform"
 DDR_mil_military_reform_desc:0 "The government commission on military reform writes what the GDR never had: a defence doctrine for a parliament rather than a Politburo. Item one cuts conscription from eighteen months to twelve."
 DDR_mil_soldiers_in_factories:0 "Soldiers in the Factories"
 DDR_mil_soldiers_in_factories_desc:0 "Two thousand people leave the country every day and the army plugs the gaps: after the former guard regiment's conscripts, NVA soldiers unload freight wagons, stoke boiler houses and work as orderlies in Berlin hospitals. Many call it the most useful duty of their whole service."
 DDR_mil_defensive_sufficiency:0 "Defensive Sufficiency"
 DDR_mil_defensive_sufficiency_desc:0 "The Warsaw Pact's defensive doctrine of 1987 finally reaches the regiments: six NVA tank regiments were disbanded back in 1989, and the exercises are rewritten for defence. For the first time the General Staff counts how much army the country needs, not how much it is told to have."
 DDR_mil_wgf_withdrawal:0 "The Withdrawal Treaty"
 DDR_mil_wgf_withdrawal_desc:0 "The Western Group goes home: half a million people with their families, four thousand tanks, and washing lines in every garrison yard. The treaty gives them four years, though most of the trains will leave in the first two; who pays for the journey and the officers' flats is argued to the last line."
 DDR_mil_conversion:0 "Swords into Ploughshares"
 DDR_mil_conversion_desc:0 "The Dresden aircraft works, which serviced warplanes, looks for civilian orders, and the Wolgast yard for ferry contracts. 'Swords into ploughshares', a patch the police cut off jackets in 1982, becomes industrial policy."
 DDR_mil_arms_sales:0 "Selling the Arsenals"
 DDR_mil_arms_sales_desc:0 "ITA, the foreign trade firm that sold arms to friendly regimes for hard currency, gets a new catalogue: the NVA's own surplus. The buyers ask about the MiGs; the ministry offers boots."
 DDR_for_our_country:0 "For Our Country"
 DDR_for_our_country_desc:0 "The appeal of Christa Wolf and Stefan Heym: there is still a chance to build a socialist alternative to the Federal Republic. Over a million people signed it, Egon Krenz among them, which made many signatories want their names back."
 DDR_accept_currency_union:0 "Accept the Currency Union"
 DDR_accept_currency_union_desc:0 "Kohl promises East Germans the Deutsche Mark, and the demonstrators in Leipzig answer in their own way: 'If the D-Mark comes, we stay; if it doesn't, we go to it.' The 18 March election will be a referendum on the mark."
 DDR_eco_koko_accounts:0 "KoKo's Accounts to the Budget"
 DDR_eco_koko_accounts_desc:0 "A Volkskammer committee goes through Schalck's empire, and West German auditors help to trace his accounts. KoKo's firms go to the Finance Ministry, and for the first time the money found goes into a budget that parliament knows about."
 DDR_eco_unemployment_insurance:0 "Unemployment Insurance"
 DDR_eco_unemployment_insurance_desc:0 "For forty years the GDR officially had no unemployment; in February the Modrow government brought in the first benefits, and in summer job centres open. The factories discover Kurzarbeit Null, short time zero: the job is still yours, but there is no work."
 DDR_eco_property_question:0 "The Property Question"
 DDR_eco_property_question_desc:0 "Who owns a house on confiscated land: the people who live in it, or the heirs of those who left for the West? Bonn says the former owners, except for land from the 1945–49 land reform; the PDS says the tenants."
 DDR_eco_eko_hot_mill:0 "A Hot Mill for EKO"
 DDR_eco_eko_hot_mill_desc:0 "The Eisenhüttenstadt combine smelts Soviet ore and rolls thin sheet, but brings in its hot strip from elsewhere: its own hot mill was never built. Without one, EKO can be neither saved nor sold."
 DDR_eco_warnow_yards:0 "The Warnow Yards"
 DDR_eco_warnow_yards_desc:0 "The Warnow yard at Warnemünde and its neighbours in Rostock, Wismar and Stralsund build container ships and trawlers, most of them for the Soviet Union. As long as Moscow pays in transferable roubles, there are orders for years ahead."
 DDR_eco_shut_bitterfeld:0 "Shut Old Bitterfeld"
 DDR_eco_shut_bitterfeld_desc:0 "The works that have made chlorine and carbide since before the war are shut down, and the Silver Lake of toxic sludge is fenced off. Bitterfeld loses thousands of jobs and sees the sky for the first time in decades."
 DDR_eco_leuna_buna:0 "Leuna and Buna Keep Running"
 DDR_eco_leuna_buna_desc:0 "Leuna refines Soviet oil from the Druzhba pipeline and Buna makes rubber from lignite and carbide; shutting them would put tens of thousands out of work. The plants are patched up while they run."
 DDR_mil_new_oath:0 "The New Oath"
 DDR_mil_new_oath_desc:0 "On 20 July 1990, the anniversary of the attempt on Hitler's life, NVA soldiers take a new oath: not to the workers' and peasants' government or to brotherhood with the Soviet Army, but to the republic, its people and the law."
 DDR_mil_disarmament_ministry:0 "Ministry of Disarmament"
 DDR_mil_disarmament_ministry_desc:0 "In April 1990 the coalition government's new minister is Rainer Eppelmann, pastor of the Samaritan Church, who in 1966 went to prison for refusing the oath. His first act is to rename the ministry: disarmament first, defence second."
 DDR_mil_call_from_wuensdorf:0 "A Call from Wünsdorf"
 DDR_mil_call_from_wuensdorf_desc:0 "In Moscow the hard-liners have prevailed, and Wünsdorf, the Western Group's headquarters, calls Strausberg asking to coordinate 'measures to maintain order'. For now, they ask politely."
 DDR_mil_neutral_army:0 "The Army of a Neutral GDR"
 DDR_mil_neutral_army_desc:0 "The PDS takes the core of Modrow's plan: a Germany outside the blocs and, until then, a GDR that threatens no one. The NVA becomes an army of territorial defence, and the Warsaw Pact a treaty one leaves by the rules."
 DDR_mil_leave_unified_command:0 "Leaving the Unified Command"
 DDR_mil_leave_unified_command_desc:0 "The NVA's liaison officers come home from the Unified Armed Forces headquarters in Moscow, the air-defence duty forces stop reporting to the joint command post, and the plans with red arrows pointing west go to the archive. The protocol on membership of the Pact is for the politicians to sign; the army has already left the bloc."
 DDR_boehme_cabinet:0 "The Böhme Cabinet"
 DDR_boehme_cabinet_desc:0 "The winter polls were right after all: the Social Democrats win and form a coalition with Alliance 90 and the Liberals. Ibrahim Böhme promises unity step by step, and no step without social protection."
 DDR_modrow_mandate:0 "Modrow's Mandate"
 DDR_modrow_mandate_desc:0 "Modrow stays prime minister, an elected one this time. The PDS governs with the former bloc parties, the streets chant 'We are one people' again, and Bonn shelves the talks until better times."
 DDR_de_maiziere_cabinet:0 "The de Maizière Cabinet"
 DDR_de_maiziere_cabinet_desc:0 "On 12 April the Volkskammer elects Lothar de Maizière prime minister. The coalition of the CDU, the DSU, Democratic Awakening, the Social Democrats and the Liberals holds more than two thirds of the seats: enough to change the constitution and, as it will turn out, to abolish the state."
 DDR_eco_socialist_market:0 "Socialist Market Economy"
 DDR_eco_socialist_market_desc:0 "The Kombinate are joint-stock companies with their shares held by citizens and the state, prices are free, and any bank changes GDR marks into dollars. Modrow calls it socialism; the Western papers call it the Hungarian model."
 DDR_eco_social_market:0 "Social Market Economy"
 DDR_eco_social_market_desc:0 "The State Treaty names it the common order of both German states. The first winter with the mark is over: the Kombinate have split into hundreds of firms, queues have given way to prices, and short time to retraining."
 DDR_eco_lpg_reform:0 "Co-ops on the Market"
 DDR_eco_lpg_reform_desc:0 "A law of 29 June lets members of the farm co-operatives take back their land and livestock. Farms that delivered milk to the plan for forty years now have to sell it to shops already stocked with Western brands."
 DDR_eco_comecon_dollars:0 "Comecon Goes to Dollars"
 DDR_eco_comecon_dollars_desc:0 "In January 1990 the Comecon session in Sofia decided to trade at world prices and in hard currency from 1991. The transferable rouble is dying, and with it the orders that kept the shipyards, Robotron and EKO going."
 DDR_eco_schwarze_pumpe:0 "Schwarze Pumpe"
 DDR_eco_schwarze_pumpe_desc:0 "The GDR mines three hundred million tonnes of lignite a year, more than anyone in the world, and Schwarze Pumpe turns it into briquettes, coke and gas for half the country. The combine stays open, with filters fitted: without Lusatian coal there is neither light nor heat."
 DDR_eco_close_wismut:0 "Close the Wismut Mines"
 DDR_eco_close_wismut_desc:0 "The Soviet-German company Wismut has mined uranium for Soviet bombs and reactors for forty years. Mining is to end by the close of the year: Moscow no longer needs the uranium so badly, and the heaps at Ronneburg are radiating across the district."
 DDR_eco_uranium_for_moscow:0 "Uranium for Moscow"
 DDR_eco_uranium_for_moscow_desc:0 "Forty-odd thousand miners in the Ore Mountains and Thuringia keep their jobs, and the uranium keeps going east. Moscow is pleased; the doctors in Aue are not."
 DDR_mil_bundeswehr_talks:0 "Talks with the Bundeswehr"
 DDR_mil_bundeswehr_talks_desc:0 "In late April the two German defence ministers sit down at one table for the first time. Stoltenberg speaks of one army in NATO; the NVA officers listen and update their CVs."
 DDR_mil_two_armies:0 "Two Armies in One Country"
 DDR_mil_two_armies_desc:0 "Eppelmann proposes what Bonn does not want to hear: for a transitional period a reduced NVA stays a separate East German army, outside NATO and alongside the Soviet troops. For the first time the NVA officers applaud their pastor."
 DDR_mil_nva_on_alert:0 "The NVA on Alert"
 DDR_mil_nva_on_alert_desc:0 "Leave is cancelled, the tanks are fuelled, and the NVA and the Western Group have a joint staff again. Bonn puts all talks on hold, and Berliners look at the barracks the way they did in October 1989."
 DDR_mil_territorial_defence:0 "Territorial Defence"
 DDR_mil_territorial_defence_desc:0 "Swiss and Austrian officers are invited to Strausberg to explain how a small neutral country defends itself without threatening anyone. The depots have rifles enough for a militia: more rifles than volunteers."
 DDR_round_table_constitution:0 "The Round Table's Constitution"
 DDR_round_table_constitution_desc:0 "On 4 April the Round Table's working group presents its draft of a new GDR constitution: the right to work and to housing, referendums, citizens' movements as part of the state. The Böhme government puts it before the Volkskammer as the basis for talks with Bonn."
 DDR_deputies_check:0 "Vetting the Deputies"
 DDR_deputies_check_desc:0 "The Volkskammer decides to check all 400 deputies against the Stasi card index. The results are read behind closed doors, and a few seats in the chamber fall empty without explanation."
 DDR_municipal_constitution:0 "The Municipal Constitution"
 DDR_municipal_constitution_desc:0 "On 6 May the GDR elects its town and district assemblies, which then choose the mayors, and on 17 May the Volkskammer hands the communes their own affairs. The Böhme government promises to send them money from East Berlin, not instructions."
 DDR_democratic_socialism:0 "Democratic Socialism"
 DDR_democratic_socialism_desc:0 "Gysi's programme: a market without a sell-off, ownership by the workforces, free elections and no leading role. Inside the party they argue whether this is socialism; in the West, whether it is democracy."
 DDR_sed_property_review:0 "Auditing the SED's Property"
 DDR_sed_property_review_desc:0 "An independent commission lists what the SED acquired in forty years: holiday homes, printing works, hotels and accounts not even Gysi knew about. The PDS keeps the Karl Liebknecht House and hands the rest to the state, loudly and, as it will turn out, not all of it."
 DDR_constitutional_principles:0 "Constitutional Principles"
 DDR_constitutional_principles_desc:0 "On 17 June the Volkskammer passes the law on constitutional principles: the GDR is a free, democratic, federal, social and ecological state under the rule of law. Its key clause allows sovereignty to be transferred, and Moscow reads that too."
 DDR_municipal_elections:0 "Local Elections"
 DDR_municipal_elections_desc:0 "On 6 May the GDR elects its town and district assemblies, which then choose the mayors, and on 17 May the municipalities get the right to run their own affairs. For the first time in forty years a mayor answers to the townspeople, not to the first secretary."
 DDR_mil_bundeswehr_command_east:0 "Bundeswehr Command East"
 DDR_mil_bundeswehr_command_east_desc:0 "In Strausberg, home of the NVA ministry, a staff is being prepared for Lieutenant-General Jörg Schönbohm. On the day of unity he will take command of ninety thousand men and keep few of them."
 DDR_mil_army_of_unity:0 "An Army of Unity"
 DDR_mil_army_of_unity_desc:0 "The Social Democrats propose a joint security council for the confederation and two armies, each cut by half, with no foreign troops by the end of the decade. Bonn calls it naive; Moscow calls it reasonable."
 DDR_mil_back_to_barracks:0 "The NVA Back to Barracks"
 DDR_mil_back_to_barracks_desc:0 "The tanks return to their parks, and the joint staff is once again just the Western Group's staff. Wünsdorf is displeased, but the NVA generals remember October 1989 too well."
 DDR_mil_professional_army:0 "A Professional Army"
 DDR_mil_professional_army_desc:0 "The PDS promised to abolish conscription. That proves impossible, but compulsory service is cut to six months, and the core of the army is recruited on contract from discharged warrant officers and officers. The army becomes smaller, older and more expensive."
 DDR_mil_stationing_treaty:0 "The Stationing Treaty"
 DDR_mil_stationing_treaty_desc:0 "The 1957 agreement on the 'temporary' stationing of Soviet troops is rewritten for the first time in thirty-three years: Moscow pays for the land and the training grounds and clears its manoeuvres with Strausberg, and the length of the stay is tied to a future all-European treaty. The temporary stays permanent, but now it is paid for."
 DDR_social_charter:0 "The Charter as a Condition"
 DDR_social_charter_desc:0 "In March the Round Table adopted a social charter: the right to work, to housing, to a kindergarten place and to equal pay for women. The Böhme government makes it a condition: whatever is signed with Bonn, the charter goes into the treaty."
 DDR_confederation:0 "Confederation"
 DDR_confederation_desc:0 "Two states, one parliamentary council and joint commissions on currency, transport and law. Bonn calls it an unnecessary stage; Böhme calls it a way not to lose a single job on the road."
 DDR_right_to_ones_file:0 "The Right to One's File"
 DDR_right_to_ones_file_desc:0 "The Böhme government passes a Stasi files law: the archives stay in the East, and everyone who was written about will have the right to read their own file. Bonn advises locking the archives away for a long time, preferably for ever."
 DDR_laender_not_districts:0 "Länder Instead of Districts"
 DDR_laender_not_districts_desc:0 "The Social Democrats also want to bring back the Länder abolished in 1952, but they argue over the borders: Berlin with Brandenburg or on its own, Saxony with or without its scrap of Silesia. While they argue, the fifteen district councils wait to learn who will pay their staff."
 DDR_treaty_community:0 "Treaty Community Commissions"
 DDR_treaty_community_desc:0 "Modrow proposed a treaty community back in November 1989, and even Kohl put one into his ten points. Now it is given some substance: joint commissions on the economy, law and the environment, harmonised laws and no deadlines."
 DDR_talks_moratorium:0 "A Moratorium on Talks"
 DDR_talks_moratorium_desc:0 "The government declares a pause: no talks on unification until the GDR has put its own house in order. Bonn calls it blackmail; the factories call it a breathing space."
 DDR_stasi_files_law:0 "The Stasi Files Law"
 DDR_stasi_files_law_desc:0 "On 24 August the Volkskammer decides that the files stay in the East and that everyone may read what was written about them. Their keeper will be Pastor Joachim Gauck, who knows more about these folders than he would like."
 DDR_accession_at_once:0 "Accession at Once"
 DDR_accession_at_once_desc:0 "On 17 June the DSU moved to join the Federal Republic that same day, without treaties or deadlines, and the motion was sent to committee. Now a majority votes for it, and the coalition loses the Social Democrats and the Liberals."
 DDR_accession_vote:0 "The Vote of 23 August"
 DDR_accession_vote_desc:0 "In a night sitting the Volkskammer votes to join the Federal Republic under Article 23 of the Basic Law, 294 to 62. Gysi remarks from the rostrum that parliament has just abolished its own state, and the chamber applauds."
 DDR_five_laender:0 "Five Länder"
 DDR_five_laender_desc:0 "On 22 July the Volkskammer restores the Länder abolished in 1952: Mecklenburg-Western Pomerania, Brandenburg, Saxony-Anhalt, Thuringia and Saxony. The fifteen districts pass into history, and with them fifteen district Party committees."
 DDR_mil_nva_transition:0 "A Transition Period for the NVA"
 DDR_mil_nva_transition_desc:0 "Bonn agrees not to dissolve the NVA on the day of unity: officers and warrant officers serve two more years on temporary contracts while the Bundeswehr decides whom to keep. Eppelmann calls it a victory, Stoltenberg a postponement."
 DDR_neutral_germany:0 "A Neutral Germany"
 DDR_neutral_germany_desc:0 "A united Germany outside both NATO and the Warsaw Pact, as Moscow and half the Round Table proposed. Moscow is pleased; Washington and Bonn are reminded of Stalin's note of 1952."
 DDR_genscher_formula:0 "The Genscher Formula"
 DDR_genscher_formula_desc:0 "On 31 January in Tutzing Hans-Dietrich Genscher proposed that a united Germany stay in NATO while the alliance's troops stay out of the East. The Böhme government accepts the formula and asks Bonn to pay for the Soviet withdrawal while it is at it."
 DDR_confederation_of_equals:0 "A Confederation of Equals"
 DDR_confederation_of_equals_desc:0 "The second step of the Modrow plan: a joint council of the two parliaments, where the GDR has as many votes as a Federal Republic four times its size. Bonn counts what it will cost; Berlin counts what it will mean."
 DDR_independent_gdr:0 "An Independent GDR"
 DDR_independent_gdr_desc:0 "The government declares that the GDR is neither a provisional state nor a queue for accession. Nobody writes a new anthem; the old one is finally sung with its words again, except the line about one fatherland."
 DDR_lean_on_moscow:0 "Leaning on Moscow"
 DDR_lean_on_moscow_desc:0 "The new men in the Kremlin point out that 380,000 Soviet servicemen have not gone anywhere, and offer oil at the old prices. The GDR has to choose between help and isolation, and the government chooses help."
 DDR_unification_treaty:0 "The Krause Delegation"
 DDR_unification_treaty_desc:0 "From July Günther Krause's delegation bargains with Wolfgang Schäuble over a thousand-page treaty: which West German laws apply in the East from day one, who pays the pensions and what happens to abortion. On 20 August the Social Democrats leave the coalition; on 31 August the treaty is signed."
 DDR_article_146:0 "A Constituent Assembly"
 DDR_article_146_desc:0 "The Basic Law provides for its own end: Article 146 promises a constitution adopted by the whole German people. Deputies of both parliaments sit down to write it together, and the Western members soon find that their Eastern colleagues have read the Round Table draft more closely than the Basic Law."
 DDR_neutral_fatherland:0 "One Neutral Fatherland"
 DDR_neutral_fatherland_desc:0 "The last step of the Modrow plan: one Germany outside the blocs, with no foreign troops and a constitution that keeps room for the GDR's social rights. Moscow has wanted this since 1952, and Washington has feared it just as long."
 DDR_austrian_option:0 "The Austrian Option"
 DDR_austrian_option_desc:0 "In 1955 the USSR withdrew from Austria in exchange for permanent neutrality. East Berlin offers Moscow the same deal: the GDR leaves the Warsaw Pact but does not go West."
 DDR_border_regime:0 "The Border Regime"
 DDR_border_regime_desc:0 "The Wall is not rebuilt, but the crossings once again ask for a visa and a note from your employer. The flow to the West shrinks to a trickle, and the Western evening news talks of nothing else."
 DDR_files_to_koblenz:0 "The Files to Koblenz"
 DDR_files_to_koblenz_desc:0 "Under the first text of the treaty the Stasi archives go under lock to the Federal Archives in Koblenz. Bonn is pleased; the Stasi's former prisoners take a different view."
 DDR_two_plus_four:0 "Two Plus Four"
 DDR_two_plus_four_desc:0 "On 12 September in Moscow the two German states and the four victorious powers sign the final settlement: a united Germany is sovereign and the Soviet troops leave by the end of 1994. Gorbachev's consent cost Bonn twelve billion marks."
 DDR_constitution_referendum:0 "The Constitutional Referendum"
 DDR_constitution_referendum_desc:0 "The draft of a common constitution goes to a referendum in both German states on the same day. In the West they argue over the right to work, in the East over the right to abortion, and in the end both vote yes rather than start again."
 DDR_permanent_neutrality:0 "Permanent Neutrality"
 DDR_permanent_neutrality_desc:0 "The Volkskammer writes into the constitution what Austria wrote in 1955: no alliances and no foreign bases. Soviet troop trains head east, and Wünsdorf empties for the first time since 1945."
 DDR_order_on_air:0 "Order on the Air"
 DDR_order_on_air_desc:0 "'Aktuelle Kamera' clears its reports with the government again. For a while newsstands become the most interesting place in town: they still sell Western magazines."
 DDR_leave_warsaw_pact:0 "Leaving the Warsaw Pact"
 DDR_leave_warsaw_pact_desc:0 "After Two Plus Four, Moscow has nothing left in the GDR to guard with the treaty of 1955. The exit is settled by protocol and without speeches: a country that stood on the bloc's front line for thirty-five years leaves it before the bloc itself is gone."
 DDR_charter_of_paris:0 "The Charter of Paris"
 DDR_charter_of_paris_desc:0 "On 21 November in Paris the CSCE states sign a charter for a new Europe and declare the era of confrontation and division over. The GDR signs it as a state in its own right, to its neighbours' mild surprise."
 DDR_ec_association:0 "An EC Association Agreement"
 DDR_ec_association_desc:0 "In the spring of 1990 the GDR signed a trade and cooperation agreement with the European Community. Now East Berlin asks for the association that Poland, Hungary and Czechoslovakia are already negotiating, and Brussels finds itself discussing a state everyone had thought provisional."
 DDR_snap_election:0 "A Snap Election"
 DDR_snap_election_desc:0 "The coalition put together in the spring for a single question cannot agree on anything else by the winter. The Volkskammer dissolves itself, and the country goes to its second free election in a year, this time without Western speakers in the squares."
 # national spirits
 TOTU_DDR_round_table:0 "Round Table"
 TOTU_DDR_round_table_desc:0 "Power is shared with those who brought people onto the streets in the autumn. The Party still governs, but every decision is first argued over at the round table."
 TOTU_DDR_stasi_besieged:0 "Stasi under Siege"
 TOTU_DDR_stasi_besieged_desc:0 "Citizens' committees occupy the district offices of State Security while the shredders run day and night in the basements. Ninety thousand full-time officers wait to learn their fate."
 TOTU_DDR_national_responsibility:0 "Government of National Responsibility"
 TOTU_DDR_national_responsibility_desc:0 "The Party governs together with those who stood in the squares last autumn. Reforms move faster, but every order now has to be agreed."
 TOTU_DDR_third_way:0 "The Third Way"
 TOTU_DDR_third_way_desc:0 "Socialism without the Stasi and without the Wall. Nobody knows yet what it looks like, but many are willing to try."
 TOTU_DDR_grand_coalition:0 "The Grand Coalition"
 TOTU_DDR_grand_coalition_desc:0 "Five parties, from the DSU to the Social Democrats, and more than two thirds of the seats. The constitution can be amended every week, provided they first agree among themselves."
 TOTU_DDR_maximilian_affair:0 "The 'Maximilian' Affair"
 TOTU_DDR_maximilian_affair_desc:0 "The prime minister denies everything, a committee reads his file and the papers print new extracts every morning. The government works, but every statement it makes is met with the question of who wrote it."
 TOTU_DDR_social_charter:0 "The Social Charter"
 TOTU_DDR_social_charter_desc:0 "The right to work, housing and a kindergarten place is written into the terms of any treaty with Bonn. People are calmer; the budget is not."
 TOTU_DDR_democratic_socialism:0 "Democratic Socialism"
 TOTU_DDR_democratic_socialism_desc:0 "Socialism with free elections, a market and no Stasi. The party believes it can be done; the country is willing to find out."
 TOTU_DDR_neutral_republic:0 "A Neutral Republic"
 TOTU_DDR_neutral_republic_desc:0 "The GDR is no longer in the Warsaw Pact, nor queuing for NATO. It can trade with everyone and has no one to fight and no reason to."
 TOTU_DDR_border_regime:0 "The Border Regime"
 TOTU_DDR_border_regime_desc:0 "The Wall is open, but the crossings have visas and queues again. Fewer people leave, less trade comes through, and those who stay remember who lowered the barrier."
 TOTU_DDR_ec_association:0 "EC Association"
 TOTU_DDR_ec_association_desc:0 "Brussels lifts the quotas on East German goods and sends experts on standards. The standards turn out to be thicker than the quotas."
 TOTU_DDR_open_border:0 "Open Border"
 TOTU_DDR_open_border_desc:0 "The Wall has been open since 9 November. Two thousand people leave for the West every day, mostly the young, workers and doctors. Factories and hospitals empty faster than they can be reformed."
 TOTU_DDR_indebted_plan:0 "A Plan in Debt"
 TOTU_DDR_indebted_plan_desc:0 "The planned economy runs on Western credit and worn-out machines. People wait twelve years for a Trabant, and the debt to the West grows faster than exports."
 TOTU_DDR_joint_ventures:0 "Joint Ventures"
 TOTU_DDR_joint_ventures_desc:0 "Western firms come to Eastern factories with machines, money and the habit of counting every mark."
 TOTU_DDR_cheap_bread:0 "Subsidised Prices"
 TOTU_DDR_cheap_bread_desc:0 "Bread, rent and fares cost what they did under Ulbricht. Shoppers are happy; the budget is not."
 TOTU_DDR_price_reform:0 "Prices without Subsidies"
 TOTU_DDR_price_reform_desc:0 "Prices creep up and the supplements chase them, not always successfully. But for the first time in years the budget is not drowning in subsidies."
 TOTU_DDR_dmark_shock:0 "The D-Mark Shock"
 TOTU_DDR_dmark_shock_desc:0 "People finally have hard money and spend it on Western goods. Eastern factories, suddenly counting in Deutsche Marks, lose their buyers both at home and in Eastern Europe."
 TOTU_DDR_short_time_work:0 "Short Time Zero"
 TOTU_DDR_short_time_work_desc:0 "Hundreds of thousands are on the payroll but stay at home on two thirds of their wages: Kurzarbeit Null, as the Germans call it. It is expensive, but there are no queues of jobless in the streets."
 TOTU_DDR_brain_drain:0 "Brain Drain"
 TOTU_DDR_brain_drain_desc:0 "The border is open, but the GDR mark is now worth something and not everyone leaves any more. Doctors, engineers and programmers still do: the West pays them several times as much."
 TOTU_DDR_restitution_claims:0 "Restitution Claims"
 TOTU_DDR_restitution_claims_desc:0 "Over a million claims for houses, plots and factories. Until the courts work out who owns what, nobody builds and nobody sells."
 TOTU_DDR_social_market:0 "Social Market Economy"
 TOTU_DDR_social_market_desc:0 "A market, but with health insurance, pensions and benefits. The East lives by Western rules and on Western money until it learns to earn its own."
 TOTU_DDR_socialist_market:0 "Socialist Market Economy"
 TOTU_DDR_socialist_market_desc:0 "There is no plan any more, but the factories stay with their workers and the state. Prices are free, the mark is convertible, and the wait for a car is under a year for the first time."
 TOTU_DDR_wave_of_closures:0 "A Wave of Closures"
 TOTU_DDR_wave_of_closures_desc:0 "The Trust Agency shuts whatever nobody will take even for a single mark. The empty halls wait for investors, and their former workers for benefits."
 TOTU_DDR_western_group:0 "Western Group of Forces"
 TOTU_DDR_western_group_desc:0 "Nearly 380,000 Soviet servicemen have been stationed on this soil since 1945, and the GDR budget pays for their land, coal, rail wagons and training grounds. While they remain, nothing is decided without Moscow, neither unification nor its refusal."
 TOTU_DDR_army_at_a_loss:0 "An Army at a Loss"
 TOTU_DDR_army_at_a_loss_desc:0 "The National People's Army swore its oath to the SED, and the SED is gone. Soldiers form councils, officers wait for orders that nobody gives."
 TOTU_DDR_mil_soldiers_councils:0 "Soldiers' Councils"
 TOTU_DDR_mil_soldiers_councils_desc:0 "Every unit now has an elected council that argues with the commander about duties, leave and food. There is less discipline, but fewer deserters too."
 TOTU_DDR_mil_barracks_discipline:0 "Barracks Discipline"
 TOTU_DDR_mil_barracks_discipline_desc:0 "Regulations are enforced to the last comma and leave passes are handed out as rewards. The officers are satisfied; the soldiers count the days to their discharge."
 TOTU_DDR_mil_military_reform:0 "Military Reform"
 TOTU_DDR_mil_military_reform_desc:0 "Twelve months of service instead of eighteen, civilian clothes on leave and the right to complain to parliament. The army is smaller and younger, and its commanders are learning to explain their orders."
 TOTU_DDR_mil_citizens_in_uniform:0 "Citizens in Uniform"
 TOTU_DDR_mil_citizens_in_uniform_desc:0 "The soldier swears to the republic and the law, not to a party. An order can be appealed, and the barracks now have a door to the outside."
 TOTU_DDR_mil_soldiers_in_factories:0 "Soldiers in the Economy"
 TOTU_DDR_mil_soldiers_in_factories_desc:0 "Thousands of soldiers work on the railways, in boiler houses and hospitals in place of those who left for the West. The economy holds; the exercises can wait."
 TOTU_DDR_mil_wgf_departure:0 "The Departing Army"
 TOTU_DDR_mil_wgf_departure_desc:0 "Trains leave for the east, and the markets outside the garrisons sell petrol, uniforms and binoculars. The vacated barracks and airfields await new owners, and the ground beneath them a clean-up."
 TOTU_DDR_mil_peace_dividend:0 "Peace Dividend"
 TOTU_DDR_mil_peace_dividend_desc:0 "The army is cut almost by half, and the money and hands saved go into the economy. The generals grumble; for the first time the finance minister is pleased with the defence minister."
 TOTU_DDR_mil_neutral_army:0 "A Neutral Country's Army"
 TOTU_DDR_mil_neutral_army_desc:0 "The NVA no longer prepares to advance to the Rhine. It defends its own land and asks permission of neither Moscow nor Brussels."
 TOTU_DDR_mil_brotherhood_in_arms:0 "Brotherhood in Arms"
 TOTU_DDR_mil_brotherhood_in_arms_desc:0 "The NVA and the Western Group act as one army again, as taught in every 'Brotherhood in Arms' exercise. The country watches it with alarm."
 TOTU_DDR_mil_stationing_treaty:0 "Garrisons by Treaty"
 TOTU_DDR_mil_stationing_treaty_desc:0 "The Soviet troops stay, but now they pay for the land and clear their exercises. While they are here nobody will attack the GDR, and Moscow remembers it at every round of bargaining."
 TOTU_DDR_mil_professional_army:0 "A Professional Army"
 TOTU_DDR_mil_professional_army_desc:0 "Six months of compulsory service, with sergeants and warrant officers on contract. There are fewer conscripts, but they are trained by men who stayed in the army of their own free will."
