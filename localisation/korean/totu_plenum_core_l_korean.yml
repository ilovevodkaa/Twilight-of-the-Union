 TOTU_plenum_category:0 "Plenum of the Central Committee"
 TOTU_plenum_category_desc:0 "The Central Committee decides where the Party goes, and for now the Party decides where the country goes. Four groups fight for a majority in the hall. The stronger the extremes, the more radical the Party; the weaker its hold, the faster the country slips out of its control."

 TOTU_party_state:0 "State of the CPSU"

 TOTU_pl_lean_dem:0 "Lean on the Democratic Platform"
 TOTU_pl_lean_dem_desc:0 "Give the floor to the Democratic Platform: Afanasyev, Shostakovsky, Lysenko. The reformers are grateful, the apparatus is furious."
 TOTU_pl_lean_gorb:0 "Lean on the Gorbachevites"
 TOTU_pl_lean_gorb_desc:0 "Rally the centre around the General Secretary: those willing to follow Gorbachev as long as he knows where he is going."
 TOTU_pl_lean_cons:0 "Lean on the Conservatives"
 TOTU_pl_lean_cons_desc:0 "Strike a deal with Ligachev and the regional secretaries. They will back us, but they will demand order."
 TOTU_pl_lean_orth:0 "Lean on the Orthodox"
 TOTU_pl_lean_orth_desc:0 "Reach out to Unity and the Soyuz deputies. Their votes come at a price: they want to go back."
 TOTU_pl_unity_appeal:0 "Appeal for Unity"
 TOTU_pl_unity_appeal_desc:0 "An appeal of the Central Committee to all communists: argue inside, decide together. It works as long as people believe it."
 TOTU_pl_strengthen_apparatus:0 "Strengthen the Apparatus"
 TOTU_pl_strengthen_apparatus_desc:0 "Return appointments and personnel control to the regional committees. The Party grows stronger, and more nervous."
 TOTU_pl_purge:0 "Party Purge"
 TOTU_pl_purge_desc:0 "An exchange of party cards and the expulsion of the 'waverers'. The conservatives' old remedy, which makes everyone worse off except them."
 TOTU_pl_open_tribune:0 "Open Tribune"
 TOTU_pl_open_tribune_desc:0 "Let the television cameras into the hall. The reformers win the argument, the apparatus loses its grip, and the country watches."

 SOV_central_committee_plenum_select_tt:0 "The preparation of the Plenum begins: §Y3 events§! while the focus runs. The focus §Rcannot§! be cancelled."
 SOV_central_committee_plenum_tt:0 "The Plenum sits for about §Y200 days§!. The final vote opens the branch of the faction with the most support (§YPlenum of the Central Committee§! in the decisions)."
