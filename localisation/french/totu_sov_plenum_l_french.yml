l_french:
 # GENERATED by tools/build_focus_tree.py: English copy of localisation/english/totu_sov_plenum_l_english.yml.
 # The Central Committee Plenum: preparation, sessions, results and crises (events/TOTU_SOV_plenum.txt).

 # Preparation
 totu_plenum.1.t:0 "The Draft Platform"
 totu_plenum.1.d:0 "A Politburo commission has sent Central Committee members the draft platform for the 28th Congress, 'Towards a Humane, Democratic Socialism'. For the first time a party document says the CPSU claims no monopoly and is ready for political competition.\n\nAlexander Yakovlev considers this wording the necessary minimum. Yegor Ligachev calls it a surrender and wants the leading role of the party written back in. The text can still be changed before the plenum."
 totu_plenum.1.a:0 "Keep Yakovlev's wording"
 totu_plenum.1.b:0 "Write the leading role of the party back in"
 totu_plenum.1.c:0 "Open the draft to party discussion"

 totu_plenum.2.t:0 "Letters from the Obkoms"
 totu_plenum.2.d:0 "In January crowds outside the regional party committees in Volgograd, Tyumen and Chernigov forced their first secretaries to resign. Letters from the regions pour into the Central Committee. Some secretaries ask for protection from 'the street', others report that ordinary members are handing in their party cards by the hundred.\n\nThe regions want the plenum to say who decides now: the obkom or the party conference."
 totu_plenum.2.a:0 "Protect the obkom secretaries"
 totu_plenum.2.b:0 "Let the conferences re-elect their leaders"
 totu_plenum.2.c:0 "Send Central Committee commissions"

 totu_plenum.3.t:0 "On the Eve of the Plenum"
 totu_plenum.3.d:0 "On 4 February about two hundred thousand people marched to Manezh Square. The main demand of the rally: repeal Article 6 of the Constitution.\n\nThe Democratic Platform, founded at a January conference in Moscow, demands the floor for its representatives. Meanwhile Ligachev is gathering the first secretaries and preparing speeches against 'the collapse of the party'. The list of speakers is not yet approved."
 totu_plenum.3.a:0 "Give the Democratic Platform the floor"
 totu_plenum.3.b:0 "The Politburo approves the speakers"
 totu_plenum.3.c:0 "Do not stand in Ligachev's way"

 # Sessions
 totu_plenum.11.t:0 "The Plenum: Article 6"
 totu_plenum.11.d:0 "The plenum opens with the General Secretary's report. Gorbachev proposes giving up the leading role of the CPSU written into the Constitution and competing for power in elections.\n\nBoris Yeltsin and the Democratic Platform demand that the article go at once. Vladimir Brovikov, ambassador to Poland, replies that the country has been brought to ruin and is now being surrendered without a fight. The hall applauds both."
 totu_plenum.11.a:0 "Abolish the monopoly at once"
 totu_plenum.11.b:0 "Amend the article through the Congress"
 totu_plenum.11.c:0 "Keep Article 6"

 totu_plenum.12.t:0 "The Plenum: the Democratic Platform"
 totu_plenum.12.d:0 "Vladimir Shostakovsky, rector of the Moscow Higher Party School, sets out the Democratic Platform's programme: an end to democratic centralism, the right to form factions, and a CPSU turned into a parliamentary party.\n\nThe apparatus prepares its answer, an open letter of the Central Committee 'For Consolidation on a Principled Basis', which proposes expelling the Platform's supporters. Gorbachev has not signed it yet."
 totu_plenum.12.a:0 "Recognise the right to platforms"
 totu_plenum.12.b:0 "Publish the open letter"
 totu_plenum.12.c:0 "Bring the authors into the programme commission"

 totu_plenum.13.t:0 "The Plenum: Ligachev against Yakovlev"
 totu_plenum.13.d:0 "Ligachev reviews ideological work: the press blackens history, Ogonyok and Moscow News work against the party, and their patron in the Politburo is Yakovlev.\n\nYakovlev answers that a party afraid of its own history will not win a single election. The two Central Committee secretaries have been arguing for three years. Now the plenum waits to see whose side the General Secretary takes."
 totu_plenum.13.a:0 "Back Yakovlev"
 totu_plenum.13.b:0 "Back Ligachev"
 totu_plenum.13.c:0 "Send them to separate commissions"

 totu_plenum.14.t:0 "The Plenum: the Baltic Question"
 totu_plenum.14.d:0 "In December the Communist Party of Lithuania under Algirdas Brazauskas left the CPSU. A minority under Mykolas Burokevicius stayed 'on the platform of the CPSU'. The same split is coming in Estonia and Latvia.\n\nDelegates from the republics ask whether the CPSU can become a federation of independent parties. The Moscow secretaries answer that a federation of parties would be the first step towards the break-up of the Union."
 totu_plenum.14.a:0 "Allow a federation of parties"
 totu_plenum.14.b:0 "Rely on Burokevicius"
 totu_plenum.14.c:0 "Press with the economy, not the party rules"

 totu_plenum.15.t:0 "The Plenum: Yeltsin Speaks"
 totu_plenum.15.d:0 "Yeltsin takes the floor out of turn. He demands an end to the apparatus's privileges, power for the Soviets, and the right of communists to join other parties. If the plenum refuses, he says, he will have to decide whether to stay in the CPSU.\n\nIvan Polozkov asks for the right to reply. The hall is noisy, and the chairman looks at Gorbachev."
 totu_plenum.15.a:0 "Let Yeltsin finish"
 totu_plenum.15.b:0 "Let Polozkov answer for the Central Committee"
 totu_plenum.15.c:0 "Offer Yeltsin a deal"

 totu_plenum.16.t:0 "The Plenum: the Economic Programme"
 totu_plenum.16.d:0 "Nikolai Ryzhkov presents the programme for a transition to a regulated market economy: prices freed in stages, starting with the price of bread tripling. After his television address, grain, flour and salt vanished from the shops.\n\nStanislav Shatalin and Grigory Yavlinsky are drafting a faster plan. Gosplan warns that a market without goods will bring nothing but higher prices."
 totu_plenum.16.a:0 "Ryzhkov's regulated market"
 totu_plenum.16.b:0 "A fast transition on the Shatalin plan"
 totu_plenum.16.c:0 "Defend the planned economy"

 totu_plenum.17.t:0 "The Plenum: Party Property"
 totu_plenum.17.d:0 "Deputies of the Soviets demand the party's district committee buildings, printing houses and sanatoriums. Nikolai Kruchina, head of the Central Committee's administrative department, reports that dues are falling with membership.\n\nHis department proposes putting the money into joint ventures and commercial banks while the party still has money. The Central Auditing Commission asks for an audit first."
 totu_plenum.17.a:0 "Hand the buildings to the Soviets"
 totu_plenum.17.b:0 "Put the funds into business"
 totu_plenum.17.c:0 "Audit first"

 totu_plenum.18.t:0 "The Plenum: Andreyeva's Appeal"
 totu_plenum.18.d:0 "Nina Andreyeva, author of the article 'I Cannot Forsake My Principles', now leads the Edinstvo society. Her supporters hand the presidium an appeal with thousands of signatures: declare the course towards 'bourgeois degeneration' a mistake and return to Leninist norms.\n\nIn 1988 Pravda condemned her article on behalf of the Politburo. Now the appeal has the support of some delegates from the army and the defence plants."
 totu_plenum.18.a:0 "Condemn 'neo-Stalinism'"
 totu_plenum.18.b:0 "Recognise their right to this position"
 totu_plenum.18.c:0 "Leave the appeal unanswered"

 # Results
 totu_plenum.31.t:0 "Plenum Result: the Democratic Platform Wins"
 totu_plenum.31.d:0 "The final document is adopted on the Democratic Platform's draft. The CPSU is declared a parliamentary party: democratic centralism is abolished, factions are allowed, and party property passes to the state.\n\nThe winners want to go further: market reform, free elections at every level, and an alliance with the democratic movement instead of a fight against it. The apparatus obeys, but many secretaries resign."
 totu_plenum.31.a:0 "Towards the market and many parties"
 totu_plenum.31.b:0 "First keep the party from falling apart"

 totu_plenum.32.t:0 "Plenum Result: the Centre Holds"
 totu_plenum.32.d:0 "The majority votes for Gorbachev's platform. The party gives up its monopoly but keeps a single set of rules, and moves the economy towards a market under state control. In substance this is a social democratic course, though Gorbachev himself does not use the word yet.\n\nThe radicals call the result a half-measure, the conservatives a capitulation. But the party has stayed whole."
 totu_plenum.32.a:0 "A humane, democratic socialism"
 totu_plenum.32.b:0 "Rely on the presidency, not the Central Committee"

 totu_plenum.33.t:0 "Plenum Result: the Conservatives Win"
 totu_plenum.33.d:0 "The majority follows Ligachev and Polozkov. The plenum confirms the leading role of the party wherever it can still be held, and demands order in the republics and on the streets.\n\nThe conservatives do not reject the market, but want it under state control. They want a great power with one army and one rouble. Gorbachev remains General Secretary, but he no longer sets the course."
 totu_plenum.33.a:0 "Order and a great power"
 totu_plenum.33.b:0 "No quarrel with the reformers yet"

 totu_plenum.34.t:0 "Plenum Result: the Orthodox Wing Wins"
 totu_plenum.34.d:0 "To the Politburo's surprise, the majority backs Edinstvo and the deputies of the Soyuz group. The plenum condemns 'the revision of Marxism', and demands that the party regain control of the press and restore the Leninist norms of party life.\n\nThe winners want the 'degenerates' purged from the apparatus and an end to market experiments. They have a majority, but no experience of government."
 totu_plenum.34.a:0 "Back to the Leninist norms"
 totu_plenum.34.b:0 "Do not start with purges"

 # News
 totu_plenum.41.t:0 "The CPSU Becomes a Parliamentary Party"
 totu_plenum.41.d:0 "The Central Committee plenum in Moscow has ended in victory for the Democratic Platform. The party that ran the Soviet Union for seven decades has given up its monopoly on power, allowed factions and promised market reform.\n\nWestern diplomats admit they can no longer predict Moscow's next step."
 totu_plenum.41.a:0 "Moscow is changing faster than expected"
 totu_plenum.41.b:0 "There is no way back"

 totu_plenum.42.t:0 "Gorbachev Holds the Party Together"
 totu_plenum.42.d:0 "The Central Committee plenum has ended in victory for the General Secretary's supporters. The party gives up its monopoly on power but stays united and keeps its socialist course.\n\nThe West greets the result with relief: the man across the table is the same. The Soviet press calls it a compromise that suits neither the radicals nor the conservatives."
 totu_plenum.42.a:0 "Perestroika goes on"
 totu_plenum.42.b:0 "The party is still one party"

 totu_plenum.43.t:0 "Hardliners Prevail in the CPSU"
 totu_plenum.43.d:0 "The Central Committee plenum has ended in victory for the conservatives led by Yegor Ligachev. The party has confirmed its leading role and demanded order in the republics.\n\nNATO expects the disarmament agreements to be revisited. Leaders of the national movements in the republics brace for pressure from Moscow."
 totu_plenum.43.a:0 "Moscow is closing again"
 totu_plenum.43.b:0 "Order will be restored"

 totu_plenum.44.t:0 "The Orthodox Wing Takes the Central Committee"
 totu_plenum.44.d:0 "The Central Committee plenum has unexpectedly ended in victory for the orthodox wing. The new majority has condemned 'the revision of Marxism' and demands control over the press and an end to market experiments.\n\nWestern capitals speak of the end of perestroika. Soviet newspapers print the plenum's decisions without comment."
 totu_plenum.44.a:0 "Is perestroika over?"
 totu_plenum.44.b:0 "Back to the Leninist norms"

 # Crises
 totu_plenum.50.t:0 "The Democratic Platform Walks Out"
 totu_plenum.50.d:0 "The leaders of the Democratic Platform have declared that they no longer see any point in staying in the CPSU. They call on their supporters to hand in their party cards and found a party of their own. Party committees at factories and institutes in Moscow, Leningrad and Sverdlovsk report mass resignations.\n\nThe democrats will take some of the most active communists with them, but also some of the tension."
 totu_plenum.50.a:0 "Let them go"
 totu_plenum.50.b:0 "Persuade them to stay"
 totu_plenum.50.c:0 "Expel the ringleaders"

 totu_plenum.51.t:0 "An Orthodox Plot"
 totu_plenum.51.d:0 "A group of obkom secretaries, deputies of the Soyuz group and the Edinstvo society are collecting signatures to call an emergency plenum and replace the leadership. Their letters speak of 'a state of emergency in certain regions'.\n\nThe KGB reports that the threads lead into the army and the defence plants. The KGB chairman advises against making a fuss."
 totu_plenum.51.a:0 "Expose them before the Central Committee"
 totu_plenum.51.b:0 "Make concessions"
 totu_plenum.51.c:0 "Leave it to the KGB"

 totu_plenum.52.t:0 "The Party Splits"
 totu_plenum.52.d:0 "The party no longer speaks with one voice. Republican parties ignore Central Committee decisions, and in the big cities two or three parallel organisations operate, each calling itself the real CPSU.\n\nThe secretaries demand an extraordinary congress. Radicals on both sides propose a formal separation, with property divided by the number of supporters."
 totu_plenum.52.a:0 "Accept the split and divide the party"
 totu_plenum.52.b:0 "Keep the party united at any cost"
 totu_plenum.52.c:0 "Call an extraordinary congress"

 totu_plenum.53.t:0 "Crisis in the Central Committee"
 totu_plenum.53.d:0 "The ruling group in the Central Committee has lost its majority. Its decisions pass with difficulty or not at all, and its rivals say openly that the party's course must change.\n\nThe General Secretary can give up some posts, lean on those who stayed loyal, or reshuffle the Politburo and risk losing both."
 totu_plenum.53.a:0 "Give posts to the new majority"
 totu_plenum.53.b:0 "Lean on the loyal"
 totu_plenum.53.c:0 "Reshuffle the Politburo"
