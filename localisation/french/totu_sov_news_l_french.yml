l_french:
 # GENERATED by tools/build_focus_tree.py: English copy of localisation/english/totu_sov_news_l_english.yml.
 # World news about the USSR (events/TOTU_SOV_news.txt): option .a is shown to other countries, .b to the USSR.

 totu_sov_news.1.t:0 "The CPSU Gives Up Its Monopoly on Power"
 totu_sov_news.1.d:0 "The Congress of People's Deputies of the USSR has amended Article 6 of the Constitution. The Communist Party is no longer “the leading and guiding force” of Soviet society, and other parties may now compete for power.\n\nWestern capitals speak of the end of a one-party system that lasted more than seventy years."
 totu_sov_news.1.a:0 "The end of the one-party state"
 totu_sov_news.1.b:0 "Let the other parties try"

 totu_sov_news.2.t:0 "Gorbachev Becomes President of the USSR"
 totu_sov_news.2.d:0 "The Congress of People's Deputies has elected Mikhail Gorbachev President of the USSR, 1,329 votes to 495. Power is moving from the Politburo to a state office.\n\nThe West expects a president to be able to do more than a general secretary. The republics fear the same."
 totu_sov_news.2.a:0 "Moscow has a new head of state"
 totu_sov_news.2.b:0 "Power passes to the state"

 totu_sov_news.3.t:0 "Bloodshed at the Vilnius TV Tower"
 totu_sov_news.3.d:0 "On the night of 13 January Soviet troops and the Alpha group took the television tower in Vilnius. Fourteen people were killed and hundreds injured; within a day footage of the assault had been shown around the world.\n\nWestern governments condemn the use of force and put the aid promised to Moscow on hold."
 totu_sov_news.3.a:0 "Tanks against unarmed people"
 totu_sov_news.3.b:0 "Order has been restored"

 totu_sov_news.4.t:0 "The Soviet Union Votes to Keep the Union"
 totu_sov_news.4.d:0 "In the first Union-wide referendum in Soviet history, 76.4% of voters backed preserving the Union as a renewed federation. Six republics, from Lithuania to Georgia, boycotted the vote.\n\nMoscow calls the result a mandate. The republican leaders argue over what it is a mandate for."
 totu_sov_news.4.a:0 "A majority for the Union, but not everyone"
 totu_sov_news.4.b:0 "The people said yes"

 totu_sov_news.5.t:0 "Gorbachev Removed, Emergency Committee in Power"
 totu_sov_news.5.d:0 "Soviet television has announced that Mikhail Gorbachev is unable to carry out his duties as president “for health reasons”. His powers have been taken over by Gennady Yanayev and the State Committee on the State of Emergency.\n\nUnofficial reports place Gorbachev at his dacha in Foros. Western governments demand the return of the lawful president and suspend contacts with Moscow."
 totu_sov_news.5.a:0 "A coup in Moscow"
 totu_sov_news.5.b:0 "A necessary measure"

 totu_sov_news.6.t:0 "Union of Sovereign States Treaty Signed"
 totu_sov_news.6.d:0 "The republican leaders have signed a new union treaty in Moscow. The USSR becomes the Union of Sovereign States: the republics run their own economies, while the centre keeps the army, the currency and foreign policy.\n\nThe Baltic republics, Georgia, Armenia and Moldova are not part of the treaty. The West notes with relief that the nuclear arsenal still has a single owner."
 totu_sov_news.6.a:0 "The Union survives, but changed"
 totu_sov_news.6.b:0 "A new Union"

 totu_sov_news.7.t:0 "State of Emergency in the USSR"
 totu_sov_news.7.d:0 "A state of emergency has been declared in the Soviet Union. Rallies and strikes are banned, opposition parties are suspended, and only nine central newspapers are allowed to print.\n\nArmoured vehicles move through the streets of Moscow. Western governments freeze their aid programmes and recall their ambassadors for consultations."
 totu_sov_news.7.a:0 "Moscow shuts its doors"
 totu_sov_news.7.b:0 "Order comes first"

 totu_sov_news.8.t:0 "Yeltsin Elected to Lead the Russian Parliament"
 totu_sov_news.8.d:0 "On the third ballot Boris Yeltsin has been elected Chairman of the Supreme Soviet of the RSFSR, with 535 votes against the 531 he needed. Gorbachev had spoken against him in person.\n\nThe largest republic of the Union now has a leader who openly argues with the Kremlin. Western observers see him as Gorbachev's main rival."
 totu_sov_news.8.a:0 "Gorbachev has a rival"
 totu_sov_news.8.b:0 "Russia has chosen Yeltsin"
