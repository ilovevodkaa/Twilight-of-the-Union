l_russian:
 # GENERATED by tools/build_focus_tree.py from tools/src/focus/SOV.json.
 TOTU_SOV_focus:0 "Национальные фокусы СССР"
 SOV_central_committee_plenum:0 "Созвать пленум ЦК"
 SOV_central_committee_plenum_desc:0 "Февраль 1990-го: пленум ЦК впервые открыто спорит о будущем партии. Решать, куда идёт страна, придётся уже в этом году."
 SOV_abolish_article_six:0 "Отменить монополию КПСС"
 SOV_abolish_article_six_desc:0 "Шестая статья Конституции о «руководящей и направляющей роли» партии больше не держится. Отменить её — значит признать, что КПСС одна из многих."
 SOV_renew_the_party:0 "«Обновить» партию"
 SOV_renew_the_party_desc:0 "Партия остаётся единственной опорой государства, но её обещают очистить, омолодить и приблизить к людям. Слово «обновить» каждый понимает по-своему."
 SOV_third_congress_of_deputies:0 "III Съезд народных депутатов"
 SOV_third_congress_of_deputies_desc:0 "Март 1990-го: съезд в прямом эфире переписывает Конституцию. Отсюда рукой подать до президентского поста и до новых партий."
 SOV_28th_party_congress:0 "XXVIII съезд КПСС"
 SOV_28th_party_congress_desc:0 "Последний съезд партии. Ельцин демонстративно кладёт партбилет на стол и уходит из зала. Те, кто остался, хотят порядка."
 SOV_yeltsin_heads_russia:0 "Ельцин во главе России"
 SOV_yeltsin_heads_russia_desc:0 "Май 1990-го: с третьей попытки Ельцин избран Председателем Верховного Совета РСФСР. У Горбачёва появился соперник с собственной республикой."
 SOV_constitutional_supervision:0 "Конституционный надзор"
 SOV_constitutional_supervision_desc:0 "Впервые в СССР появляется орган, который может признать закон неконституционным. Первые его решения бьют по указам самого президента."
 SOV_multiparty_system:0 "Многопартийность"
 SOV_multiparty_system_desc:0 "Закон об общественных объединениях разрешает новые партии. Аппарат теряет монополию на власть, а вместе с ней и привычную неповоротливость."
 SOV_press_law:0 "Закон о печати"
 SOV_press_law_desc:0 "Июнь 1990-го: цензура отменена законом. Газетам больше не нужна виза Главлита на каждый номер."
 SOV_party_discipline:0 "Партийная дисциплина"
 SOV_party_discipline_desc:0 "Колеблющихся исключают, обкомы получают чёткие инструкции. Партия снова говорит одним голосом, пусть и тише, чем раньше."
 SOV_deal_with_yeltsin:0 "Договориться с Ельциным"
 SOV_deal_with_yeltsin_desc:0 "Россия провозгласила суверенитет, и её парламент возглавил Ельцин. Можно признать его силу и сделать союзником, пока он не стал врагом."
 SOV_stop_yeltsin:0 "Остановить Ельцина"
 SOV_stop_yeltsin_desc:0 "Декларация о суверенитете РСФСР бьёт по самому центру. Союзные органы отказываются её признавать и начинают «войну законов»."
 SOV_left_democratic_socialism:0 "Левый курс: социал-демократия"
 SOV_left_democratic_socialism_desc:0 "Перестройка — не отказ от социализма, а его очищение. Яковлев и Шеварднадзе предлагают путь европейских социал-демократов: рынок под контролем государства и сильные социальные гарантии."
 SOV_right_market_democracy:0 "Правый курс: рыночная демократия"
 SOV_right_market_democracy_desc:0 "Экономисты говорят прямо: план не спасти. Нужны частная собственность, свободные цены и открытая экономика, а политическая свобода без экономической не продержится."
 SOV_gorbachev_presidency:0 "Президентство Горбачёва"
 SOV_gorbachev_presidency_desc:0 "Генеральный секретарь становится Президентом СССР. Власть переходит от партийного аппарата к государственным институтам."
 SOV_freedom_of_conscience:0 "Свобода совести"
 SOV_freedom_of_conscience_desc:0 "Октябрь 1990-го: закон о свободе совести. Храмы возвращают верующим, пасхальную службу показывают по центральному телевидению."
 SOV_state_emergency_committee:0 "Комитет по ЧП"
 SOV_state_emergency_committee_desc:0 "Крючков, Язов, Павлов и Бакланов негласно готовят план на случай, если страна начнёт разваливаться. Пока это только бумаги в сейфе."
 SOV_left_leninist_norms:0 "Левый курс: ленинские нормы"
 SOV_left_leninist_norms_desc:0 "Причина кризиса в том, что партия отошла от Ленина. Вернуть дисциплину, плановое хозяйство и классовый подход."
 SOV_right_great_power:0 "Правый курс: великая держава"
 SOV_right_great_power_desc:0 "Союз не идеология, а тысячелетняя держава. Армия, традиция и государство важнее партийных догм."
 SOV_rsfsr_sovereignty_in_union:0 "Суверенитет РСФСР в составе Союза"
 SOV_rsfsr_sovereignty_in_union_desc:0 "Москва признаёт Декларацию о суверенитете России, но в рамках Союза: российские законы стоят выше союзных только там, где об этом договорились."
 SOV_war_of_laws:0 "Война законов"
 SOV_war_of_laws_desc:0 "Союзные и российские законы противоречат друг другу, и каждый парламент объявляет свои главными. Предприятия не знают, кому платить налоги."
 SOV_democratic_reform_movement:0 "Движение реформ"
 SOV_democratic_reform_movement_desc:0 "Июль 1991-го: Яковлев, Шеварднадзе, Попов, Собчак и Вольский объявляют о движении, которое должно стать новой партией реформаторов."
 SOV_social_guarantees:0 "Социальные гарантии"
 SOV_social_guarantees_desc:0 "Индексация пенсий и зарплат, пособия по безработице. Реформа не должна бить по тем, кому и так тяжело."
 SOV_law_on_property:0 "Закон о собственности"
 SOV_law_on_property_desc:0 "Март 1990-го: закон впервые признаёт за гражданами право собственности на средства производства. Кооператоры, легальные с 1988 года, теперь могут владеть своими цехами."
 SOV_500_days_program:0 "Программа «500 дней»"
 SOV_500_days_program_desc:0 "Шаталин и Явлинский предлагают за 500 дней провести приватизацию и освободить цены. Программу готов поддержать даже Ельцин, против — правительство Рыжкова."
 SOV_vice_president:0 "Вице-президент"
 SOV_vice_president_desc:0 "Президенту нужен заместитель. Кандидатуру Горбачёва съезд утвердит не с первой попытки."
 SOV_presidential_council:0 "Президентский совет"
 SOV_presidential_council_desc:0 "Яковлев, Шеварднадзе, Бакатин, Примаков: при президенте собирается совет из реформаторов и технократов."
 SOV_federation_council:0 "Совет Федерации"
 SOV_federation_council_desc:0 "Руководители республик получают место за столом в центре. Это первый шаг от приказов к переговорам."
 SOV_union_referendum:0 "Референдум о сохранении Союза"
 SOV_union_referendum_desc:0 "17 марта 1991-го: «Считаете ли Вы необходимым сохранение Союза Советских Социалистических Республик как обновлённой федерации равноправных суверенных республик…?» Шесть республик объявляют бойкот."
 SOV_consolidate_security_services:0 "Консолидация силовиков"
 SOV_consolidate_security_services_desc:0 "Армия, КГБ и МВД договариваются действовать вместе. Министр обороны, председатель КГБ и министр внутренних дел теперь одна команда."
 SOV_communist_party_of_rsfsr:0 "Компартия РСФСР"
 SOV_communist_party_of_rsfsr_desc:0 "Июнь 1990-го: создана Компартия РСФСР во главе с Полозковым. Консерваторы получают свою партийную базу в самой большой республике."
 SOV_andreeva_unity:0 "«Единство» Нины Андреевой"
 SOV_andreeva_unity_desc:0 "Автор письма «Не могу поступаться принципами» собирает общество «Единство — за ленинизм и коммунистические идеалы». Ортодоксы больше не стесняются."
 SOV_soyuz_deputy_group:0 "Депутатская группа «Союз»"
 SOV_soyuz_deputy_group_desc:0 "Полковники Алкснис и Петрушенко собирают в парламенте фракцию тех, кто готов защищать Союз любой ценой. «Чёрные полковники» становятся голосом армии."
 SOV_army_and_church:0 "Армия и Церковь"
 SOV_army_and_church_desc:0 "Генералы и иерархи Русской православной церкви впервые выходят на одну трибуну. Державники ищут объединяющую идею вместо коммунизма."
 SOV_gorbachev_yeltsin_tandem:0 "Тандем Горбачёв–Ельцин"
 SOV_gorbachev_yeltsin_tandem_desc:0 "Президент СССР и председатель российского парламента выступают вместе. Впервые за долгое время у реформ одно лицо, а не два."
 SOV_bet_on_autonomies:0 "Ставка на автономии"
 SOV_bet_on_autonomies_desc:0 "Апрель 1990-го: закон уравнивает автономные республики с союзными. Татарстан, Башкирия и Якутия получают повод спорить с Ельциным, а не с Горбачёвым."
 SOV_social_democratic_party:0 "Социал-демократическая партия"
 SOV_social_democratic_party_desc:0 "КПСС раскалывается: реформаторское крыло уходит с частью собственности и избирателей. В стране появляется сильная левоцентристская партия."
 SOV_free_prices:0 "Отпустить цены"
 SOV_free_prices_desc:0 "Цены освобождаются. Полки наполняются, но рубль обесценивается быстрее, чем растут зарплаты."
 SOV_new_union_treaty_draft:0 "Разработка нового союзного договора"
 SOV_new_union_treaty_draft_desc:0 "Юристы центра и республик впервые пишут один документ. Вопрос в том, сколько власти останется Москве."
 SOV_remove_gorbachev:0 "Отстранить Горбачёва"
 SOV_remove_gorbachev_desc:0 "Президент слишком много уступает республикам. Его можно оставить на даче в Форосе «по состоянию здоровья»."
 SOV_kgb_budget:0 "Повышение бюджета КГБ"
 SOV_kgb_budget_desc:0 "Комитет получает деньги, людей и технику. Взамен ждут, что он узнает о заговорах республиканских элит раньше, чем они случатся."
 SOV_restore_party_control:0 "Вернуть партийный контроль"
 SOV_restore_party_control_desc:0 "Партком снова решает, кто станет директором завода, а обком — кто возглавит облисполком. Реформы откатываются назад."
 SOV_word_to_the_people:0 "«Слово к народу»"
 SOV_word_to_the_people_desc:0 "Июль 1991-го: Проханов, Распутин, генералы Варенников и Громов публикуют манифест «Случилось огромное, небывалое горе…». Это программа будущей диктатуры."
 SOV_yeltsin_in_union_leadership:0 "Ельцин в союзном руководстве"
 SOV_yeltsin_in_union_leadership_desc:0 "Невозможное становится реальным: Ельцин получает пост в союзном руководстве. Союз сохраняется, но вопрос, кто им на самом деле правит, остаётся открытым."
 SOV_remove_yeltsin:0 "Отставка Ельцина"
 SOV_remove_yeltsin_desc:0 "Март 1991-го: на внеочередном Съезде народных депутатов РСФСР коммунисты пытаются снять Ельцина. В этот раз у них получается."
 SOV_andropov_methods:0 "Вернуть андроповские методы"
 SOV_andropov_methods_desc:0 "Облавы на прогульщиков, показательные дела против торговой мафии, дисциплина на заводах. Как при Андропове, только жёстче."
 SOV_order_in_the_baltics:0 "Навести порядок в Прибалтике"
 SOV_order_in_the_baltics_desc:0 "Январь 1991-го: в Вильнюс и Ригу входят войска и ОМОН. Телебашня, баррикады, погибшие. Москва показывает, что не отпустит республики без боя."
 SOV_novo_ogaryovo_process:0 "Новоогарёвский процесс"
 SOV_novo_ogaryovo_process_desc:0 "Апрель 1991-го: Горбачёв и лидеры девяти республик садятся за стол в подмосковном Ново-Огарёве. «9+1» должно спасти Союз."
 SOV_union_of_sovereign_states:0 "Союз Суверенных Государств"
 SOV_union_of_sovereign_states_desc:0 "Новый договор подписан. СССР становится Союзом Суверенных Государств: республики сами управляют своими делами, Москва отвечает за армию, деньги и внешнюю политику."
 SOV_state_of_emergency:0 "Указ о чрезвычайном положении"
 SOV_state_of_emergency_desc:0 "По телевизору «Лебединое озеро», затем пресс-конференция ГКЧП. В стране вводится чрезвычайное положение, партии и газеты закрываются."
 SOV_close_the_plenum:0 "Закрыть пленум"
 SOV_close_the_plenum_desc:0 "Решение принято. Каким бы оно ни было, страна, которая выйдет из этого зала, уже не будет прежней."
 # national spirits
 TOTU_SOV_sovereign_union:0 "Союз Суверенных Государств"
 TOTU_SOV_sovereign_union_desc:0 "Республики сами управляют своими делами, центр отвечает за армию, деньги и внешнюю политику. Союз держится не на приказах, а на договоре."
 TOTU_SOV_emergency_rule:0 "Режим чрезвычайного положения"
 TOTU_SOV_emergency_rule_desc:0 "Комендантский час, закрытые газеты и танки у Белого дома. Порядок держится на страхе и продержится ровно столько, сколько армия готова стрелять."
 TOTU_SOV_andropov_discipline:0 "Андроповская дисциплина"
 TOTU_SOV_andropov_discipline_desc:0 "Облавы на прогульщиков и показательные дела против торговой мафии. На заводах стало тише, в магазинах лучше не стало."
 TOTU_SOV_democratic_socialism:0 "Демократический социализм"
 TOTU_SOV_democratic_socialism_desc:0 "Рынок под контролем государства, сильные профсоюзы и щедрые социальные гарантии. Стабильно, но дорого."
 TOTU_SOV_market_reforms:0 "Рыночные реформы"
 TOTU_SOV_market_reforms_desc:0 "Цены отпущены, кооперативы растут, директора учатся считать прибыль. Полки наполняются, но зарплат на них не хватает."
 TOTU_SOV_yeltsin_tandem:0 "Тандем с Россией"
 TOTU_SOV_yeltsin_tandem_desc:0 "Союзный центр и российское руководство действуют вместе. Решения принимаются медленнее, зато их никто не саботирует."
 TOTU_SOV_war_of_laws:0 "Война законов"
 TOTU_SOV_war_of_laws_desc:0 "Союзные и российские законы противоречат друг другу. Налоги застревают в республиках, директора выбирают, чей указ выполнять."
 TOTU_SOV_party_control:0 "Партийный контроль"
 TOTU_SOV_party_control_desc:0 "Обкомы снова решают всё: от назначения директора до тиража районной газеты. Порядок вернулся, инициатива пропала."
 TOTU_SOV_great_power_patriotism:0 "Державный патриотизм"
 TOTU_SOV_great_power_patriotism_desc:0 "Красное знамя рядом с имперским орлом: страну объединяют уже не Маркс и Ленин, а армия, вера и память о великой державе."
