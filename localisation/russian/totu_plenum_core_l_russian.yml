l_russian:
 # Пленум ЦК КПСС: категория решений, решения, модификатор, подсказки фокуса
 # (common/decisions/TOTU_plenum_decisions.txt, common/scripted_effects/TOTU_plenum_effects.txt).

 TOTU_plenum_category:0 "Пленум ЦК КПСС"
 TOTU_plenum_category_desc:0 "Центральный комитет решает, куда идёт партия, а партия пока решает, куда идёт страна. Четыре группы спорят за большинство в зале. Чем сильнее крайние, тем радикальнее партия; чем меньше у неё власти, тем быстрее страна уходит из-под её контроля."

 TOTU_party_state:0 "Состояние КПСС"

 TOTU_pl_lean_dem:0 "Опереться на Демплатформу"
 TOTU_pl_lean_dem_desc:0 "Дать трибуну Демократической платформе: Афанасьеву, Шостаковскому, Лысенко. Реформаторы благодарны, аппарат в ярости."
 TOTU_pl_lean_gorb:0 "Опереться на горбачёвцев"
 TOTU_pl_lean_gorb_desc:0 "Собрать центр вокруг генсека: тех, кто готов идти за Горбачёвым, пока он сам знает, куда идёт."
 TOTU_pl_lean_cons:0 "Опереться на консерваторов"
 TOTU_pl_lean_cons_desc:0 "Договориться с Лигачёвым и секретарями обкомов. Они поддержат, но потребуют порядка."
 TOTU_pl_lean_orth:0 "Опереться на ортодоксов"
 TOTU_pl_lean_orth_desc:0 "Протянуть руку «Единству» и депутатам группы «Союз». Их голоса стоят дорого: они хотят назад."
 TOTU_pl_unity_appeal:0 "Призыв к единству"
 TOTU_pl_unity_appeal_desc:0 "Обращение ЦК ко всем коммунистам: споры внутри, решения вместе. Помогает, пока в него верят."
 TOTU_pl_strengthen_apparatus:0 "Укрепить аппарат"
 TOTU_pl_strengthen_apparatus_desc:0 "Вернуть обкомам кадровые решения и контроль за назначениями. Партия крепнет, но и нервничает."
 TOTU_pl_purge:0 "Партийная чистка"
 TOTU_pl_purge_desc:0 "Обмен партбилетов и исключение «колеблющихся». Старое лекарство консерваторов, от которого всем становится хуже, кроме них."
 TOTU_pl_open_tribune:0 "Открытая трибуна"
 TOTU_pl_open_tribune_desc:0 "Пустить в зал телекамеры. Реформаторы выигрывают спор, аппарат теряет хватку, а страна смотрит."

 SOV_central_committee_plenum_select_tt:0 "Начинается подготовка Пленума: §Y3 события§! за время фокуса. Отменить фокус §Rнельзя§!."
 SOV_central_committee_plenum_tt:0 "Пленум будет заседать около §Y200 дней§!. Итоговое голосование откроет ветку той фракции, у которой будет больше всего поддержки (§YПленум ЦК КПСС§! в решениях)."
