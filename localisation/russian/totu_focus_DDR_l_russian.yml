l_russian:
 # GENERATED by tools/build_focus_tree.py from tools/src/focus/DDR.json.
 TOTU_DDR_focus:0 "Национальные фокусы ГДР"
 DDR_modrow_government:0 "Правительство Модрова"
 DDR_modrow_government_desc:0 "13 ноября 1989 года Народная палата сделала премьером Ханса Модрова, дрезденского секретаря с репутацией реформатора. Ему досталась страна, из которой уезжают, и партия, из которой выходят."
 DDR_truth_about_debts:0 "Правда о долгах"
 DDR_truth_about_debts_desc:0 "Отчёт Шюрера, спрятанный в сейфе Политбюро, ложится на стол Народной палаты. Страна живёт в долг у Запада, и чтобы перестать занимать, уровень жизни придётся урезать на четверть."
 DDR_mil_admiral_hoffmann:0 "Адмирал в министерстве"
 DDR_mil_admiral_hoffmann_desc:0 "18 ноября 1989 года министром национальной обороны стал адмирал Теодор Хоффман, командующий Фольксмарине. Его предшественники заседали в Политбюро; ему это не грозит, Политбюро ушло в отставку 3 декабря."
 DDR_round_table_course:0 "Курс Круглого стола"
 DDR_round_table_course_desc:0 "С декабря правительство и оппозиция каждую неделю садятся за один стол: Новый форум, церковь, новые партии. Решения Круглого стола не имеют силы закона, но без него уже ничего не решается."
 DDR_honecker_warrant:0 "Ордер на Хонеккера"
 DDR_honecker_warrant_desc:0 "29 января прокуратура арестовывает Эриха Хонеккера на выходе из больницы «Шарите» и на следующий день отпускает: врачи против. Бывшего хозяина страны приютит в Лобетале пастор Уве Хольмер, чьих детей при Хонеккере не брали в вузы."
 DDR_party_of_democratic_socialism:0 "Партия демократического социализма"
 DDR_party_of_democratic_socialism_desc:0 "4 февраля СЕПГ-ПДС отрезает от своего имени первые четыре буквы. Гизи объясняет, что партия порвала с прошлым, бывшие члены — что прошлое порвало с партией: из двух миллионов в ней осталось меньше миллиона."
 DDR_moscow_visit:0 "Визит в Москву"
 DDR_moscow_visit_desc:0 "30 января Модров летит к Горбачёву и слышит то, чего не ждал: в принципе против объединения немцев в Москве никто не возражает. Кремль больше не держит ГДР, теперь он за неё торгуется."
 DDR_eco_koko_legacy:0 "Наследство КоКо"
 DDR_eco_koko_legacy_desc:0 "3 декабря 1989 года Александр Шальк-Голодковский, глава Коммерческой координации, бежит в Западный Берлин. В его хозяйстве находят торговлю оружием и антиквариатом, тайные счета и склады западных станков, купленных в обход эмбарго для микроэлектроники."
 DDR_eco_cheap_bread:0 "Булочка за пять пфеннигов"
 DDR_eco_cheap_bread_desc:0 "Булочка стоит пять пфеннигов с пятидесятых, квартплата заморожена на уровне 1936 года, а дотации съедают пятую часть бюджета. Правительство решает не трогать цены: хоть что-то в стране должно остаться прежним."
 DDR_eco_price_reform:0 "Цены без дотаций"
 DDR_eco_price_reform_desc:0 "С открытием Стены дешёвые хлеб, мясо и детскую одежду скупают западные берлинцы, и вывоз пришлось запретить. Дотации отменяют, а людям доплачивают деньгами: цены растут, но кошелёк пока держится."
 DDR_joint_ventures:0 "Совместные предприятия"
 DDR_joint_ventures_desc:0 "Постановление 25 января разрешает западному капиталу входить в народные предприятия. Первыми в Восточный Берлин приезжают не инвесторы, а консультанты с калькуляторами."
 DDR_eco_kombinate:0 "Комбинаты без плана"
 DDR_eco_kombinate_desc:0 "Госплан больше не спускает показатели, и генеральные директора комбинатов впервые сами решают, что выпускать и кому продавать. Многие тут же выясняют, что продавать некому."
 DDR_mil_army_without_party:0 "Армия без партии"
 DDR_mil_army_without_party_desc:0 "Парторганизации СЕПГ уходят из казарм, Главное политическое управление распускают. Политработники остаются без партии, но с большим количеством свободного времени."
 DDR_mil_kampfgruppen:0 "Разоружить боевые группы"
 DDR_mil_kampfgruppen_desc:0 "Боевые группы рабочего класса, около ста девяноста тысяч человек с автоматами при заводах и комбинатах, распускаются по решению правительства от 14 декабря. Оружие свозят на склады, бойцы возвращаются к станкам, у которых и так некому стоять."
 DDR_mil_border_troops:0 "Новые переходы"
 DDR_mil_border_troops_desc:0 "Пограничные войска, почти пятьдесят тысяч человек, учатся пропускать, а не задерживать. Каждую неделю на бывшей полосе открывают новый переход, и сапёры режут в заборе проходы для дорог, перерезанных десятилетия назад."
 DDR_mil_pact_loyalty:0 "Верность союзу"
 DDR_mil_pact_loyalty_desc:0 "Правительство заверяет союзников, что ГДР остаётся в Варшавском договоре. ННА — единственная армия блока, целиком переданная Объединённому командованию, и пока это ещё звучит как гарантия, а не как приговор."
 DDR_mil_volksmarine:0 "Фольксмарине"
 DDR_mil_volksmarine_desc:0 "Фольксмарине — три флотилии, четырнадцать тысяч моряков и штаб в Ростоке. Верфь в Вольгасте строит малые противолодочные корабли и для своих, и для Балтийского флота, пока на них есть заказы."
 DDR_mil_mig29:0 "Двадцать четыре МиГа"
 DDR_mil_mig29_desc:0 "С 1988 года 3-я истребительная эскадра в Прешене летает на двадцати четырёх МиГ-29, самых новых самолётах, какие были у ГДР. В штабах НАТО очень хотели бы посмотреть на них поближе."
 DDR_dissolve_stasi:0 "Распустить Штази"
 DDR_dissolve_stasi_desc:0 "Ведомство национальной безопасности, последняя вывеска Штази, закрывается. Гражданские комитеты опечатывают архивы, пока офицеры не успели сжечь всё, и спорят, что делать с досье на шесть миллионов человек."
 DDR_media_law:0 "Постановление о СМИ"
 DDR_media_law_desc:0 "5 февраля Народная палата гарантирует свободу мнений, информации и СМИ, а над телевидением ставит не партию, а Совет по контролю над СМИ. Газеты, вчера печатавшие речи Хонеккера, учатся печатать письма читателей."
 DDR_national_responsibility:0 "Правительство национальной ответственности"
 DDR_national_responsibility_desc:0 "5 февраля восемь министров без портфеля от оппозиции входят в кабинет Модрова. Правительство больше не только партийное, и отвечать теперь будут все."
 DDR_modrow_heads_the_list:0 "Модров во главе списка"
 DDR_modrow_heads_the_list_desc:0 "Самый популярный политик страны соглашается возглавить список ПДС. Премьер правительства национальной ответственности теперь агитирует за одну партию, и оппозиционные министры без портфеля спрашивают, чьё это правительство."
 DDR_modrow_plan:0 "Германия, единое отечество"
 DDR_modrow_plan_desc:0 "1 февраля Модров предлагает свой план: договорное сообщество, конфедерация, затем единое государство, нейтральное. Строка «Германия, единое отечество» из гимна ГДР, который годами пели без слов, снова звучит вслух."
 DDR_eco_intershops:0 "Интершопы и форум-чеки"
 DDR_eco_intershops_desc:0 "В интершопах за валюту продают западный кофе, джинсы и магнитофоны, а граждане ГДР платят форум-чеками, выменянными на марки ФРГ. Сеть забирают у КоКо, и её выручка идёт в бюджет, а не на счета, о которых не знал даже Госплан."
 DDR_eco_currency_union:0 "Валютный союз"
 DDR_eco_currency_union_desc:0 "18 мая подписан Государственный договор, и 1 июля в ГДР приходит западная марка: зарплаты и пенсии меняют один к одному, сбережения сверх лимита — два к одному. Восток за одну ночь получает твёрдую валюту, а его заводы — западные цены на свою продукцию."
 DDR_eco_social_charter:0 "Социальная хартия"
 DDR_eco_social_charter_desc:0 "В марте Круглый стол принял Социальную хартию: право на труд, жильё и пенсию, которое ГДР хочет унести с собой в любую Германию. Правительство СДПГ делает её условием договора с Бонном: зарплаты, пенсии и сбережения до лимита — один к одному."
 DDR_treuhand:0 "Попечительское ведомство"
 DDR_treuhand_desc:0 "1 марта правительство учреждает ведомство, которое должно сберечь народную собственность от распродажи. Через полгода оно станет главным продавцом в стране."
 DDR_eco_trabant:0 "Трабант 1.1"
 DDR_eco_trabant_desc:0 "С мая в Цвиккау собирают «трабант» с четырёхтактным мотором «Фольксвагена», какой «Вартбург» получил ещё в 1988-м. Машины наконец ездят без сизого дыма, но стоят почти как подержанный «Гольф»."
 DDR_eco_volkswagen_mosel:0 "Фольксваген в Мозеле"
 DDR_eco_volkswagen_mosel_desc:0 "«Фольксваген» и IFA создают совместную фирму, в цехах Мозеля под Цвиккау собирают «Поло», а в Айзенахе «Опель» начинает собирать «Вектру». «Трабанту» и «Вартбургу» остаётся доработать до весны."
 DDR_eco_dresden_megabit:0 "Мегабит из Дрездена"
 DDR_eco_dresden_megabit_desc:0 "В сентябре 1988 года Хонеккеру вручили первый мегабитный чип ГДР, обошедшийся в пятьсот с лишним марок при мировой цене в несколько долларов. Дорого, но дрезденский Центр микроэлектроники умеет то, чего не умеет больше никто в Восточном блоке."
 DDR_mil_beelitz_demands:0 "Требования Белица"
 DDR_mil_beelitz_demands_desc:0 "В январе солдаты в Белице отказываются заступать на службу: они хотят ходить в увольнение в гражданском, проводить выходные дома и служить меньше. Из министерства приезжают договариваться, а не наказывать."
 DDR_mil_barracks_order:0 "Порядок в казармах"
 DDR_mil_barracks_order_desc:0 "Зачинщиков отправляют на гауптвахту, увольнения отменяют до особого распоряжения, а вечером об этом рассказывает западное телевидение. Строй держится, но на офицеров теперь смотрит иначе."
 DDR_mil_guard_regiment:0 "Караульный полк"
 DDR_mil_guard_regiment_desc:0 "Караульный полк госбезопасности «Феликс Дзержинский», одиннадцать тысяч человек с бронетранспортёрами, лишается и шефа, и хозяина. Срочники дослуживают на стройках и в больницах, казармы в Адлерсхофе ждут новых жильцов."
 DDR_mil_tear_down_wall:0 "Снос Стены"
 DDR_mil_tear_down_wall_desc:0 "13 июня 1990 года на Бернауэр-штрассе пограничники ГДР официально начинают сносить Стену, которую сами охраняли. Расписанные сегменты уходят с аукциона в Монте-Карло, остальное дробят в щебень для дорог."
 DDR_mil_vienna_talks:0 "Венские переговоры"
 DDR_mil_vienna_talks_desc:0 "В Вене двадцать три страны торгуются о танках, пушках и самолётах от Атлантики до Урала. Делегация ГДР впервые говорит там не только по бумажке из Москвы."
 DDR_mil_wgf_bill:0 "Счёт Западной группе"
 DDR_mil_wgf_bill_desc:0 "Сорок лет ГДР содержит советские войска: земля, казармы, уголь, вагоны и полигоны, которые после учений не узнать. Министерство финансов впервые получает задание всё это посчитать."
 DDR_mil_volksmarine_baltic:0 "Фольксмарине на Балтике"
 DDR_mil_volksmarine_baltic_desc:0 "Флот, тридцать лет готовившийся к десанту на датские острова, переходит на охрану рыболовных зон, поиск старых мин и спасение на море. Корабли те же, только учения теперь заканчиваются в своих водах."
 DDR_mil_migs_for_luftwaffe:0 "МиГи для люфтваффе"
 DDR_mil_migs_for_luftwaffe_desc:0 "Из всей советской техники ННА бундесвер согласен оставить себе только двадцать четыре МиГ-29. Лётчиков из Прешена учат натовским правилам полётов, и в штабах НАТО наконец рассматривают МиГ вблизи."
 DDR_hva_self_dissolution:0 "Самороспуск разведки"
 DDR_hva_self_dissolution_desc:0 "В феврале Круглый стол разрешает Главному управлению разведки, внешней разведке Штази, распустить себя самому. Офицеры обещают уйти тихо и несколько месяцев методично жгут дела своей агентуры на Западе."
 DDR_citizens_committees:0 "Архивы под охраной граждан"
 DDR_citizens_committees_desc:0 "Гражданские комитеты требуют, чтобы ни одна папка не покинула архив, включая папки разведки. Ключи от хранилищ теперь у пасторов, студентов и инженеров, которые дежурят посменно."
 DDR_election_law:0 "Закон о выборах"
 DDR_election_law_desc:0 "20 февраля Народная палата принимает закон о свободных выборах: без процентного барьера, без единого списка, с западными наблюдателями. Круглый стол просит западных политиков не ездить на митинги в ГДР, и они, конечно, едут."
 DDR_unity_without_haste:0 "Единство без спешки"
 DDR_unity_without_haste_desc:0 "На съезде в Лейпциге 22–25 февраля социал-демократы избирают председателем Ибрагима Бёме, а почётным председателем — Вилли Брандта. Их ответ Колю: единству — да, но через новую конституцию, с социальной хартией и без распродажи."
 DDR_bonn_visit:0 "Визит в Бонн"
 DDR_bonn_visit_desc:0 "13 февраля Модров просит у Коля пятнадцать миллиардов марок «солидарного взноса» и уезжает ни с чем. Вместо денег Бонн предлагает другое: западную марку для всех, но на западных условиях."
 DDR_eco_convertible_mark:0 "Конвертируемая марка"
 DDR_eco_convertible_mark_desc:0 "Криста Луфт рассчитывала прийти к обратимой марке за несколько лет, правительство ПДС проходит этот путь за один. Резервы КоКо и выручка интершопов уходят в стабилизационный фонд, и марку ГДР пускают в свободный обмен, как в январе Польша пустила злотый."
 DDR_eco_unity_fund:0 "Фонд германского единства"
 DDR_eco_unity_fund_desc:0 "16 мая Бонн и земли учредили фонд в 115 миллиардов марок, чтобы четыре с половиной года закрывать дыры бюджета ГДР. На западные деньги восток чинит дороги, тянет телефонные линии и строит очистные сооружения."
 DDR_eco_privatisation_law:0 "Закон о приватизации"
 DDR_eco_privatisation_law_desc:0 "17 июня Народная палата принимает закон о Попечительском ведомстве: восемь тысяч народных предприятий должны найти частных владельцев. «Быстро приватизировать, решительно санировать, осторожно закрывать», — сформулирует его будущий глава Детлев Роведдер."
 DDR_eco_share_certificates:0 "Доли в народной собственности"
 DDR_eco_share_certificates_desc:0 "Ещё в феврале Вольфганг Ульман из «Демократии сейчас» предлагал Круглому столу раздать народные предприятия гражданам в долях. Теперь сертификаты печатают: у комбинатов шестнадцать миллионов совладельцев и ни одного покупателя со стороны."
 DDR_eco_pollution_data:0 "Данные о загрязнении"
 DDR_eco_pollution_data_desc:0 "С 1982 года сведения о состоянии природы в ГДР были государственной тайной. Весной 1990-го их публикуют: Биттерфельд и Лойна — самые грязные места Европы, а урановые отвалы у Роннебурга и Ауэ меряют дозиметрами."
 DDR_eco_carl_zeiss_jena:0 "Карл Цейс Йена"
 DDR_eco_carl_zeiss_jena_desc:0 "Йенские оптики делали установки фотолитографии для мегабитного чипа, проекторы для планетариев всего мира и прицелы для армии. Сорок лет в Оберкохене работает западный «Цейс» с тем же именем, и в 1990-м два концерна садятся за один стол уже не ради спора о названии."
 DDR_mil_civil_service:0 "Гражданская служба"
 DDR_mil_civil_service_desc:0 "Постановление от 20 февраля 1990 года: кто не хочет брать в руки оружие, служит в больнице или доме престарелых. Стройсолдаты, с 1964 года копавшие траншеи без автоматов, дождались своего закона."
 DDR_mil_military_reform:0 "Военная реформа"
 DDR_mil_military_reform_desc:0 "Правительственная комиссия по военной реформе пишет то, чего у ГДР никогда не было: оборонную доктрину для парламента, а не для Политбюро. Первым пунктом срок службы сокращают с восемнадцати месяцев до двенадцати."
 DDR_mil_soldiers_in_factories:0 "Солдаты на заводах"
 DDR_mil_soldiers_in_factories_desc:0 "Из страны уезжают по две тысячи человек в день, и дыры затыкает армия: вслед за срочниками бывшего караульного полка солдаты ННА разгружают вагоны, кочегарят в котельных и работают санитарами в берлинских больницах. Многие называют это самой полезной службой за весь срок."
 DDR_mil_defensive_sufficiency:0 "Оборонительная достаточность"
 DDR_mil_defensive_sufficiency_desc:0 "Доктрина Варшавского договора 1987 года наконец доходит до полков: шесть танковых полков ННА распустили ещё в 1989-м, учения переписывают под оборону. Генштаб впервые считает, сколько армии стране нужно, а не сколько велено."
 DDR_mil_wgf_withdrawal:0 "Договор о выводе войск"
 DDR_mil_wgf_withdrawal_desc:0 "Западная группа уходит домой: полмиллиона человек вместе с семьями, четыре тысячи танков и бельевые верёвки во дворах гарнизонов. Договор даёт на вывод четыре года, но больше всего эшелонов уйдёт в первые два, а кто оплатит дорогу и квартиры для офицеров, спорят до последней строки."
 DDR_mil_conversion:0 "Мечи на орала"
 DDR_mil_conversion_desc:0 "Дрезденская авиаверфь, чинившая военные самолёты, ищет гражданские заказы, а верфь в Вольгасте — заказы на паромы. Значок «Мечи на орала», который в 1982 году полиция срезала с курток, становится промышленной политикой."
 DDR_mil_arms_sales:0 "Распродажа арсеналов"
 DDR_mil_arms_sales_desc:0 "Внешнеторговая фирма ITA, продававшая оружие дружественным режимам за валюту, получает новый каталог: излишки самой ННА. Покупатели спрашивают про МиГи, министерство предлагает сапоги."
 DDR_for_our_country:0 "За нашу страну"
 DDR_for_our_country_desc:0 "Воззвание Кристы Вольф и Стефана Гейма: ещё есть шанс построить социалистическую альтернативу ФРГ. Его подписали больше миллиона человек, и Эгон Кренц тоже, отчего многие подписанты захотели вычеркнуть свои имена."
 DDR_accept_currency_union:0 "Принять валютный союз"
 DDR_accept_currency_union_desc:0 "Коль обещает восточным немцам западную марку, а демонстранты в Лейпциге отвечают по-своему: «Придёт марка — останемся, не придёт — пойдём к ней». Выборы 18 марта станут референдумом о марке."
 DDR_eco_koko_accounts:0 "Счета КоКо — в бюджет"
 DDR_eco_koko_accounts_desc:0 "Комиссия Народной палаты разбирает хозяйство Шалька, а западногерманские ревизоры помогают искать его счета. Фирмы КоКо передают министерству финансов, и найденные деньги впервые идут в бюджет, о котором знает парламент."
 DDR_eco_unemployment_insurance:0 "Страхование от безработицы"
 DDR_eco_unemployment_insurance_desc:0 "Сорок лет безработицы в ГДР официально не было; в феврале правительство Модрова ввело первые пособия, летом открываются биржи труда. На заводах появляется Kurzarbeit Null, работа на нуле: рабочее место за тобой, но работы нет."
 DDR_eco_property_question:0 "Имущественный вопрос"
 DDR_eco_property_question_desc:0 "Кому принадлежит дом на конфискованной земле: тем, кто в нём живёт, или наследникам уехавших на Запад? Бонн отвечает «прежним владельцам», кроме земли земельной реформы 1945–1949 годов, ПДС — «жильцам»."
 DDR_eco_eko_hot_mill:0 "Горячий прокат для ЭКО"
 DDR_eco_eko_hot_mill_desc:0 "Комбинат в Айзенхюттенштадте плавит советскую руду и катает тонкий лист, а горячий прокат возит со стороны: своего стана ему так и не построили. Без него ЭКО не спасти и не продать."
 DDR_eco_warnow_yards:0 "Верфи Варнова"
 DDR_eco_warnow_yards_desc:0 "Варновская верфь в Варнемюнде и её соседи в Ростоке, Висмаре и Штральзунде строят контейнеровозы и траулеры, больше всего для Советского Союза. Пока Москва платит переводными рублями, заказов хватает на годы вперёд."
 DDR_eco_shut_bitterfeld:0 "Закрыть старый Биттерфельд"
 DDR_eco_shut_bitterfeld_desc:0 "Цеха, где с довоенных времён делают хлор и карбид, останавливают, а Серебряное озеро с ядовитой жижей огораживают. Биттерфельд теряет тысячи рабочих мест и впервые за десятилетия видит над собой небо."
 DDR_eco_leuna_buna:0 "Лойна и Буна работают"
 DDR_eco_leuna_buna_desc:0 "Лойна перерабатывает советскую нефть из «Дружбы», Буна делает каучук из бурого угля и карбида, и закрыть их значит оставить без работы десятки тысяч человек. Заводы чинят на ходу."
 DDR_mil_new_oath:0 "Новая присяга"
 DDR_mil_new_oath_desc:0 "20 июля 1990 года, в годовщину покушения на Гитлера, солдаты ННА присягают заново: не рабоче-крестьянскому правительству и не братству с Советской армией, а республике, её народу и закону."
 DDR_mil_disarmament_ministry:0 "Министерство разоружения"
 DDR_mil_disarmament_ministry_desc:0 "В апреле 1990 года министром в коалиционном правительстве становится Райнер Эппельман, пастор Самаритянской церкви, в 1966-м отсидевший за отказ принести присягу. Первым делом он переименовывает министерство: сначала разоружение, потом оборона."
 DDR_mil_call_from_wuensdorf:0 "Звонок из Вюнсдорфа"
 DDR_mil_call_from_wuensdorf_desc:0 "В Москве взяли верх сторонники жёсткой линии, и из Вюнсдорфа, штаба Западной группы, в Штраусберг звонят с просьбой согласовать «меры по поддержанию порядка». Пока просят вежливо."
 DDR_mil_neutral_army:0 "Армия нейтральной ГДР"
 DDR_mil_neutral_army_desc:0 "ПДС берёт у плана Модрова главное: Германия вне блоков, а пока — ГДР, которая никому не угрожает. ННА становится армией территориальной обороны, а Варшавский договор — договором, из которого выходят по правилам."
 DDR_mil_leave_unified_command:0 "Выход из Объединённого командования"
 DDR_mil_leave_unified_command_desc:0 "Офицеры связи ННА возвращаются из штаба Объединённых вооружённых сил в Москве, дежурные силы ПВО больше не докладывают на общий командный пункт, а планы с красными стрелками на запад сдают в архив. Протокол о членстве в договоре пусть подписывают политики; армия из блока уже ушла."
 DDR_boehme_cabinet:0 "Кабинет Бёме"
 DDR_boehme_cabinet_desc:0 "Зимние опросы не ошиблись: социал-демократы побеждают и собирают коалицию с «Союзом 90» и либералами. Ибрагим Бёме обещает объединение шаг за шагом и ни одного шага без социальной защиты."
 DDR_modrow_mandate:0 "Мандат Модрова"
 DDR_modrow_mandate_desc:0 "Модров остаётся премьером, теперь уже избранным. ПДС правит с бывшими блоковыми партиями, на улицах снова скандируют «Мы один народ», а Бонн откладывает переговоры до лучших времён."
 DDR_de_maiziere_cabinet:0 "Кабинет де Мезьера"
 DDR_de_maiziere_cabinet_desc:0 "12 апреля Народная палата избирает премьером Лотара де Мезьера. Коалиция ХДС, ДСС, «Демократического прорыва», социал-демократов и либералов набирает больше двух третей голосов: достаточно, чтобы менять конституцию, и, как выяснится, чтобы упразднить государство."
 DDR_eco_socialist_market:0 "Социалистическая рыночная экономика"
 DDR_eco_socialist_market_desc:0 "Комбинаты стали акционерными обществами, их акции у граждан и государства, цены свободны, а марку ГДР меняют на доллары в любом банке. Модров называет это социализмом, западные газеты — венгерской моделью."
 DDR_eco_social_market:0 "Социальная рыночная экономика"
 DDR_eco_social_market_desc:0 "Государственный договор называет её общим строем обеих Германий. Первая зима с маркой позади: комбинаты распались на сотни фирм, очереди сменились ценами, а работа на нуле — переобучением."
 DDR_eco_lpg_reform:0 "Кооперативы на рынке"
 DDR_eco_lpg_reform_desc:0 "Закон 29 июня разрешает членам сельхозкооперативов забрать свою землю и скот. Хозяйствам, которые сорок лет сдавали молоко по плану, теперь надо продавать его в магазины, где уже стоит западное."
 DDR_eco_comecon_dollars:0 "СЭВ переходит на доллары"
 DDR_eco_comecon_dollars_desc:0 "В январе 1990-го сессия СЭВ в Софии решила с 1991 года торговать по мировым ценам и в свободной валюте. Переводный рубль умирает, а с ним заказы, на которых держались верфи, «Роботрон» и ЭКО."
 DDR_eco_schwarze_pumpe:0 "Шварце Пумпе"
 DDR_eco_schwarze_pumpe_desc:0 "ГДР добывает триста миллионов тонн бурого угля в год, больше всех в мире, и Шварце Пумпе делает из него брикеты, кокс и газ для половины страны. Комбинат не закрывают, а ставят фильтры: без угля в Лаузице не будет ни света, ни тепла."
 DDR_eco_close_wismut:0 "Закрыть шахты «Висмута»"
 DDR_eco_close_wismut_desc:0 "Советско-германское АО «Висмут» сорок лет добывало уран для советских бомб и реакторов. Добычу решают прекратить к концу года: Москве уран уже не так нужен, а отвалы у Роннебурга фонят на всю округу."
 DDR_eco_uranium_for_moscow:0 "Уран для Москвы"
 DDR_eco_uranium_for_moscow_desc:0 "Сорок с лишним тысяч горняков Рудных гор и Тюрингии остаются на работе, и уран по-прежнему уходит на восток. Москва довольна, врачи в Ауэ — нет."
 DDR_mil_bundeswehr_talks:0 "Переговоры с бундесвером"
 DDR_mil_bundeswehr_talks_desc:0 "В конце апреля два немецких министра обороны впервые садятся за один стол. Штольтенберг говорит об одной армии в НАТО, офицеры ННА слушают и обновляют свои автобиографии."
 DDR_mil_two_armies:0 "Две армии в одной стране"
 DDR_mil_two_armies_desc:0 "Эппельман предлагает то, чего в Бонне не хотят слышать: на переходный срок сокращённая ННА остаётся отдельной восточногерманской армией, вне НАТО и рядом с советскими войсками. Офицеры ННА впервые аплодируют своему пастору."
 DDR_mil_nva_on_alert:0 "ННА в боевой готовности"
 DDR_mil_nva_on_alert_desc:0 "Увольнения отменены, танки заправлены, у ННА и Западной группы снова общий штаб. В Бонне откладывают все переговоры, а берлинцы смотрят на казармы так же, как в октябре 1989-го."
 DDR_mil_territorial_defence:0 "Территориальная оборона"
 DDR_mil_territorial_defence_desc:0 "В Штраусберг приглашают швейцарских и австрийских офицеров объяснить, как маленькая нейтральная страна обороняется, никому не угрожая. Винтовок для ополчения на складах хватает: их там больше, чем желающих."
 DDR_round_table_constitution:0 "Конституция Круглого стола"
 DDR_round_table_constitution_desc:0 "4 апреля рабочая группа Круглого стола представляет проект новой конституции ГДР: право на труд и жильё, народные референдумы, гражданские движения как часть государства. Правительство Бёме вносит его в Народную палату как основу для переговоров с Бонном."
 DDR_deputies_check:0 "Проверка депутатов"
 DDR_deputies_check_desc:0 "Народная палата решает проверить всех 400 депутатов по картотекам Штази. Результаты читают за закрытыми дверями, и несколько кресел в зале пустеют без объяснений."
 DDR_municipal_constitution:0 "Коммунальная конституция"
 DDR_municipal_constitution_desc:0 "6 мая ГДР выбирает городские и районные собрания, а те — бургомистров, и 17 мая Народная палата отдаёт общинам их собственные дела. Правительство Бёме обещает присылать из Восточного Берлина деньги, а не указания."
 DDR_democratic_socialism:0 "Демократический социализм"
 DDR_democratic_socialism_desc:0 "Программа Гизи: рынок без распродажи, собственность трудовых коллективов, свободные выборы и никакой руководящей роли. В партии спорят, социализм ли это, на Западе — демократия ли это."
 DDR_sed_property_review:0 "Ревизия имущества СЕПГ"
 DDR_sed_property_review_desc:0 "Независимая комиссия описывает, что СЕПГ нажила за сорок лет: дома отдыха, типографии, гостиницы и счета, о которых не знал даже Гизи. ПДС оставляет себе Дом Карла Либкнехта и отдаёт остальное государству, громко и, как выяснится, не всё."
 DDR_constitutional_principles:0 "Конституционные принципы"
 DDR_constitutional_principles_desc:0 "17 июня Народная палата принимает закон о конституционных принципах: ГДР — свободное, демократическое, федеративное, социальное и экологическое правовое государство. Главное в законе — право передавать суверенитет, и Москва это тоже читает."
 DDR_municipal_elections:0 "Коммунальные выборы"
 DDR_municipal_elections_desc:0 "6 мая ГДР выбирает городские и районные собрания, а те — бургомистров, и 17 мая общины получают право сами решать свои дела. Впервые за сорок лет бургомистр отвечает перед горожанами, а не перед первым секретарём."
 DDR_mil_bundeswehr_command_east:0 "Командование бундесвера «Восток»"
 DDR_mil_bundeswehr_command_east_desc:0 "В Штраусберге, где сидит министерство ННА, готовят штаб генерал-лейтенанта Йорга Шёнбома. В день объединения он примет под команду девяносто тысяч человек и оставит из них немногих."
 DDR_mil_army_of_unity:0 "Армия единства"
 DDR_mil_army_of_unity_desc:0 "Социал-демократы предлагают конфедерации общий Совет безопасности и две урезанные вдвое армии без иностранных войск к концу десятилетия. В Бонне это называют наивным, в Москве — разумным."
 DDR_mil_back_to_barracks:0 "Вернуть ННА в казармы"
 DDR_mil_back_to_barracks_desc:0 "Танки возвращаются в парки, а общий штаб снова становится просто штабом Западной группы. В Вюнсдорфе недовольны, но генералы ННА слишком хорошо помнят октябрь 1989 года."
 DDR_mil_professional_army:0 "Профессиональная армия"
 DDR_mil_professional_army_desc:0 "ПДС обещала отменить призыв. Отменить не выходит, но срочную службу сокращают до полугода, а костяк армии набирают по контракту из уволенных прапорщиков и офицеров. Армия становится меньше, старше и дороже."
 DDR_mil_stationing_treaty:0 "Договор о пребывании войск"
 DDR_mil_stationing_treaty_desc:0 "Соглашение 1957 года о «временном» пребывании советских войск переписывают впервые за тридцать три года: Москва платит за землю и полигоны и согласует манёвры со Штраусбергом, а срок пребывания привязывают к будущему общеевропейскому договору. Временное остаётся постоянным, но теперь за деньги."
 DDR_social_charter:0 "Хартия — условие договора"
 DDR_social_charter_desc:0 "В марте Круглый стол принял социальную хартию: право на труд, жильё, место в детском саду и равную оплату для женщин. Правительство Бёме ставит условие: что бы ни подписали с Бонном, хартия войдёт в договор."
 DDR_confederation:0 "Конфедерация"
 DDR_confederation_desc:0 "Два государства, один парламентский совет и общие комиссии по валюте, транспорту и праву. Бонн называет это лишним этапом, Бёме — способом не потерять по дороге ни одного рабочего места."
 DDR_right_to_ones_file:0 "Право на своё досье"
 DDR_right_to_ones_file_desc:0 "Правительство Бёме проводит закон о досье Штази: архивы остаются на востоке, и каждый, о ком писали, получит право прочесть своё дело. В Бонне советуют запереть архивы надолго, а лучше навсегда."
 DDR_laender_not_districts:0 "Земли вместо округов"
 DDR_laender_not_districts_desc:0 "Социал-демократы тоже хотят вернуть земли, упразднённые в 1952 году, но спорят о границах: Берлин с Бранденбургом или отдельно, Саксония с клочком Силезии или без. Пока спорят, пятнадцать окружных советов ждут, кто будет платить их служащим."
 DDR_treaty_community:0 "Комиссии договорного сообщества"
 DDR_treaty_community_desc:0 "Модров предлагал договорное сообщество ещё в ноябре 1989-го, и даже Коль включил его в свои десять пунктов. Теперь его наполняют делом: общие комиссии по экономике, праву и экологии, согласованные законы и никаких сроков."
 DDR_talks_moratorium:0 "Мораторий на переговоры"
 DDR_talks_moratorium_desc:0 "Правительство объявляет паузу: никаких переговоров об объединении, пока ГДР не наведёт порядок в собственном доме. В Бонне это называют шантажом, на заводах — передышкой."
 DDR_stasi_files_law:0 "Закон о досье Штази"
 DDR_stasi_files_law_desc:0 "24 августа Народная палата решает: досье остаются на востоке, и каждый может прочесть, что о нём писали. Хранителем станет пастор Йоахим Гаук, который знает об этих папках больше, чем хотел бы."
 DDR_accession_at_once:0 "Присоединение немедленно"
 DDR_accession_at_once_desc:0 "17 июня ДСС предлагала присоединиться к ФРГ в тот же день, без договоров и сроков, и предложение отправили в комиссию. Теперь за него голосует большинство, а коалиция теряет социал-демократов и либералов."
 DDR_accession_vote:0 "Решение 23 августа"
 DDR_accession_vote_desc:0 "В ночном заседании Народная палата голосует за присоединение к ФРГ по статье 23 Основного закона: 294 голоса за, 62 против. Гизи с трибуны замечает, что парламент только что упразднил собственное государство, и зал аплодирует."
 DDR_five_laender:0 "Пять земель"
 DDR_five_laender_desc:0 "22 июля Народная палата возрождает земли, упразднённые в 1952 году: Мекленбург-Переднюю Померанию, Бранденбург, Саксонию-Анхальт, Тюрингию и Саксонию. Пятнадцать округов уходят в прошлое, а с ними пятнадцать окружных комитетов партии."
 DDR_mil_nva_transition:0 "Переходный срок для ННА"
 DDR_mil_nva_transition_desc:0 "Бонн соглашается не распускать ННА в день объединения: офицеры и прапорщики ещё два года служат по временным контрактам, а бундесвер тем временем решает, кого оставить. Эппельман называет это победой, Штольтенберг — отсрочкой."
 DDR_neutral_germany:0 "Нейтральная Германия"
 DDR_neutral_germany_desc:0 "Единая Германия вне НАТО и вне Варшавского договора, как предлагали Москва и половина Круглого стола. В Москве довольны, в Вашингтоне и Бонне вспоминают ноту Сталина 1952 года."
 DDR_genscher_formula:0 "Формула Геншера"
 DDR_genscher_formula_desc:0 "31 января в Тутцинге Ханс-Дитрих Геншер предложил: единая Германия остаётся в НАТО, но войска альянса не заходят на восток. Правительство Бёме принимает формулу и заодно просит Бонн оплатить вывод советских войск."
 DDR_confederation_of_equals:0 "Конфедерация на равных"
 DDR_confederation_of_equals_desc:0 "Второй шаг плана Модрова: общий совет двух парламентов, где у ГДР столько же голосов, сколько у вчетверо большей ФРГ. В Бонне подсчитывают, сколько это будет стоить, в Берлине — сколько это будет значить."
 DDR_independent_gdr:0 "Самостоятельная ГДР"
 DDR_independent_gdr_desc:0 "Правительство объявляет: ГДР — не временное государство и не очередь на присоединение. Новый гимн не пишут, старый наконец поют со словами, кроме строки про единое отечество."
 DDR_lean_on_moscow:0 "Опора на Москву"
 DDR_lean_on_moscow_desc:0 "Новые люди в Кремле напоминают, что 380 тысяч советских военных никуда не уехали, и предлагают нефть по старым ценам. ГДР выбирает между помощью и одиночеством, и правительство выбирает помощь."
 DDR_unification_treaty:0 "Делегация Краузе"
 DDR_unification_treaty_desc:0 "С июля делегация Гюнтера Краузе торгуется с Вольфгангом Шойбле о договоре на тысячу страниц: какие законы ФРГ действуют на востоке с первого дня, кто платит пенсии и что будет с абортами. 20 августа из коалиции уходят социал-демократы, 31 августа договор подписан."
 DDR_article_146:0 "Учредительное собрание"
 DDR_article_146_desc:0 "Основной закон ФРГ сам предусматривает свой конец: статья 146 обещает конституцию, которую примет весь немецкий народ. Депутаты обоих парламентов садятся писать её вместе, и западные коллеги быстро выясняют, что восточные читали проект Круглого стола внимательнее, чем Основной закон."
 DDR_neutral_fatherland:0 "Единое нейтральное отечество"
 DDR_neutral_fatherland_desc:0 "Последний шаг плана Модрова: единая Германия вне блоков, без иностранных войск и с конституцией, где осталось место для социальных прав ГДР. Москва хотела этого с 1952 года, Вашингтон столько же лет этого боялся."
 DDR_austrian_option:0 "Австрийский вариант"
 DDR_austrian_option_desc:0 "В 1955 году СССР вывел войска из Австрии в обмен на вечный нейтралитет. Восточный Берлин предлагает Москве ту же сделку: ГДР выходит из Варшавского договора, но не уходит на Запад."
 DDR_border_regime:0 "Пограничный режим"
 DDR_border_regime_desc:0 "Стену не восстанавливают, но на переходах снова требуют визу и справку с места работы. Отъезд на Запад сокращается до ручейка, а западные вечерние новости говорят только об этом."
 DDR_files_to_koblenz:0 "Досье — в Кобленц"
 DDR_files_to_koblenz_desc:0 "По первому тексту договора архивы Штази уезжают под замок в Федеральный архив в Кобленце. Бонн доволен, у бывших узников Штази другое мнение."
 DDR_two_plus_four:0 "Два плюс четыре"
 DDR_two_plus_four_desc:0 "12 сентября в Москве два германских государства и четыре державы-победительницы подписывают окончательное урегулирование: единая Германия суверенна, советские войска уходят до конца 1994 года. Согласие Горбачёва обошлось Бонну в двенадцать миллиардов марок."
 DDR_constitution_referendum:0 "Референдум о конституции"
 DDR_constitution_referendum_desc:0 "Проект общей конституции выносят на референдум в обоих германских государствах в один день. На западе спорят о праве на труд, на востоке — о праве на аборт, и в итоге голосуют за, лишь бы не начинать заново."
 DDR_permanent_neutrality:0 "Вечный нейтралитет"
 DDR_permanent_neutrality_desc:0 "Народная палата записывает в конституцию то, что Австрия записала в 1955 году: никаких союзов и никаких иностранных баз. Советские эшелоны уходят на восток, и Вюнсдорф впервые с 1945 года пустеет."
 DDR_order_on_air:0 "Порядок в эфире"
 DDR_order_on_air_desc:0 "«Актуальная камера» снова согласует сюжеты с правительством. Газетные киоски на время становятся самым интересным местом в городе: там ещё продают западные журналы."
 DDR_leave_warsaw_pact:0 "Выход из Варшавского договора"
 DDR_leave_warsaw_pact_desc:0 "После «Двух плюс четырёх» Москве больше нечего охранять в ГДР договором 1955 года. Выход оформляют протоколом и без речей: страна, тридцать пять лет стоявшая на переднем крае блока, покидает его раньше, чем исчезает сам блок."
 DDR_charter_of_paris:0 "Парижская хартия"
 DDR_charter_of_paris_desc:0 "21 ноября в Париже государства СБСЕ подписывают хартию для новой Европы и объявляют, что эпоха конфронтации и раскола закончилась. ГДР подписывает её как самостоятельное государство, чем немало удивляет соседей."
 DDR_ec_association:0 "Соглашение с ЕС"
 DDR_ec_association_desc:0 "Весной 1990 года ГДР подписала с Европейским сообществом договор о торговле и сотрудничестве. Теперь Восточный Берлин просит ассоциации, о которой уже ведут переговоры Польша, Венгрия и Чехословакия, и Брюссель обсуждает государство, которое все считали временным."
 DDR_snap_election:0 "Досрочные выборы"
 DDR_snap_election_desc:0 "Коалиция, собранная весной ради одного вопроса, к зиме не может договориться ни о чём другом. Народная палата распускает себя сама, и страна идёт на вторые свободные выборы за год, на этот раз без западных ораторов на площадях."
 # national spirits
 TOTU_DDR_round_table:0 "Круглый стол"
 TOTU_DDR_round_table_desc:0 "Власть делится с теми, кто осенью вывел людей на улицы. Партия ещё правит, но каждое её решение сначала обсуждают за круглым столом."
 TOTU_DDR_stasi_besieged:0 "Штази в осаде"
 TOTU_DDR_stasi_besieged_desc:0 "Гражданские комитеты занимают окружные управления госбезопасности, а в подвалах круглые сутки работают уничтожители бумаги. Девяносто тысяч штатных сотрудников ждут, что с ними будет."
 TOTU_DDR_national_responsibility:0 "Правительство национальной ответственности"
 TOTU_DDR_national_responsibility_desc:0 "Партия правит вместе с теми, кто ещё осенью стоял на площадях. Реформы идут быстрее, но каждый приказ теперь приходится согласовывать."
 TOTU_DDR_third_way:0 "Третий путь"
 TOTU_DDR_third_way_desc:0 "Социализм без Штази и без Стены. Никто ещё не знает, как он выглядит, но многие готовы попробовать."
 TOTU_DDR_grand_coalition:0 "Большая коалиция"
 TOTU_DDR_grand_coalition_desc:0 "Пять партий, от ДСС до социал-демократов, и больше двух третей мандатов. Конституцию можно менять хоть каждую неделю, если сначала договориться между собой."
 TOTU_DDR_maximilian_affair:0 "Дело «Максимилиана»"
 TOTU_DDR_maximilian_affair_desc:0 "Премьер отрицает всё, комиссия читает его досье, а газеты каждое утро печатают новые выдержки. Правительство работает, но каждое его заявление встречают вопросом, кто его написал."
 TOTU_DDR_social_charter:0 "Социальная хартия"
 TOTU_DDR_social_charter_desc:0 "Право на труд, жильё и место в детском саду записано в условия любого договора с Бонном. Люди спокойнее, бюджет — нет."
 TOTU_DDR_democratic_socialism:0 "Демократический социализм"
 TOTU_DDR_democratic_socialism_desc:0 "Социализм со свободными выборами, рынком и без Штази. Партия верит, что это возможно, страна согласна проверить."
 TOTU_DDR_neutral_republic:0 "Нейтральная республика"
 TOTU_DDR_neutral_republic_desc:0 "ГДР больше не в Варшавском договоре и не в очереди в НАТО. Торговать можно со всеми, а воевать не с кем и незачем."
 TOTU_DDR_border_regime:0 "Пограничный режим"
 TOTU_DDR_border_regime_desc:0 "Стена открыта, но на переходах снова визы и очереди. Уезжают меньше, торгуют тоже меньше, а оставшиеся помнят, кто опустил шлагбаум."
 TOTU_DDR_ec_association:0 "Ассоциация с ЕС"
 TOTU_DDR_ec_association_desc:0 "Брюссель снимает квоты на восточногерманские товары и присылает экспертов по нормам. Нормы оказываются толще квот."
 TOTU_DDR_open_border:0 "Открытая граница"
 TOTU_DDR_open_border_desc:0 "Стена открыта с 9 ноября. Каждый день на Запад уезжают две тысячи человек, чаще всего молодые, рабочие и врачи. Заводы и больницы пустеют быстрее, чем их успевают реформировать."
 TOTU_DDR_indebted_plan:0 "План в долгах"
 TOTU_DDR_indebted_plan_desc:0 "Плановое хозяйство держится на западных кредитах и изношенных станках. «Трабант» ждут по двенадцать лет, а долг Западу растёт быстрее экспорта."
 TOTU_DDR_joint_ventures:0 "Совместные предприятия"
 TOTU_DDR_joint_ventures_desc:0 "Западные фирмы приходят на восточные заводы со станками, деньгами и привычкой считать каждую марку."
 TOTU_DDR_cheap_bread:0 "Дотированные цены"
 TOTU_DDR_cheap_bread_desc:0 "Хлеб, квартплата и проезд стоят столько же, сколько при Ульбрихте. Покупатели довольны, бюджет — нет."
 TOTU_DDR_price_reform:0 "Цены без дотаций"
 TOTU_DDR_price_reform_desc:0 "Цены ползут вверх, доплаты их догоняют, но не всегда. Зато бюджет впервые за годы не тонет в дотациях."
 TOTU_DDR_dmark_shock:0 "Шок марки"
 TOTU_DDR_dmark_shock_desc:0 "У людей наконец твёрдые деньги, и они тратят их на западные товары. Восточные заводы, вдруг считающие в марках ФРГ, теряют покупателей и дома, и в Восточной Европе."
 TOTU_DDR_short_time_work:0 "Работа на нуле"
 TOTU_DDR_short_time_work_desc:0 "Сотни тысяч числятся на заводах, но сидят дома на двух третях зарплаты: по-немецки это Kurzarbeit Null. Дорого, зато на улицах нет очередей безработных."
 TOTU_DDR_brain_drain:0 "Отток специалистов"
 TOTU_DDR_brain_drain_desc:0 "Граница открыта, но марка ГДР теперь хоть чего-то стоит, и уезжают уже не все. Уезжают врачи, инженеры и программисты: на Западе им платят в разы больше."
 TOTU_DDR_restitution_claims:0 "Заявки на возврат"
 TOTU_DDR_restitution_claims_desc:0 "Больше миллиона заявок на возврат домов, участков и фабрик. Пока суды разбираются, кто хозяин, никто не строит и не продаёт."
 TOTU_DDR_social_market:0 "Социальная рыночная экономика"
 TOTU_DDR_social_market_desc:0 "Рынок, но с больничной кассой, пенсией и пособием. Восток живёт по западным правилам и на западные деньги, пока не научится зарабатывать сам."
 TOTU_DDR_socialist_market:0 "Социалистическая рыночная экономика"
 TOTU_DDR_socialist_market_desc:0 "Плана больше нет, но заводы остаются у своих рабочих и у государства. Цены свободны, марка обратима, и очередь за машиной впервые короче года."
 TOTU_DDR_wave_of_closures:0 "Волна закрытий"
 TOTU_DDR_wave_of_closures_desc:0 "Попечительское ведомство закрывает то, что никто не берёт даже за одну марку. Пустые цеха ждут инвесторов, а их бывшие рабочие — пособий."
 TOTU_DDR_western_group:0 "Западная группа войск"
 TOTU_DDR_western_group_desc:0 "Почти 380 тысяч советских военных стоят на этой земле с 1945 года, а земля, уголь, вагоны и полигоны для них идут из бюджета ГДР. Пока они здесь, без Москвы не решится ничего: ни объединение, ни отказ от него."
 TOTU_DDR_army_at_a_loss:0 "Растерянная армия"
 TOTU_DDR_army_at_a_loss_desc:0 "Национальная народная армия присягала СЕПГ, а СЕПГ больше нет. Солдаты создают советы, офицеры ждут приказов, которых никто не отдаёт."
 TOTU_DDR_mil_soldiers_councils:0 "Солдатские советы"
 TOTU_DDR_mil_soldiers_councils_desc:0 "В каждой части теперь выборный совет, который спорит с командиром о нарядах, отпусках и еде. Дисциплины меньше, зато и дезертиров тоже."
 TOTU_DDR_mil_barracks_discipline:0 "Казарменный порядок"
 TOTU_DDR_mil_barracks_discipline_desc:0 "Устав исполняют до последней запятой, а увольнительные выдают как награду. Офицеры довольны, солдаты считают дни до дембеля."
 TOTU_DDR_mil_military_reform:0 "Военная реформа"
 TOTU_DDR_mil_military_reform_desc:0 "Двенадцать месяцев службы вместо восемнадцати, гражданская одежда в увольнении и право жаловаться в парламент. Армия меньше и моложе, а командиры учатся объяснять приказы."
 TOTU_DDR_mil_citizens_in_uniform:0 "Граждане в форме"
 TOTU_DDR_mil_citizens_in_uniform_desc:0 "Солдат присягает республике и закону, а не партии. Приказ можно обжаловать, а у казармы теперь есть дверь наружу."
 TOTU_DDR_mil_soldiers_in_factories:0 "Солдаты в народном хозяйстве"
 TOTU_DDR_mil_soldiers_in_factories_desc:0 "Тысячи солдат работают на железной дороге, в котельных и больницах вместо уехавших на Запад. Хозяйство держится, учения подождут."
 TOTU_DDR_mil_wgf_departure:0 "Уходящая армия"
 TOTU_DDR_mil_wgf_departure_desc:0 "Эшелоны уходят на восток, а на рынках у гарнизонов продают бензин, форму и бинокли. Освободившиеся казармы и аэродромы ждут хозяев, земля под ними — очистки."
 TOTU_DDR_mil_peace_dividend:0 "Мирный дивиденд"
 TOTU_DDR_mil_peace_dividend_desc:0 "Армию сокращают почти вдвое, а сэкономленные деньги и рабочие руки уходят в хозяйство. Генералы ворчат, министр финансов впервые доволен министром обороны."
 TOTU_DDR_mil_neutral_army:0 "Армия нейтральной страны"
 TOTU_DDR_mil_neutral_army_desc:0 "ННА больше не готовится наступать к Рейну. Она обороняет собственную землю и не спрашивает разрешения ни у Москвы, ни у Брюсселя."
 TOTU_DDR_mil_brotherhood_in_arms:0 "Братство по оружию"
 TOTU_DDR_mil_brotherhood_in_arms_desc:0 "ННА и Западная группа снова действуют как одна армия, как учили на всех учениях «Братство по оружию». Страна смотрит на неё с тревогой."
 TOTU_DDR_mil_stationing_treaty:0 "Гарнизоны по договору"
 TOTU_DDR_mil_stationing_treaty_desc:0 "Советские войска остаются, но теперь платят за землю и согласуют учения. Пока они здесь, на ГДР никто не нападёт, и в Москве об этом помнят при каждом торге."
 TOTU_DDR_mil_professional_army:0 "Профессиональная армия"
 TOTU_DDR_mil_professional_army_desc:0 "Полгода срочной службы, а сержанты и прапорщики служат по контракту. Призывников меньше, зато учат их те, кто остался в армии по своей воле."
