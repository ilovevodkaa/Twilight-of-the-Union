 SOV_gennady_yanayev:0 "Геннадий Янаев"
 TOTU_president_of_the_ussr:0 "Президент СССР"
 TOTU_president_of_the_ussr_desc:0 "Глава государства, избранный Съездом народных депутатов. Его указы обязательны для всех, но республики всё чаще их не замечают."
 TOTU_vilnius_crackdown:0 "Штурм вильнюсской телебашни"

 # Подсказки к фокусам
 SOV_gorbachev_in_power_tt:0 "Михаил Горбачёв возглавляет страну"
 SOV_union_referendum_tt:0 "Итоги референдума: §Y76%§! «за». Прибалтика, Грузия, Армения и Молдавия бойкотируют голосование."
 SOV_union_of_sovereign_states_yeltsin_tt:0 "Ельцин поддерживает договор, подписанный при его участии:"
 SOV_500_days_program_tt:0 "Ельцин поддерживает программу. Правительство Рыжкова против неё, и решать его судьбу придётся нам."
 SOV_deal_with_yeltsin_tt:0 "РСФСР получает суверенитет в составе Союза. Ельцин поддержит новый союзный договор: «§YСоюз Суверенных Государств§!» даст ещё §G+5%§! стабильности."
 SOV_deal_with_yeltsin_500_days_tt:0 "Ельцин уже поддержал программу «500 дней»:"
 SOV_rsfsr_sovereignty_in_union_tt:0 "РСФСР больше не задерживает налоги в союзный бюджет."
 SOV_yeltsin_prime_minister_tt:0 "Пост вице-президента уже занят, поэтому Ельцин становится §Yпремьер-министром СССР§!."
 SOV_yeltsin_vice_president_tt:0 "Ельцин становится §Yвице-президентом СССР§!."
 SOV_stop_yeltsin_tt:0 "Союзные органы отказываются признавать Декларацию о суверенитете РСФСР. Ельцин уходит в оппозицию."
 SOV_bet_on_autonomies_tt:0 "Татарстан, Башкирия и Якутия спорят теперь с Ельциным, а не с Москвой."
 SOV_remove_yeltsin_tt:0 "Сто тысяч человек выходят на площадь Маяковского в поддержку Ельцина, но депутаты своё решение не меняют."
 SOV_28th_party_congress_tt:0 "Ельцин и «Демократическая платформа» выходят из КПСС."
 SOV_remove_gorbachev_tt:0 "Горбачёв остаётся на даче в Форосе «по состоянию здоровья». Страну возглавляет §YГеннадий Янаев§!, глава ГКЧП."
 SOV_communist_party_of_rsfsr_tt:0 "У консерваторов появляется своя партия в самой большой республике, противовес Ельцину."

 # Событие: вице-президент
 totu_sov_politics.1.t:0 "Кто станет вице-президентом?"
 totu_sov_politics.1.d:0 "Президенту нужен заместитель, и Съезд народных депутатов должен его утвердить. Горбачёв колеблется между двумя людьми. Геннадий Янаев, бывший глава профсоюзов, надёжен и незаметен, как сам аппарат. Эдуард Шеварднадзе, министр иностранных дел, свой для реформаторов и чужой для генералов.\n\nКого бы ни выбрал президент, депутаты голосуют неохотно, и утверждать кандидата придётся не с первой попытки."
 totu_sov_politics.1.a:0 "Геннадий Янаев. Аппарат должен быть спокоен."
 totu_sov_politics.1.b:0 "Эдуард Шеварднадзе. Реформам нужен союзник."

 # Событие: Вильнюсская телебашня
 totu_sov_politics.2.t:0 "Вильнюсская телебашня"
 totu_sov_politics.2.d:0 "Ночь на 13 января. Бронетранспортёры и группа «Альфа» стоят у телебашни, вокруг неё живое кольцо из тысяч безоружных людей с литовскими флагами. В Москве ждут приказа, который никто не хочет подписывать первым.\n\nМожно взять башню, и республики на время притихнут. А можно отвести войска до рассвета, пока не пролилась кровь."
 totu_sov_politics.2.a:0 "Взять телебашню."
 totu_sov_politics.2.a_tt:0 "Демократические великие державы осудят Москву."
 totu_sov_politics.2.b:0 "Отвести войска."

 # Нацдухи
 TOTU_SOV_glasnost_free_press:0 "Гласность без цензуры"
 TOTU_SOV_glasnost_free_press_desc:0 "Закон о печати отменил цензуру. Газеты пишут что хотят, тиражи растут, а доверие к власти падает с каждым номером."
 TOTU_SOV_awakening_republics_council:0 "Республики за столом"
 TOTU_SOV_awakening_republics_council_desc:0 "Руководители республик сидят в Совете Федерации рядом с президентом. Требования никуда не делись, но их всё чаще обсуждают, а не выкрикивают на митингах."
 TOTU_SOV_social_payments:0 "Социальные выплаты"
 TOTU_SOV_social_payments_desc:0 "Индексация пенсий и зарплат, первые пособия по безработице. Деньги на них приходится искать в бюджете, которого уже не хватает."
 TOTU_SOV_cooperatives:0 "Кооперативы становятся собственниками"
 TOTU_SOV_cooperatives_desc:0 "Закон о собственности разрешил гражданам владеть средствами производства. Кооператоры учат директоров считать деньги."
 TOTU_SOV_rsfsr_budget:0 "Российские налоги в союзном бюджете"
 TOTU_SOV_rsfsr_budget_desc:0 "РСФСР снова перечисляет налоги в союзный бюджет. Москва впервые за год знает, сколько у неё денег."
 TOTU_SOV_baltic_crackdown:0 "Порядок в Прибалтике"
 TOTU_SOV_baltic_crackdown_desc:0 "После Вильнюса республики притихли. Надолго ли, не знает никто, в том числе те, кто отдал приказ."

 # Событие: XXVIII съезд
 totu_sov_politics.3.t:0 "Ельцин уходит со съезда"
 totu_sov_politics.3.d:0 "12 июля, предпоследний день XXVIII съезда. Борис Ельцин поднимается на трибуну, объявляет о выходе из КПСС и идёт по проходу к дверям, не оглядываясь. На следующий день о выходе заявляют лидеры «Демократической платформы» Вячеслав Шостаковский и Владимир Лысенко, за ними Гавриил Попов и Анатолий Собчак.\n\nВ зале многие вздохнули с облегчением. Но вслед за лидерами могут уйти сотни тысяч рядовых коммунистов, прежде всего в Москве и Ленинграде."
 totu_sov_politics.3.a:0 "Пусть уходят. Партии нужна ясность, а не фракции."
 totu_sov_politics.3.b:0 "Ельцин ушёл, но платформу надо удержать: дать ей места в ЦК."

 # Событие: «500 дней»
 totu_sov_politics.4.t:0 "«500 дней» и отставка Рыжкова"
 totu_sov_politics.4.d:0 "Программа Станислава Шаталина и Григория Явлинского готова: приватизация, свободные цены и урезанный союзный бюджет, всё за 500 дней. Верховный Совет РСФСР одобрил её ещё 11 сентября. Председатель Совмина Николай Рыжков называет программу авантюрой и даёт понять, что исполнять её не будет.\n\nПринять программу целиком значит отправить правительство Рыжкова в отставку. По поручению президента академик Абел Аганбегян сводит её с правительственным проектом Леонида Абалкина в «Основные направления»: к рынку медленнее, Рыжков на месте. Но такой компромисс Ельцин не примет."
 totu_sov_politics.4.a:0 "Программа Шаталина и Явлинского. Правительство уходит."
 totu_sov_politics.4.b:0 "«Основные направления». Рыжков остаётся."
 totu_sov_politics.4.b_tt:0 "Ельцин называет компромисс отказом от «500 дней» и больше §Rне поддерживает§! программу."

 # Событие: итоги референдума
 totu_sov_politics.5.t:0 "Итоги референдума"
 totu_sov_politics.5.d:0 "17 марта 1991 года к урнам пришли 148 миллионов человек, 80% избирателей. За сохранение Союза как обновлённой федерации высказались 76,4%. Литва, Латвия, Эстония, Грузия, Армения и Молдавия голосование бойкотировали, хотя в Абхазии и Приднестровье участки всё же открылись.\n\nРеспублики читают итог каждая по-своему. В Москве спорят, что это: приказ республикам подчиниться или мандат на переговоры о новом союзном договоре."
 totu_sov_politics.5.a:0 "Народ высказался. Кто бойкотировал, тот нарушил закон."
 totu_sov_politics.5.b:0 "Это мандат на новый союзный договор."

 # Событие: 28 марта
 totu_sov_politics.6.t:0 "28 марта"
 totu_sov_politics.6.d:0 "В Кремле открывается внеочередной Съезд народных депутатов РСФСР, созванный, чтобы снять Ельцина. 25 марта Кабинет министров запретил митинги в Москве до 15 апреля, и в город вошли войска и милиция: грузовики и бронетранспортёры стоят на Тверской и вокруг Манежной площади. Несмотря на запрет, сто тысяч человек идут на площадь Маяковского и Арбатскую площадь.\n\nДепутаты голосуют против Ельцина, но многие из них возмущены: съезд, говорят они, заседает под охраной штыков. Войска можно оставить на улицах до закрытия съезда, а можно вывести уже утром."
 totu_sov_politics.6.a:0 "Войска остаются до конца съезда."
 totu_sov_politics.6.b:0 "Вывести войска утром."

 # Событие: Форос
 totu_sov_politics.7.t:0 "Форос"
 totu_sov_politics.7.d:0 "Связь с дачей в Форосе отключена, Горбачёва охраняют люди генерала Плеханова. Геннадий Янаев подписывает бумаги в Кремле, но указ о чрезвычайном положении всё ещё не подписан: комитет медлит.\n\nБорис Ельцин уже в Белом доме на Краснопресненской набережной. Он объявляет действия комитета незаконными, вокруг здания строят баррикады из троллейбусов и арматуры. Назарбаев и Кравчук выжидают и не говорят ничего определённого."
 totu_sov_politics.7.d_removed:0 "Связь с дачей в Форосе отключена, Горбачёва охраняют люди генерала Плеханова. Геннадий Янаев подписывает бумаги в Кремле, но указ о чрезвычайном положении всё ещё не подписан: комитет медлит.\n\nВ марте Ельцина сняли с поста председателя, но сейчас это ничего не значит. Он приезжает в Белый дом на Краснопресненской набережной, и депутаты-демократы его впускают. Вокруг здания строят баррикады из троллейбусов и арматуры. Назарбаев и Кравчук выжидают и не говорят ничего определённого."
 totu_sov_politics.7.a:0 "Отправить «Альфу» в Белый дом."
 totu_sov_politics.7.b:0 "Позвонить Назарбаеву и Кравчуку. Их нейтралитет стоит дорого."
 totu_sov_politics.7.c:0 "Оцепить Белый дом и ждать."

 # Событие: война законов
 totu_sov_politics.8.t:0 "Война законов"
 totu_sov_politics.8.d:0 "24 октября 1990 года Верховный Совет РСФСР постановил: союзные законы действуют в России, только если их утвердил российский парламент. В тот же день Верховный Совет СССР принял закон с прямо противоположным смыслом. Предприятия не знают, кому платить налоги, и всё чаще выбирают того, кто просит меньше.\n\nРоссийские акты можно отменить указом президента и потребовать подчинения. Можно передать спор в Комитет конституционного надзора Сергея Алексеева, но комитет работает медленно, и заставить исполнять свои решения ему нечем."
 totu_sov_politics.8.a:0 "Указом президента отменить российские законы."
 totu_sov_politics.8.b:0 "Пусть решит Комитет конституционного надзора."
