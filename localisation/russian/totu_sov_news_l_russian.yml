l_russian:
 # Мировые новости о событиях в СССР (events/TOTU_SOV_news.txt): вариант .a видят другие страны, .b сам СССР.

 totu_sov_news.1.t:0 "КПСС отказалась от монополии на власть"
 totu_sov_news.1.d:0 "Съезд народных депутатов СССР изменил шестую статью Конституции. Коммунистическая партия больше не «руководящая и направляющая сила» советского общества, и другие партии теперь могут бороться за власть.\n\nВ западных столицах говорят о конце однопартийной системы, которая держалась больше семидесяти лет."
 totu_sov_news.1.a:0 "Однопартийной системе конец"
 totu_sov_news.1.b:0 "Пусть другие партии попробуют"

 totu_sov_news.2.t:0 "Горбачёв стал Президентом СССР"
 totu_sov_news.2.d:0 "Съезд народных депутатов избрал Михаила Горбачёва Президентом СССР: 1329 голосов «за», 495 «против». Власть переходит от Политбюро к государственному посту.\n\nНа Западе ждут, что президент сможет больше, чем генеральный секретарь. В республиках опасаются того же."
 totu_sov_news.2.a:0 "У Москвы новый глава государства"
 totu_sov_news.2.b:0 "Власть переходит к государству"

 totu_sov_news.3.t:0 "Кровь у вильнюсской телебашни"
 totu_sov_news.3.d:0 "В ночь на 13 января советские войска и группа «Альфа» взяли телебашню в Вильнюсе. Погибли 14 человек, сотни ранены, кадры штурма за сутки облетели мир.\n\nЗападные правительства осуждают применение силы и откладывают обещанную Москве помощь."
 totu_sov_news.3.a:0 "Танки против безоружных"
 totu_sov_news.3.b:0 "Порядок восстановлен"

 totu_sov_news.4.t:0 "Советский Союз проголосовал за Союз"
 totu_sov_news.4.d:0 "На первом в истории СССР всесоюзном референдуме 76,4% проголосовавших высказались за сохранение Союза как обновлённой федерации. Шесть республик, от Литвы до Грузии, голосование бойкотировали.\n\nМосква называет итог мандатом. Лидеры республик спорят, на что именно."
 totu_sov_news.4.a:0 "Большинство за Союз, но не все"
 totu_sov_news.4.b:0 "Народ сказал «да»"

 totu_sov_news.5.t:0 "Горбачёв отстранён, власть у ГКЧП"
 totu_sov_news.5.d:0 "Советское телевидение сообщило, что Михаил Горбачёв «по состоянию здоровья» не может исполнять обязанности президента. Его полномочия взяли на себя Геннадий Янаев и Государственный комитет по чрезвычайному положению.\n\nГорбачёв, по неофициальным данным, находится на даче в Форосе. Западные правительства требуют вернуть законного президента и приостанавливают контакты с Москвой."
 totu_sov_news.5.a:0 "Переворот в Москве"
 totu_sov_news.5.b:0 "Вынужденная мера"

 totu_sov_news.6.t:0 "Подписан договор о Союзе Суверенных Государств"
 totu_sov_news.6.d:0 "Руководители республик подписали в Москве новый союзный договор. СССР становится Союзом Суверенных Государств: республики сами управляют своей экономикой, центр сохраняет армию, валюту и внешнюю политику.\n\nПрибалтика, Грузия, Армения и Молдавия в договоре не участвуют. На Западе с облегчением отмечают, что у ядерного арсенала остаётся один хозяин."
 totu_sov_news.6.a:0 "Союз уцелел, но стал другим"
 totu_sov_news.6.b:0 "Новый Союз"

 totu_sov_news.7.t:0 "Чрезвычайное положение в СССР"
 totu_sov_news.7.d:0 "В Советском Союзе введено чрезвычайное положение. Запрещены митинги и забастовки, приостановлена деятельность оппозиционных партий, из центральных газет выходят только девять.\n\nПо улицам Москвы идёт бронетехника. Западные правительства замораживают программы помощи и отзывают послов для консультаций."
 totu_sov_news.7.a:0 "Москва закрывается"
 totu_sov_news.7.b:0 "Порядок прежде всего"

 totu_sov_news.8.t:0 "Ельцин возглавил российский парламент"
 totu_sov_news.8.d:0 "Борис Ельцин с третьей попытки избран Председателем Верховного Совета РСФСР: 535 голосов при необходимых 531. Горбачёв лично выступал против его кандидатуры.\n\nУ самой большой республики Союза теперь лидер, который открыто спорит с Кремлём. Западные наблюдатели видят в нём главного соперника Горбачёва."
 totu_sov_news.8.a:0 "У Горбачёва появился соперник"
 totu_sov_news.8.b:0 "Россия выбрала Ельцина"
