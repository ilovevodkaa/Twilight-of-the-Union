l_russian:
 # Twilight of the Union: replaces the vanilla file, so only these quotes show on loading screens.
 # Keep keys consecutive from 0. Keep EN and RU in the same order.
 # Loading-screen subtitles (interface/load_screen.gui): no quotation marks; break lines by hand
 # with \n at a phrase boundary, at most 40 characters per line and at most 3 quote lines; the
 # last line is the name strap in §D: name + one qualifier, at most 40 characters, no dash.
 # tools/build_fonts.py checks all of this.
 LOADING_TIP_0:0 "Господи, благослови Америку. И Россию.\n§DБорис Ельцин§!"
 LOADING_TIP_1:0 "Господин Горбачёв, снесите эту стену!\n§DРональд Рейган, Берлин, 1987§!"
 LOADING_TIP_2:0 "Мне нравится господин Горбачёв.\nМы можем вести с ним дела.\n§DМаргарет Тэтчер, 1984§!"
 LOADING_TIP_3:0 "Кто опаздывает, того наказывает жизнь.\n§DМихаил Горбачёв, Берлин, 1989§!"
 LOADING_TIP_4:0 "Процесс пошёл.\n§DМихаил Горбачёв§!"
 LOADING_TIP_5:0 "Борис, ты не прав!\n§DЕгор Лигачёв, 1988§!"
 LOADING_TIP_6:0 "Не могу поступаться принципами.\n§DНина Андреева, 1988§!"
 LOADING_TIP_7:0 "Доверяй, но проверяй.\n§DРональд Рейган, 1987§!"
 LOADING_TIP_8:0 "За моей спиной не осталось\nни одного советского солдата.\n§DБорис Громов, Афганистан, 1989§!"
 LOADING_TIP_9:0 "Теперь у нас доктрина Фрэнка Синатры.\nУ него есть песня „I Did It My Way“.\n§DГеннадий Герасимов, МИД СССР, 1989§!"
 LOADING_TIP_10:0 "Насколько мне известно...\nнемедленно, без промедления.\n§DГюнтер Шабовски, 9 ноября 1989§!"
 LOADING_TIP_11:0 "Возможно, мы наблюдаем\nне просто конец холодной войны,\nа конец истории как таковой.\n§DФрэнсис Фукуяма, 1989§!"
 LOADING_TIP_12:0 "Наша страна не процветает.\n§DВацлав Гавел, 1 января 1990§!"
 LOADING_TIP_13:0 "Берите столько суверенитета,\nсколько сможете проглотить.\n§DБорис Ельцин, Казань, 1990§!"
 LOADING_TIP_14:0 "Из этих смутных времён\nможет родиться новый мировой порядок.\n§DДжордж Буш, 1990§!"
 LOADING_TIP_15:0 "Читайте по губам:\nникаких новых налогов.\n§DДжордж Буш, 1988§!"
 LOADING_TIP_16:0 "Цветущие ландшафты.\n§DГельмут Коль о восточных землях, 1990§!"
 LOADING_TIP_17:0 "Нет. Нет. Нет.\n§DМаргарет Тэтчер о Брюсселе, 1990§!"
 LOADING_TIP_18:0 "Наступает диктатура.\n§DЭдуард Шеварднадзе, декабрь 1990§!"
 LOADING_TIP_19:0 "Свобода — это не то же самое,\nчто независимость.\n§DДжордж Буш, Киев, 1991§!"
 LOADING_TIP_20:0 "Речь идёт о правом, реакционном,\nантиконституционном перевороте.\n§DБорис Ельцин на танке, 19 августа 1991§!"
 LOADING_TIP_21:0 "Михаил Сергеевич находится\nна отдыхе и лечении в Крыму.\n§DГеннадий Янаев, ГКЧП, 1991§!"
 LOADING_TIP_22:0 "Я прекращаю свою деятельность\nна посту Президента СССР.\n§DМихаил Горбачёв, 25 декабря 1991§!"
 LOADING_TIP_23:0 "Хотели как лучше,\nа получилось как всегда.\n§DВиктор Черномырдин, 1993§!"
 LOADING_TIP_24:0 "Империя зла.\n§DРональд Рейган, 1983§!"
