 # Twilight of the Union: replaces the vanilla file, so only these quotes show on loading screens.
 # Keep keys consecutive from 0. Keep EN and RU in the same order.
 LOADING_TIP_0:0 "«Господи, благослови Америку. И Россию».\n- Борис Ельцин"
 LOADING_TIP_1:0 "«Господин Горбачёв, снесите эту стену!»\n- Рональд Рейган, Берлин, 1987"
 LOADING_TIP_2:0 "«Мне нравится господин Горбачёв. Мы можем вести с ним дела».\n- Маргарет Тэтчер, 1984"
 LOADING_TIP_3:0 "«Кто опаздывает, того наказывает жизнь».\n- Михаил Горбачёв, Берлин, 1989"
 LOADING_TIP_4:0 "«Процесс пошёл».\n- Михаил Горбачёв"
 LOADING_TIP_5:0 "«Борис, ты не прав!»\n- Егор Лигачёв, XIX партконференция, 1988"
 LOADING_TIP_6:0 "«Не могу поступаться принципами».\n- Нина Андреева, «Советская Россия», 1988"
 LOADING_TIP_7:0 "«Доверяй, но проверяй».\n- Рональд Рейган, 1987"
 LOADING_TIP_8:0 "«За моей спиной не осталось ни одного советского солдата».\n- Борис Громов, вывод войск из Афганистана, 1989"
 LOADING_TIP_9:0 "«Теперь у нас доктрина Фрэнка Синатры. У него есть песня „I Did It My Way“».\n- Геннадий Герасимов, МИД СССР, 1989"
 LOADING_TIP_10:0 "«Насколько мне известно... немедленно, без промедления».\n- Гюнтер Шабовски о границе ГДР, 9 ноября 1989"
 LOADING_TIP_11:0 "«Возможно, мы наблюдаем не просто конец холодной войны, а конец истории как таковой».\n- Фрэнсис Фукуяма, 1989"
 LOADING_TIP_12:0 "«Наша страна не процветает».\n- Вацлав Гавел, новогоднее обращение, 1 января 1990"
 LOADING_TIP_13:0 "«Берите столько суверенитета, сколько сможете проглотить».\n- Борис Ельцин, Казань, 1990"
 LOADING_TIP_14:0 "«Из этих смутных времён может родиться новый мировой порядок».\n- Джордж Буш, 1990"
 LOADING_TIP_15:0 "«Читайте по губам: никаких новых налогов».\n- Джордж Буш, 1988"
 LOADING_TIP_16:0 "«Цветущие ландшафты».\n- Гельмут Коль о будущем восточных земель Германии, 1990"
 LOADING_TIP_17:0 "«Нет. Нет. Нет».\n- Маргарет Тэтчер о планах Брюсселя, 1990"
 LOADING_TIP_18:0 "«Наступает диктатура».\n- Эдуард Шеварднадзе, уходя в отставку, декабрь 1990"
 LOADING_TIP_19:0 "«Свобода — это не то же самое, что независимость».\n- Джордж Буш, Киев, 1991"
 LOADING_TIP_20:0 "«Речь идёт о правом, реакционном, антиконституционном перевороте».\n- Борис Ельцин, обращение с танка, 19 августа 1991"
 LOADING_TIP_21:0 "«Михаил Сергеевич находится на отдыхе и лечении в Крыму».\n- Геннадий Янаев, пресс-конференция ГКЧП, 1991"
 LOADING_TIP_22:0 "«Я прекращаю свою деятельность на посту Президента СССР».\n- Михаил Горбачёв, 25 декабря 1991"
 LOADING_TIP_23:0 "«Хотели как лучше, а получилось как всегда».\n- Виктор Черномырдин, 1993"
 LOADING_TIP_24:0 "«Империя зла».\n- Рональд Рейган о Советском Союзе, 1983"
