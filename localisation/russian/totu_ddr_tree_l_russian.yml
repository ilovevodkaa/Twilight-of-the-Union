 DDR_pol_election_rules_tt:0 "§Y18 марта§! — выборы в Народную палату. Если §Yкоммунизм§! популярнее §Yдемократии§!, власть удержит ПДС. Иначе победит «Альянс за Германию», если ГДР приняла §Yвалютный союз§!, а если нет — СДПГ."
