 totu_ddr_pol.1.t:0 "Дело «Максимилиана»"
 totu_ddr_pol.1.d:0 "Едва Ибрагим Бёме принимает присягу, «Шпигель» пишет, что премьер много лет был осведомителем Штази под кличкой «Максимилиан». Бёме называет это клеветой, комиссия Народной палаты запрашивает его досье, а партнёры по коалиции гадают, чьё имя всплывёт следующим."
 totu_ddr_pol.1.a:0 "Всё это клевета"
 totu_ddr_pol.1.b:0 "Бёме сдаёт пост председателя партии"
 totu_ddr_pol.2.t:0 "Голодовка на Норманненштрассе"
 totu_ddr_pol.2.d:0 "4 сентября правозащитники снова занимают здание Штази на Норманненштрассе и объявляют голодовку: архивы не должны уехать в Кобленц. Среди них Бербель Боляй, которую Штази когда-то выдавила из страны. Бонн предлагает подождать, голодающие отвечают, что ждали сорок лет."
 totu_ddr_pol.2.a:0 "Досье остаются на востоке"
 totu_ddr_pol.2.b:0 "Очистить здание"
 DDR_pol_pact_exit_agreed_tt:0 "ГДР выходит из Варшавского договора и перестаёт быть страной соцсодружества."
 DDR_pol_pact_exit_refused_tt:0 "ГДР остаётся в Варшавском договоре."
 totu_ddr_pol.3.t:0 "Протокол из Восточного Берлина"
 totu_ddr_pol.3.d:0 "Министр обороны ГДР просит освободить Национальную народную армию от обязательств перед Объединённым командованием, а ГДР — от членства в Варшавском договоре. Генерал Лушев ждёт указаний: подписать протокол или напомнить немцам, чьи войска стоят в их гарнизонах."
 totu_ddr_pol.3.a:0 "Подписать протокол"
 totu_ddr_pol.3.b:0 "Отказать"
 totu_ddr_pol.4.t:0 "Ответ Москвы"
 totu_ddr_pol.4.d_yes:0 "Генерал Лушев подписывает протокол за десять минут, без речей и без оркестра. Национальная народная армия больше не входит в Объединённые вооружённые силы, а ГДР — в Варшавский договор. Советские войска уходят по графику."
 totu_ddr_pol.4.d_no:0 "Москва отвечает коротко: вопрос преждевременен. Протокол возвращается в сейф министерства, а в Вюнсдорфе отменяют отпуска."
 totu_ddr_pol.4.a:0 "Без оркестра"
 totu_ddr_pol.4.b:0 "Вернуть протокол в сейф"
