 # Сценарий: 1 января 1990 года
 TOTU_1990_NAME:0 "Сумерки Союза"
 TOTU_1990_DESC:0 "Семь недель назад пала Берлинская стена, Варшавский договор расползается по швам, а Советский Союз входит в новое десятилетие с пустыми полками, беспокойными республиками и руководством, которое уже не может договориться, куда идёт страна."
 TOTU_SOV_1990_DESC:0 "Пять лет перестройки расшатали всё и ничего не исправили. Прибалтика рвётся на свободу, Кавказ горит, экономика падает, а монополию партии на власть вот-вот вынесут на голосование.\n\nСоюз ещё можно реформировать, удержать силой или отпустить. Оставить как есть уже нельзя."
 TOTU_USA_1990_DESC:0 "Холодная война, похоже, выиграна, и Вашингтон не знает, что делать с победой. Объединяющаяся Германия, рушащийся Восточный блок и Советский Союз с тысячами боеголовок требуют ответов, а прежних определённостей больше нет."

 # Персонажи
 SOV_mikhail_gorbachev:0 "Михаил Горбачёв"
 USA_george_bush:0 "Джордж Буш"

 # Малые страны
 TOTU_POL_1990_DESC:0 "«Солидарность» победила на выборах 1989 года, и Тадеуш Мазовецкий возглавляет первое некоммунистическое правительство Восточного блока. Президентом остаётся генерал Ярузельский, а с первого дня года начинается шоковая терапия."
 TOTU_CZE_1990_DESC:0 "Бархатная революция за несколько недель покончила с сорока годами коммунистической власти. Вацлав Гавел, драматург-диссидент, сидевший в тюрьме ещё в прошлом году, теперь президент страны, которой предстоит быстро учиться демократии."
 TOTU_HUN_1990_DESC:0 "Прошлым летом Венгрия открыла железный занавес на границе с Австрией, а в октябре провозгласила себя республикой. Свободные выборы назначены на весну."
 TOTU_ROM_1990_DESC:0 "Чаушеску расстреляли на Рождество. Власть в Бухаресте у Фронта национального спасения, и никто толком не знает, закончилась революция или только началась."
 TOTU_BUL_1990_DESC:0 "В ноябре после тридцати пяти лет у власти пал Тодор Живков. Партия обещает реформы и свободные выборы, но страну по-прежнему контролирует она."
 TOTU_PRC_1990_DESC:0 "Через семь месяцев после Тяньаньмэнь Пекин смотрит на падение Восточного блока и делает свои выводы: реформировать экономику, но ни в коем случае не ослаблять хватку партии."
 TOTU_ENG_1990_DESC:0 "Маргарет Тэтчер больше десяти лет на Даунинг-стрит, но подушный налог вот-вот выведет толпы на улицы, а собственная партия теряет терпение."
 TOTU_FRA_1990_DESC:0 "Франсуа Миттеран с открытой тревогой смотрит на объединяющуюся Германию и видит один ответ: как можно теснее привязать Бонн к Парижу внутри углублённого Европейского сообщества."

 # Стартовые нацдухи СССР
 TOTU_SOV_no_plan_no_market:0 "Ни плана, ни рынка"
 TOTU_SOV_no_plan_no_market_desc:0 "Перестройка сломала старую систему, но новой не построила. Предприятия сами назначают зарплаты, а товаров больше не становится. Кооперативы скупают государственный дефицит, Госплан не может свести концы с концами, а у людей на руках всё больше денег, на которые нечего купить."
 TOTU_SOV_glasnost:0 "Гласность"
 TOTU_SOV_glasnost_desc:0 "Газеты пишут о Сталине, Афганистане и Чернобыле, депутаты спорят в прямом эфире. Страна впервые говорит открыто, и всё громче она говорит о том, что партия ей больше не нужна."
 TOTU_SOV_nomenklatura:0 "Неповоротливая номенклатура"
 TOTU_SOV_nomenklatura_desc:0 "Министерства, обкомы и главки привыкли к приказам сверху, но приказы больше не исполняются. Аппарат не может остановить реформы и не хочет их проводить."
 TOTU_SOV_awakening_republics:0 "Пробуждение республик"
 TOTU_SOV_awakening_republics_desc:0 "Прибалтийские народные фронты требуют независимости, в Нагорном Карабахе идёт война, Грузия помнит 9 апреля. Призывники из республик всё чаще не являются в военкоматы."
 TOTU_SOV_bloated_mic:0 "Раздутый ВПК"
 TOTU_SOV_bloated_mic_desc:0 "На оборону уходит, по разным оценкам, от пятнадцати до двадцати процентов национального дохода. Заводы выпускают танки, которые некуда девать, и не умеют делать кастрюли."
 TOTU_SOV_afghan_syndrome:0 "Афганский синдром"
 TOTU_SOV_afghan_syndrome_desc:0 "Последний советский солдат покинул Афганистан в феврале 1989 года. Пятнадцать тысяч погибших, цинковые гробы и ветераны, вернувшиеся в страну, которая не хочет о них слышать."
 TOTU_SOV_conscript_army:0 "Призывная армия сверхдержавы"
 TOTU_SOV_conscript_army_desc:0 "Под ружьём почти четыре миллиона человек. Армия огромна, но держится на призыве, дедовщине и складских запасах прошлых десятилетий."
