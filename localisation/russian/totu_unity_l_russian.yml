 TOTU_unity_freeze_60_tt:0 "Переговоры об объединении §Rзаморожены§! на §Y60 дней§!: решения обеих сторон недоступны, шкала не растёт."
 TOTU_unity_freeze_180_tt:0 "Переговоры об объединении §Rзаморожены§! на §Y180 дней§!: решения обеих сторон недоступны, шкала не растёт."
 TOTU_unity_freeze_365_tt:0 "Переговоры об объединении §Rзаморожены§! на §Yгод§!: решения обеих сторон недоступны, шкала не растёт."
 TOTU_unity_frozen_void_tt:0 "Переговоры об объединении §Rзаморожены§!: пока они стоят, шкала и вклады не меняются."
 TOTU_unity_unfreeze_tt:0 "Переговоры об объединении §Gвозобновляются§!."
 TOTU_unity_end_talks_tt:0 "Германский вопрос §Rзакрыт§!: два германских государства остаются, шкалы объединения и решений больше нет."
 TOTU_unity_req_active_tt:0 "Переговоры об объединении не заморожены"
 TOTU_unity_req_moscow_tt:0 "Москва не решает судьбу переговоров «2+4»"
 TOTU_unity_req_scale_50_tt:0 "Шкала объединения не ниже §Y50%§!"
 TOTU_unity_req_scale_60_tt:0 "Шкала объединения не ниже §Y60%§!"
 TOTU_unity_req_scale_70_tt:0 "Шкала объединения не ниже §Y70%§!"
 TOTU_unity_req_democratic_tt:0 "В ГДР демократическое правительство (Альянс за Германию или СДПГ)"
 TOTU_unity_req_dmark_tt:0 "ГДР приняла валютный союз или в ней демократическое правительство"
 TOTU_unity_req_dmark_done_tt:0 "Марка обещана (решение «Обещание марки»)"
 TOTU_unity_req_monetary_tt:0 "Валютный союз заключён"
 TOTU_unity_req_modrow_plan_tt:0 "Принят план Модрова"
 TOTU_unity_ger_kohl_plan:0 "Ускорить план Коля"
 TOTU_unity_ger_kohl_plan_desc:0 "28 ноября 1989 года Коль изложил в бундестаге «Десять пунктов»: сначала договорное сообщество, потом конфедерация, единство когда-нибудь. В феврале 1990 года «когда-нибудь» решено заменить на «в этом году»."
 TOTU_unity_ger_west_tv:0 "Западное телевидение"
 TOTU_unity_ger_west_tv_desc:0 "ARD и ZDF принимаются почти по всей ГДР, кроме «долины неведения» под Дрезденом. Каждый выпуск «Тагесшау» работает как агитационная поездка, на которую не нужно разрешение."
 TOTU_unity_ger_campaign_east:0 "Агитация на Востоке"
 TOTU_unity_ger_campaign_east_desc:0 "Коль, Геншер и Фогель ездят по ГДР как по своему избирательному округу. Шесть митингов Коля в феврале и марте 1990 года собрали больше миллиона человек."
 TOTU_unity_ger_dmark:0 "Обещание марки"
 TOTU_unity_ger_dmark_desc:0 "6 февраля 1990 года Коль предложил ГДР валютный союз немедленно, до всякого объединения, и Бундесбанк узнал об этом из новостей. Теперь Восточный Берлин согласен, и Бонн подтверждает обещание: марка придёт раньше единства."
 TOTU_unity_ger_solidarity_credit:0 "Кредит солидарности"
 TOTU_unity_ger_solidarity_credit_desc:0 "Модров просил в Бонне пятнадцать миллиардов марок «солидарного взноса» и уехал ни с чем. Бонн готов дать деньги, но на своих условиях и под свой контроль."
 TOTU_unity_ger_currency_treaty:0 "Договор о валютном союзе"
 TOTU_unity_ger_currency_treaty_desc:0 "Договор о валютном, экономическом и социальном союзе подписан 18 мая 1990 года, с 1 июля марка ФРГ становится единственной валютой ГДР. Зарплаты меняют один к одному, а заводы ГДР в тот же день оказываются на мировом рынке."
 TOTU_unity_ger_two_plus_four:0 "Переговоры «2+4»"
 TOTU_unity_ger_two_plus_four_desc:0 "Два германских государства и четыре державы-победительницы садятся за один стол: первый раунд прошёл в Бонне 5 мая 1990 года. Без Москвы, Вашингтона, Лондона и Парижа единство остаётся внутренним делом немцев только на бумаге."
 TOTU_unity_ger_unification_treaty:0 "Договор об объединении"
 TOTU_unity_ger_unification_treaty_desc:0 "Тысяча страниц о том, как одно государство становится частью другого: законы, пенсии, архивы Штази, даже государственный праздник. Подписан в Восточном Берлине 31 августа 1990 года."
 TOTU_unity_ddr_treaty_community:0 "Договорное сообщество"
 TOTU_unity_ddr_treaty_community_desc:0 "1 февраля 1990 года Модров предлагает план «Германия, единое отечество»: договорное сообщество, затем конфедерация и нейтральная Германия. Темп и условия определяют обе стороны, а не одна."
 TOTU_unity_ddr_equal_rights:0 "Требовать равноправия"
 TOTU_unity_ddr_equal_rights_desc:0 "Никакого аншлюса: объединяются две страны, а не одна поглощает другую. Восточный Берлин требует, чтобы каждое решение принималось за общим столом."
 TOTU_unity_ddr_social_charter:0 "Социальная хартия"
 TOTU_unity_ddr_social_charter_desc:0 "5 марта 1990 года Круглый стол принимает Социальную хартию: право на труд, жильё и детские сады должно пережить любое объединение. В Бонне считают, во что это обойдётся."
 TOTU_unity_ddr_protect_property:0 "Защитить собственность"
 TOTU_unity_ddr_protect_property_desc:0 "Из ФРГ приходят тысячи исков о возврате домов и дач, брошенных при бегстве на Запад. Правительство ГДР настаивает: кто живёт, тот и владеет, а земли реформы 1945–1949 годов не вернут."
 TOTU_unity_ddr_west_voters:0 "Обращение к западным избирателям"
 TOTU_unity_ddr_west_voters_desc:0 "Объединение оплатят западные налогоплательщики, и Оскар Лафонтен напоминает им об этом на каждом митинге. Восточный Берлин подыгрывает: не спешить, считать деньги, договариваться."
 TOTU_unity_ddr_bonn_officials:0 "Чиновники из Бонна"
 TOTU_unity_ddr_bonn_officials_desc:0 "Министерства ГДР берут советников из Бонна: западные чиновники пишут законы, по которым Восток будет жить через полгода. Работа идёт быстро, вопросы о суверенитете задают потом."
 TOTU_unity_ddr_article_23:0 "Присоединение по статье 23"
 TOTU_unity_ddr_article_23_desc:0 "Статья 23 Основного закона позволяет землям просто вступить в ФРГ, как Саар в 1957 году. 23 августа 1990 года Народная палата голосует за вступление с 3 октября: 294 голоса за, 62 против."
 TOTU_unity_ddr_article_146:0 "Конституция по статье 146"
 TOTU_unity_ddr_article_146_desc:0 "Статья 146 обещает общую конституцию, принятую всем народом. В апреле 1990 года рабочая группа Круглого стола предлагает свой проект: объединиться как равные и проголосовать за новый основной закон."
 TOTU_unity_ddr_freeze:0 "Заморозить переговоры"
 TOTU_unity_ddr_freeze_desc:0 "Правительство ПДС отзывает делегацию из Бонна «для консультаций». Улица недовольна, Бонн тоже, зато у Восточного Берлина появляется время."
 TOTU_unity_transfers_east:0 "Трансферты на Восток"
 TOTU_unity_transfers_east_desc:0 "Деньги Бонна уходят на Восток раньше, чем туда приходит единство."
 TOTU_unity_conversion_cost:0 "Обмен один к одному"
 TOTU_unity_conversion_cost_desc:0 "Бундесбанк предлагал обменивать два к одному, правительство выбрало один к одному. Разницу оплатит бюджет."
 TOTU_unity_social_guarantees:0 "Социальные гарантии"
 TOTU_unity_social_guarantees_desc:0 "Хартия обещает сохранить работу, жильё и детские сады. Платить за это пока приходится самой ГДР."
 TOTU_unity_withdrawal_payments:0 "Деньги за вывод войск"
 TOTU_unity_withdrawal_payments_desc:0 "Двенадцать миллиардов марок на вывод войск, из них почти восемь на жильё для офицеров, и ещё три миллиарда беспроцентного кредита. Такова цена согласия Москвы."
 TOTU_unity_german_credits:0 "Немецкие кредиты"
 TOTU_unity_german_credits_desc:0 "Бонн платит за вывод Западной группы войск и даёт кредит. Деньги приходят вовремя, в отличие от всего остального."
 TOTU_unity_growing_together:0 "Срастание"
 TOTU_unity_growing_together_desc:0 "Вилли Брандт сказал, что теперь срастается то, что должно быть вместе. Срастаться придётся долго и дорого."
 TOTU_unity_talks:0 "Переговоры «2+4»"
 TOTU_unity_moscow_consent:0 "Согласие Москвы на объединение"
 TOTU_unity_moscow_veto:0 "Вето Москвы на объединение"
 totu_unity.1.t:0 "Назначен референдум"
 totu_unity.1.d_ger:0 "Шкала объединения заполнена. Бонн и Восточный Берлин назначают общий референдум через две недели. Вклад ФРГ больше, и на голосование выносится вступление ГДР в Федеративную Республику по статье 23 Основного закона."
 totu_unity.1.d_ddr:0 "Шкала объединения заполнена. Бонн и Восточный Берлин назначают общий референдум через две недели. Вклад ГДР больше, и на голосование выносится объединение на условиях Восточного Берлина: Федеративная Республика входит в единое государство вместе с ГДР, а не наоборот."
 totu_unity.1.a:0 "Ждать итогов"
 totu_unity.1.tt:0 "Через §Y14 дней§! пройдёт референдум. Решения германского вопроса больше недоступны."
 totu_unity.3.t:0 "Итоги референдума"
 totu_unity.3.d_ger:0 "Явка выше девяноста процентов по обе стороны бывшей границы. Большинство голосует за вступление ГДР в Федеративную Республику. Завтра над Рейхстагом поднимут флаг единой Германии, а ГДР станет пятью новыми землями."
 totu_unity.3.d_ddr_com:0 "Явка выше девяноста процентов. Большинство голосует за единое государство на условиях Восточного Берлина. Федеративная Республика выходит из НАТО и прекращает существование, бундесвер передаёт оружие Национальной народной армии. Столицей единой Германии становится Берлин."
 totu_unity.3.d_ddr_dem:0 "Явка выше девяноста процентов. Большинство голосует за объединение на условиях Восточного Берлина: новая конституция, нейтральная Германия вне обоих блоков. Федеративная Республика выходит из НАТО, Берлин становится столицей."
 totu_unity.3.a:0 "Германия едина"
 totu_unity.3.b:0 "Подчиниться итогам"
 totu_unity.3.tt_win:0 "Завтра мы §Gобъединим Германию§!."
 totu_unity.3.tt_lose:0 "Завтра наше государство §Rвойдёт в состав соседа§!."
 totu_unity.21.t:0 "Германия едина"
 totu_unity.21.d:0 "В полночь над Рейхстагом поднят чёрно-красно-золотой флаг. Германская Демократическая Республика вошла в состав Федеративной Республики Германии и перестала существовать. Сорок один год раздела закончились референдумом и фейерверком."
 totu_unity.21.a:0 "Карта Европы изменилась"
 totu_unity.21.b:0 "Единство, право и свобода"
 totu_unity.22.t:0 "Германия едина на условиях Востока"
 totu_unity.22.d_com:0 "Над Рейхстагом поднят флаг с молотом и циркулем. Федеративная Республика вошла в единое германское государство на условиях Восточного Берлина и вышла из НАТО. В Брюсселе и Вашингтоне заседают до утра: граница блоков сдвинулась к Рейну."
 totu_unity.22.d_neu:0 "Над Рейхстагом поднят флаг с молотом и циркулем. Федеративная Республика вошла в единое германское государство на условиях Восточного Берлина и вышла из НАТО, а ГДР к этому времени уже покинула Варшавский договор. Социалистическая Германия вне обоих блоков одинаково озадачила Вашингтон и Москву."
 totu_unity.22.d_dem:0 "Над Рейхстагом поднят чёрно-красно-золотой флаг без герба. Германия объединилась на условиях Восточного Берлина: новая конституция, выход ФРГ из НАТО и нейтралитет вне обоих блоков. В Москве довольны, в Вашингтоне считают, во что это обойдётся."
 totu_unity.22.a:0 "Карта Европы изменилась"
 totu_unity.22.b:0 "Германия, единое отечество"
 totu_unity.30.t:0 "Два плюс четыре"
 totu_unity.30.d:0 "Объединение Германии прошло три четверти пути, и без Москвы дальше не двинется: в ГДР стоит Западная группа войск, у СССР права державы-победительницы. Бонн предлагает деньги за вывод войск и признание границ, генералы напоминают о двадцати миллионах погибших."
 totu_unity.30.a:0 "Дать согласие"
 totu_unity.30.b:0 "Наложить вето"
 totu_unity.31.t:0 "Москва согласна"
 totu_unity.31.d:0 "Горбачёв согласен: единая Германия сама выберет союз, Западная группа войск уйдёт до конца 1994 года, а Бонн заплатит за жильё для офицеров. Последнее внешнее препятствие снято."
 totu_unity.31.a:0 "Дальше — референдум"
 totu_unity.32.t:0 "Вето Москвы"
 totu_unity.32.d:0 "Москва отказывается обсуждать объединение, пока в ГДР стоят её войска. Переговоры заморожены на полгода, Западная группа войск остаётся на месте."
 totu_unity.32.a:0 "Ждать"
