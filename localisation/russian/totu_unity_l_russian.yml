 TOTU_un_status_tt:0 "§YГерманский вопрос§!\n\nОбе страны вкладываются в объединение решениями и фокусами. Каждый шаг двигает общую шкалу и записывается во вклад той стороны, на чьих условиях идёт сближение. При §Y100%§! проводится референдум: если больше вклад ФРГ, ГДР присоединяется к ней; если больше вклад ГДР, она объединяет страну на своих условиях. При равенстве побеждает ФРГ."
 TOTU_un_sec_scale:0 "ШКАЛА ОБЪЕДИНЕНИЯ"
 TOTU_un_sec_tug:0 "КТО ТЯНЕТ ОДЕЯЛО НА СЕБЯ"
 TOTU_un_scale_value:0 "[?TOTU_un_scale|0]%"
 TOTU_un_mark_50:0 "50"
 TOTU_un_mark_2p4:0 "[TOTU_un_2p4]"
 TOTU_un_2p4_plain:0 "2+4"
 TOTU_un_2p4_consent:0 "§G2+4§!"
 TOTU_un_2p4_veto:0 "§R2+4§!"
 TOTU_un_mark_ref:0 "[TOTU_un_ref]"
 TOTU_un_ref_plain:0 "референдум"
 TOTU_un_ref_pending:0 "§Yреферендум§!"
 TOTU_un_scale_tt:0 "Шкала объединения: §Y[?TOTU_un_scale|0]%§!.\n\nРастёт от решений и фокусов обеих сторон и сама по себе: улица хочет единства (§Y+1%§! в месяц, §Y+2%§! при демократическом правительстве ГДР). На §Y75%§! своё слово скажет Москва (переговоры «2+4»), на §Y100%§! назначается референдум. Пока переговоры заморожены, шкала не растёт и решения недоступны."
 TOTU_un_side_ddr:0 "ГДР: вклад §Y[?TOTU_un_ddr|0]§! ([?TOTU_un_share_ddr|0]%)"
 TOTU_un_side_ger:0 "ФРГ: вклад §Y[?TOTU_un_ger|0]§! ([?TOTU_un_share_ger|0]%)"
 TOTU_un_tug_tt:0 "Вклад ГДР: §Y[?TOTU_un_ddr|0]§! ([?TOTU_un_share_ddr|0]%), вклад ФРГ: §Y[?TOTU_un_ger|0]§! ([?TOTU_un_share_ger|0]%).\n\nКто тянет одеяло на себя, тот и объединит. Требования ГДР о равноправии и своих условиях идут во вклад ГДР, решения Бонна и уступки Бонну — во вклад ФРГ. Нейтральные шаги двигают шкалу, но ничей вклад не меняют."
 TOTU_un_hint:0 "При 100% — референдум. Объединит тот, чей вклад больше."
 TOTU_unity_category:0 "Германский вопрос"
 TOTU_unity_category_desc:0 "Стена открыта, «Десять пунктов» Коля уже прозвучали. Что объединение будет, почти никто не сомневается. Вопрос в том, кто кого объединит и на чьих условиях."
