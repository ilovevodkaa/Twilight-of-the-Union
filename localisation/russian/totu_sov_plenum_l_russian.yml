l_russian:
 # Пленум ЦК КПСС: события подготовки, заседаний, итогов и кризисов (events/TOTU_SOV_plenum.txt).

 # Подготовка
 totu_plenum.1.t:0 "Проект платформы ЦК"
 totu_plenum.1.d:0 "Комиссия Политбюро разослала членам ЦК проект платформы к XXVIII съезду «К гуманному, демократическому социализму». Впервые в партийном документе сказано, что КПСС не претендует на монополию и готова к политическому соревнованию.\n\nАлександр Яковлев считает эти формулировки необходимым минимумом. Егор Лигачёв называет их сдачей позиций и требует вернуть слова о руководящей роли партии. До пленума текст ещё можно править."
 totu_plenum.1.a:0 "Оставить формулировки Яковлева"
 totu_plenum.1.b:0 "Вернуть в текст руководящую роль партии"
 totu_plenum.1.c:0 "Вынести проект на партийную дискуссию"

 totu_plenum.2.t:0 "Письма из обкомов"
 totu_plenum.2.d:0 "В январе митинги у зданий обкомов в Волгограде, Тюмени и Чернигове заставили первых секретарей уйти в отставку. В ЦК идут письма из областей. Одни секретари просят защитить их от «улицы», другие сообщают, что рядовые коммунисты сдают партбилеты сотнями.\n\nОбласти ждут от пленума ответа, кто теперь решает: обком или партийная конференция."
 totu_plenum.2.a:0 "Защитить секретарей обкомов"
 totu_plenum.2.b:0 "Пусть конференции переизберут руководство"
 totu_plenum.2.c:0 "Отправить в области комиссии ЦК"

 totu_plenum.3.t:0 "Накануне пленума"
 totu_plenum.3.d:0 "4 февраля к Манежной площади прошли около двухсот тысяч человек. Главное требование митинга: отменить 6-ю статью Конституции.\n\nДемократическая платформа, созданная на январской конференции в Москве, требует дать слово её представителям. Лигачёв тем временем собирает первых секретарей и готовит выступления против «развала партии». Список ораторов ещё не утверждён."
 totu_plenum.3.a:0 "Дать слово Демплатформе"
 totu_plenum.3.b:0 "Список ораторов утвердит Политбюро"
 totu_plenum.3.c:0 "Не мешать Лигачёву"

 # Заседания
 totu_plenum.11.t:0 "Пленум: статья шестая"
 totu_plenum.11.d:0 "Пленум открылся докладом Генерального секретаря. Горбачёв предлагает отказаться от закреплённой в Конституции руководящей роли КПСС и бороться за власть на выборах.\n\nБорис Ельцин и Демплатформа требуют отменить статью немедленно. Посол в Польше Владимир Бровиков отвечает, что страну довели до разрухи, а теперь сдают без боя. Зал аплодирует обоим."
 totu_plenum.11.a:0 "Отменить монополию немедленно"
 totu_plenum.11.b:0 "Изменить статью через Съезд, по закону"
 totu_plenum.11.c:0 "Сохранить статью шестую"

 totu_plenum.12.t:0 "Пленум: программа Демплатформы"
 totu_plenum.12.d:0 "Владимир Шостаковский, ректор Московской высшей партийной школы, излагает программу Демократической платформы: отказ от демократического централизма, право на фракции, превращение КПСС в парламентскую партию.\n\nАппарат готовит ответ: открытое письмо ЦК «За консолидацию на принципиальной основе». Сторонников платформы в нём предлагают исключать из партии. Горбачёв письмо пока не подписал."
 totu_plenum.12.a:0 "Признать право на платформы"
 totu_plenum.12.b:0 "Опубликовать открытое письмо ЦК"
 totu_plenum.12.c:0 "Включить авторов в программную комиссию"

 totu_plenum.13.t:0 "Пленум: Лигачёв против Яковлева"
 totu_plenum.13.d:0 "Лигачёв разбирает идеологическую работу: пресса очерняет историю, «Огонёк» и «Московские новости» работают против партии, а покровительствует им член Политбюро Яковлев.\n\nЯковлев отвечает, что партия, которая боится собственной истории, не выиграет ни одних выборов. Два секретаря ЦК спорят третий год. Теперь пленум ждёт, чью сторону займёт Генеральный секретарь."
 totu_plenum.13.a:0 "Поддержать Яковлева"
 totu_plenum.13.b:0 "Поддержать Лигачёва"
 totu_plenum.13.c:0 "Развести обоих по комиссиям"

 totu_plenum.14.t:0 "Пленум: прибалтийский вопрос"
 totu_plenum.14.d:0 "Компартия Литвы во главе с Альгирдасом Бразаускасом в декабре вышла из КПСС. Меньшинство во главе с Миколасом Бурокявичюсом осталось «на платформе КПСС». Такой же раскол назревает в Эстонии и Латвии.\n\nРеспубликанские делегаты спрашивают, может ли КПСС стать федерацией самостоятельных партий. Московские секретари отвечают, что федерация партий станет первым шагом к распаду Союза."
 totu_plenum.14.a:0 "Допустить федерацию компартий"
 totu_plenum.14.b:0 "Опереться на Бурокявичюса"
 totu_plenum.14.c:0 "Давить экономикой, а не уставом"

 totu_plenum.15.t:0 "Пленум: выступление Ельцина"
 totu_plenum.15.d:0 "Ельцин берёт слово вне регламента. Он требует отменить привилегии аппарата, передать власть Советам и разрешить коммунистам состоять в других партиях. Если пленум откажет, говорит он, ему придётся решать, оставаться ли в КПСС.\n\nИван Полозков просит слова для ответа. Зал шумит, председательствующий смотрит на Горбачёва."
 totu_plenum.15.a:0 "Дать Ельцину договорить"
 totu_plenum.15.b:0 "Дать Полозкову ответить от имени ЦК"
 totu_plenum.15.c:0 "Предложить Ельцину сделку"

 totu_plenum.16.t:0 "Пленум: экономическая программа"
 totu_plenum.16.d:0 "Николай Рыжков представляет программу перехода к регулируемой рыночной экономике: цены освобождают поэтапно, начиная с повышения цены на хлеб втрое. После его выступления по телевидению из магазинов исчезли крупа, мука и соль.\n\nГруппа Станислава Шаталина и Григория Явлинского готовит более быстрый план. Госплан предупреждает, что рынок без товаров даст только рост цен."
 totu_plenum.16.a:0 "Регулируемый рынок Рыжкова"
 totu_plenum.16.b:0 "Быстрый переход по плану Шаталина"
 totu_plenum.16.c:0 "Защитить плановое хозяйство"

 totu_plenum.17.t:0 "Пленум: партийная собственность"
 totu_plenum.17.d:0 "Депутаты Советов требуют передать им здания райкомов, типографии и санатории партии. Управляющий делами ЦК Николай Кручина докладывает, что взносы падают вслед за числом членов.\n\nУправление делами предлагает вложить средства в совместные предприятия и коммерческие банки, пока у партии ещё есть деньги. Центральная ревизионная комиссия просит сначала провести проверку."
 totu_plenum.17.a:0 "Передать здания Советам"
 totu_plenum.17.b:0 "Вложить средства в коммерцию"
 totu_plenum.17.c:0 "Сначала ревизия"

 totu_plenum.18.t:0 "Пленум: письмо Андреевой"
 totu_plenum.18.d:0 "Нина Андреева, автор статьи «Не могу поступаться принципами», теперь руководит обществом «Единство». Её сторонники передают в президиум обращение с тысячами подписей: признать ошибочным курс на «буржуазное перерождение» и вернуться к ленинским нормам.\n\nВ 1988 году «Правда» осудила её статью от имени Политбюро. Сейчас обращение поддерживает часть делегатов от армии и оборонных заводов."
 totu_plenum.18.a:0 "Осудить «неосталинизм»"
 totu_plenum.18.b:0 "Признать право на эту позицию"
 totu_plenum.18.c:0 "Оставить обращение без ответа"

 # Итоги
 totu_plenum.31.t:0 "Итоги пленума: победа Демплатформы"
 totu_plenum.31.d:0 "Итоговый документ принят по проекту Демократической платформы. КПСС объявлена парламентской партией: демократический централизм отменён, фракции разрешены, партийная собственность переходит государству.\n\nПобедители требуют идти дальше: рыночная реформа, свободные выборы на всех уровнях, союз с демократическим движением вместо борьбы с ним. Аппарат подчиняется, но многие секретари уходят."
 totu_plenum.31.a:0 "Курс на рынок и многопартийность"
 totu_plenum.31.b:0 "Сначала удержать партию от распада"

 totu_plenum.32.t:0 "Итоги пленума: центр удержал партию"
 totu_plenum.32.d:0 "Большинство проголосовало за платформу Горбачёва. Партия отказывается от монополии, но сохраняет единый устав, а в экономике идёт к рынку под контролем государства. По сути это социал-демократический курс, хотя сам Горбачёв этого слова пока не произносит.\n\nРадикалы считают итог полумерой, консерваторы капитуляцией. Зато партия осталась единой."
 totu_plenum.32.a:0 "Гуманный, демократический социализм"
 totu_plenum.32.b:0 "Опереться на пост президента, а не на ЦК"

 totu_plenum.33.t:0 "Итоги пленума: победа консерваторов"
 totu_plenum.33.d:0 "Большинство пошло за Лигачёвым и Полозковым. Пленум подтвердил руководящую роль партии там, где её ещё можно удержать, и потребовал навести порядок в республиках и на улицах.\n\nКонсерваторы не против рынка, но под контролем государства. Им нужна великая держава с единой армией и единым рублём. Горбачёв остаётся Генеральным секретарём, но курс определяет уже не он."
 totu_plenum.33.a:0 "Порядок и великая держава"
 totu_plenum.33.b:0 "Пока не ссориться с реформаторами"

 totu_plenum.34.t:0 "Итоги пленума: победа ортодоксов"
 totu_plenum.34.d:0 "Неожиданно для Политбюро большинство поддержало «Единство» и депутатов группы «Союз». Пленум осудил «ревизию марксизма», потребовал вернуть партии контроль над печатью и восстановить ленинские нормы партийной жизни.\n\nПобедители требуют вычистить из аппарата «перерожденцев» и прекратить рыночные эксперименты. Большинство у них есть, опыта управления нет."
 totu_plenum.34.a:0 "Вернуться к ленинским нормам"
 totu_plenum.34.b:0 "Не начинать с чисток"

 # Новости
 totu_plenum.41.t:0 "КПСС стала парламентской партией"
 totu_plenum.41.d:0 "Пленум ЦК КПСС в Москве закончился победой Демократической платформы. Партия, которая семь десятилетий управляла Советским Союзом, отказалась от монополии на власть, разрешила фракции и обещает рыночную реформу.\n\nЗападные дипломаты признают, что больше не могут предсказать следующий шаг Москвы."
 totu_plenum.41.a:0 "Москва меняется быстрее, чем ожидали"
 totu_plenum.41.b:0 "Пути назад нет"

 totu_plenum.42.t:0 "Горбачёв удержал партию"
 totu_plenum.42.d:0 "Пленум ЦК КПСС закончился победой сторонников Генерального секретаря. Партия отказывается от монополии на власть, но остаётся единой и сохраняет социалистический курс.\n\nНа Западе итоги встретили с облегчением: собеседник остался прежним. В советской прессе их называют компромиссом, который не устроил ни радикалов, ни консерваторов."
 totu_plenum.42.a:0 "Перестройка продолжается"
 totu_plenum.42.b:0 "Партия осталась единой"

 totu_plenum.43.t:0 "В КПСС победила жёсткая линия"
 totu_plenum.43.d:0 "Пленум ЦК КПСС закончился победой консерваторов во главе с Егором Лигачёвым. Партия подтвердила свою руководящую роль и потребовала навести порядок в республиках.\n\nВ НАТО ждут пересмотра договорённостей о разоружении. Лидеры национальных движений в республиках готовятся к давлению из Москвы."
 totu_plenum.43.a:0 "Москва снова закрывается"
 totu_plenum.43.b:0 "Порядок будет наведён"

 totu_plenum.44.t:0 "Ортодоксы взяли ЦК КПСС"
 totu_plenum.44.d:0 "Пленум ЦК КПСС неожиданно закончился победой ортодоксального крыла. Новое большинство осудило «ревизию марксизма», требует вернуть контроль над печатью и прекратить рыночные эксперименты.\n\nВ западных столицах заговорили о конце перестройки. Советские газеты публикуют решения пленума без комментариев."
 totu_plenum.44.a:0 "Перестройка закончилась?"
 totu_plenum.44.b:0 "Вернёмся к ленинским нормам"

 # Кризисы
 totu_plenum.50.t:0 "Демарш Демократической платформы"
 totu_plenum.50.d:0 "Лидеры Демократической платформы заявили, что больше не видят смысла оставаться в КПСС. Они призывают сторонников сдать партбилеты и создать собственную партию. Парткомы заводов и институтов в Москве, Ленинграде и Свердловске сообщают о массовых заявлениях о выходе.\n\nУходя, демократы уведут часть самых активных коммунистов, но заберут с собой и часть напряжения."
 totu_plenum.50.a:0 "Отпустить их"
 totu_plenum.50.b:0 "Уговорить остаться"
 totu_plenum.50.c:0 "Исключить зачинщиков"

 totu_plenum.51.t:0 "Заговор ортодоксов"
 totu_plenum.51.d:0 "Группа секретарей обкомов, депутаты группы «Союз» и общество «Единство» собирают подписи за созыв чрезвычайного пленума и смену руководства. В их письмах говорится о «чрезвычайном положении в отдельных регионах».\n\nКГБ докладывает, что нити ведут в армию и на оборонные заводы. Председатель Комитета советует не поднимать шума."
 totu_plenum.51.a:0 "Разоблачить их на заседании ЦК"
 totu_plenum.51.b:0 "Пойти на уступки"
 totu_plenum.51.c:0 "Поручить разобраться КГБ"

 totu_plenum.52.t:0 "Раскол партии"
 totu_plenum.52.d:0 "Партия больше не говорит одним голосом. Республиканские компартии не выполняют решений ЦК, а в крупных городах работают по две-три параллельные организации, и каждая называет себя настоящей КПСС.\n\nСекретари требуют чрезвычайного съезда. Радикалы с обеих сторон предлагают разделиться официально, а имущество поделить по числу сторонников."
 totu_plenum.52.a:0 "Признать раскол и разделить партию"
 totu_plenum.52.b:0 "Удержать единство любой ценой"
 totu_plenum.52.c:0 "Созвать чрезвычайный съезд"

 totu_plenum.53.t:0 "Кризис в ЦК"
 totu_plenum.53.d:0 "Правящая группа в ЦК потеряла большинство. Её решения проходят с трудом или не проходят вовсе, а соперники открыто говорят, что курс партии пора менять.\n\nГенеральный секретарь может уступить часть постов, опереться на тех, кто остался верен, или перетасовать Политбюро и рискнуть потерять и тех, и других."
 totu_plenum.53.a:0 "Уступить посты новому большинству"
 totu_plenum.53.b:0 "Опереться на верных"
 totu_plenum.53.c:0 "Перетасовать Политбюро"
