 # события
 totu_ddr.1.t:0 "Штурм Норманненштрассе"
 totu_ddr.1.d:0 "15 января тысячи людей прорываются в штаб-квартиру госбезопасности на Норманненштрассе в Восточном Берлине. За воротами — корпуса архивов и кабинеты Мильке. Гражданские комитеты требуют пустить их внутрь: опечатать документы, пока толпа не разнесла всё, а офицеры не уничтожили остальное."
 totu_ddr.1.a:0 "Пустить гражданские комитеты"
 totu_ddr.1.b:0 "Выставить оцепление"
 totu_ddr.3.t:0 "Выборы в Народную палату"
 totu_ddr.3.d_alliance:0 "18 марта ГДР впервые голосует свободно, явка — 93 процента. «Альянс за Германию» во главе с ХДС берёт 48 процентов: восток проголосовал за марку и за Коля, которого не было ни в одном бюллетене. Премьером станет Лотар де Мезьер, адвокат и бывший альтист."
 totu_ddr.3.d_spd:0 "18 марта ГДР впервые голосует свободно, явка — 93 процента. Социал-демократы, которых все опросы зимы считали фаворитами, побеждают. Ибрагим Бёме обещает объединение без спешки и без распродажи."
 totu_ddr.3.d_pds:0 "18 марта ГДР впервые голосует свободно, явка — 93 процента. Вопреки всем прогнозам ПДС Грегора Гизи остаётся первой силой: страна, которой предлагали исчезнуть, решила пожить ещё. Модров остаётся премьером."
 totu_ddr.3.a:0 "Правительство де Мезьера"
 totu_ddr.3.b:0 "Правительство Бёме"
 totu_ddr.3.c:0 "Модров остаётся"
